/article><article class="manual-feature"><div class="manual-feature-copy"><h3>すべてのデータをリセット</h3><p class="manual-feature-body">この端末に保存された記録と写真をすべて削除します。先にバックアップしてください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>通知設定</h3><p class="manual-feature-body">重要なアプリ通知を受け取るために使用します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>振動</h3><p class="manual-feature-body">アプリの操作に振動を使用します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>データ使用量</h3><p class="manual-feature-body">バックアップのアップロードにWi-Fiのみを使うか、モバイルデータも使うかを選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ユーザーガイド</h3><p class="manual-feature-body">機能別の画面とアイコンの説明で、アプリの使い方を確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>サポート</h3><p class="manual-feature-body">使い方の質問、不具合の報告、機能の提案をメールで送れます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>プライバシーポリシー</h3><p class="manual-feature-body">データの収集と処理の詳細を確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>について</h3><p class="manual-feature-body">アプリのバージョン、利用規約、オープンソースライセンスを確認します。</p></div></article></section></details><details class="manual-nojs-locale" lang="hi" dir="ltr"><summary>हिन्दी</summary><section><h2>1. होम</h2><p><a class="manual-nojs-original" href="images/hi/guide-main.webp?v=3ab841137413" target="_blank" rel="noopener">मूल चित्र देखें (नया टैब): होम</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>नया कार्यस्थल</h3><p class="manual-feature-body">कार्यस्थल जोड़ने पर उपस्थिति, भुगतान विवरण और रिपोर्ट उससे जुड़ जाते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मौजूदा GPS स्थान से पता भरें</h3><p class="manual-feature-body">मौजूदा स्थान से कार्यस्थल का पता भरें। वास्तविक पता जाँचें और ज़रूरत हो तो सुधारें।</p><p class="manual-feature-notice">GPS से मिला पता कार्यस्थल के वास्तविक पते से अलग हो सकता है। सहेजने से पहले वास्तविक पता जाँचें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्यस्थल बदलें</h3><p class="manual-feature-body">कई कार्यस्थल जोड़कर ज़रूरत के अनुसार चुन सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्यस्थल · संपादित करें</h3><p class="manual-feature-body">जुड़े कार्यस्थल की जानकारी और वेतन के मूल मान बदलें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्य शुरू करें · कार्य समाप्त करें</h3><p class="manual-feature-body">आने-जाने का समय दर्ज करने पर कार्य अवधि अपने आप गणना होकर भुगतान विवरण और रिपोर्ट में जुड़ती है।</p><p class="manual-feature-notice">ध्यान दें: गणना किए गए कार्य समय को भुगतान विवरण या PDF पूर्वावलोकन में बदल नहीं सकते।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ब्रेक</h3><p class="manual-feature-body">विराम का समय तय करने पर वास्तविक कार्य अवधि और वेतन की गणना में वह शामिल होता है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>वेतन गणना</h3><p class="manual-feature-body">वेतन प्रति घंटा या दैनिक दर से अपने आप गणना होता है; साप्ताहिक, मासिक या अन्य भुगतान चक्र चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>आय · भत्ता</h3><p class="manual-feature-body">कार्य रिकॉर्ड की दर और भत्ते देखकर ज़रूरी राशियाँ बदल सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्य ज्ञापन</h3><p class="manual-feature-body">कार्यस्थल की स्थिति और काम का विवरण कार्य रिकॉर्ड के साथ रखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़ोटो लें</h3><p class="manual-feature-body">कार्यस्थल की फ़ोटो लें और गैलरी में परिणाम देखें।</p></div></article></section><section><h2>2. गैलरी</h2><p><a class="manual-nojs-original" href="images/hi/guide-gallery.webp?v=34a0c38ae83f" target="_blank" rel="noopener">मूल चित्र देखें (नया टैब): गैलरी</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>गैलरी</h3><p class="manual-feature-body">खींची गई फ़ोटो देखें, संपादित करें या साझा करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>खोजें</h3><p class="manual-feature-body">कार्यस्थल, अवधि और श्रेणी के अनुसार ज़रूरी फ़ोटो खोजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्यस्थल</h3><p class="manual-feature-body">चुने हुए कार्यस्थल से जुड़ी तस्वीरें एक साथ देखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सब</h3><p class="manual-feature-body">सभी तस्वीरें देखने के लिए खोज और कार्यस्थल के फ़िल्टर हटाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>दैनिक</h3><p class="manual-feature-body">तस्वीरों को खींचे जाने की तारीख के अनुसार देखें और ज़रूरी तारीख खोलें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>चयन करें</h3><p class="manual-feature-body">कई फ़ोटो चुनकर एक साथ साझा या हटा सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>तस्वीरें</h3><p class="manual-feature-body">फ़ोटो खोलकर दो उँगलियों से ज़ूम करके विवरण देखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फोटो संपादक</h3><p class="manual-feature-body">फ़ोटो में निशान और लिखावट जोड़ें और ज़रूरत पर मूल फ़ोटो वापस पाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>तीर</h3><p class="manual-feature-body">फ़ोटो के अहम हिस्सों को उभारें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सर्कल हाइलाइट</h3><p class="manual-feature-body">तस्वीर के जिस हिस्से को उभारना है, उस पर गोला बनाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>आयताकार बॉक्स</h3><p class="manual-feature-body">ज़रूरी हिस्से को आयताकार बॉक्स से चिह्नित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मोज़ेक</h3><p class="manual-feature-body">साझा की जाने वाली फ़ोटो में छिपाने वाले हिस्सों पर मोज़ेक लगाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>टेक्स्ट जोड़ें</h3><p class="manual-feature-body">तस्वीर पर ज़रूरी विवरण या नोट जोड़ें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पाठ संरेखण</h3><p class="manual-feature-body">पढ़ने में आसानी के लिए बॉक्स के भीतर टेक्स्ट को बाएँ, बीच या दाएँ संरेखित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पाठ का आकार</h3><p class="manual-feature-body">जोड़े गए टेक्स्ट का आकार ऐसा रखें कि वह तस्वीर पर आसानी से पढ़ा जा सके।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>बोल्ड टेक्स्ट</h3><p class="manual-feature-body">ज़रूरी टेक्स्ट को अधिक मोटा करके उभारें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>रंग</h3><p class="manual-feature-body">टेक्स्ट और आकृतियों के ऐसे रंग चुनें जो तस्वीर की पृष्ठभूमि से अलग दिखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अपारदर्शिता</h3><p class="manual-feature-body">तय करें कि टेक्स्ट और आकृतियाँ तस्वीर को कितना ढकें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>घुमाएँ</h3><p class="manual-feature-body">तस्वीर को 90 डिग्री के चरणों में घुमाकर देखने की सही दिशा में रखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पूर्ववत करें</h3><p class="manual-feature-body">फ़ोटो पर सबसे हाल में जोड़े गए टेक्स्ट, आकार या अन्य निशान को पूर्ववत करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फिर करें</h3><p class="manual-feature-body">पूर्ववत किए गए टेक्स्ट, आकार या अन्य निशान को फिर से लागू करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>चयनित ऑब्जेक्ट हटाएँ</h3><p class="manual-feature-body">तस्वीर पर जोड़े गए टेक्स्ट या आकृतियों में से केवल चुनी हुई वस्तु हटाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सहेजें</h3><p class="manual-feature-body">फ़ोटो विवरण में संपादित संस्करण दिखता है। खींची गई मूल फ़ोटो सुरक्षित रहती है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मूल पुनर्स्थापित करें</h3><p class="manual-feature-body">संपादन हटाकर सुरक्षित रखी गई मूल फ़ोटो पर वापस जाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>साझा करें</h3><p class="manual-feature-body">मौजूदा संपादन वाली फ़ोटो की प्रति दूसरे ऐप में साझा करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>हटाएँ</h3><p class="manual-feature-body">फ़ोटो हटाते समय गैलरी और जुड़े दस्तावेज़ों पर लागू दायरा जाँचें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अनुलग्नक · नई पहले · पुरानी पहले</h3><p class="manual-feature-body">तस्वीरें संलग्न करते समय उन्हें नई या पुरानी पहले के क्रम में लगाकर ज़रूरी तस्वीरें खोजें।</p></div></article></section><section><h2>3. हिसाब-किताब</h2><p><a class="manual-nojs-original" href="images/hi/guide-settlement.webp?v=33795881a77c" target="_blank" rel="noopener">मूल चित्र देखें (नया टैब): हिसाब-किताब</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>हिसाब-किताब</h3><p class="manual-feature-body">कार्य रिकॉर्ड और वेतन सेटिंग के आधार पर भुगतान की राशि अपने आप गणना होती है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>दैनिक · साप्ताहिक · मासिक</h3><p class="manual-feature-body">मेल खाते रिकॉर्ड दिखाने के लिए कोई दिनांक या अवधि चुनें; कार्यस्थल और खोज फ़िल्टर भी लागू होते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>खोजें</h3><p class="manual-feature-body">अवधि, कार्यस्थल और अन्य शर्तों के अनुसार निपटान विवरण खोजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>संपादित करें</h3><p class="manual-feature-body">सहेजे भुगतान विवरण खोलकर दर, भत्ते और दावे बदल सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>भुगतान अनुरोध</h3><p class="manual-feature-body">अलग से माँगी जाने वाली राशि और अनुरोध तथा प्राप्ति की स्थिति संभालें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अनुलग्नक</h3><p class="manual-feature-body">गैलरी की फ़ोटो दस्तावेज़ में जोड़ें और उनका क्रम तय करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पीडीएफ पूर्वावलोकन · संपादित करें</h3><p class="manual-feature-body">PDF सहेजने से पहले संपादन योग्य सामग्री और संलग्न फ़ोटो बदल सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सहेजें</h3><p class="manual-feature-body">निपटान में सहेजें बटन दस्तावेज़ के बदलाव सहेजता है। PDF बनाने के लिए साझा करें पर टैप करें, फिर गंतव्य ऐप में अलग से सहेजें या भेजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>साझा करें</h3><p class="manual-feature-body">निपटान साझा करने में PDF और संलग्न फ़ोटो शामिल होती हैं। गंतव्य ऐप चुनने से पहले फ़ाइलों की संख्या और सामग्री जाँचें।</p></div></article></section><section><h2>4. रिपोर्ट</h2><p><a class="manual-nojs-original" href="images/hi/guide-report.webp?v=434b6d2f2ea0" target="_blank" rel="noopener">मूल चित्र देखें (नया टैब): रिपोर्ट</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>रिपोर्ट</h3><p class="manual-feature-body">कार्य रिकॉर्ड और संलग्न फ़ोटो को PDF में व्यवस्थित करके साझा करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>दैनिक · साप्ताहिक · मासिक · खोजें</h3><p class="manual-feature-body">मेल खाते रिकॉर्ड दिखाने के लिए कोई दिनांक या अवधि चुनें; कार्यस्थल और खोज फ़िल्टर भी लागू होते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पीडीएफ पूर्वावलोकन · संपादित करें</h3><p class="manual-feature-body">PDF सहेजने से पहले संपादन योग्य सामग्री और संलग्न फ़ोटो बदल सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अनुलग्नक</h3><p class="manual-feature-body">गैलरी की फ़ोटो दस्तावेज़ में जोड़ें और उनका क्रम तय करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · सहेजें</h3><p class="manual-feature-body">वर्तमान दस्तावेज़ से एक पीडीएफ तैयार करें; बाहरी प्रतिलिपि रखने के लिए साझा करें का उपयोग करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>साझा करें</h3><p class="manual-feature-body">वर्तमान पीडीएफ जेनरेट करें और एक साझाकरण प्रारूप और प्राप्तकर्ता ऐप चुनें।</p></div></article></section><section><h2>5. कैमरा</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>QR कोड स्कैन करें</h3><p class="manual-feature-body">QR कोड से वेब पेज खोलें या सामान्य टेक्स्ट कॉपी करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़्लैश</h3><p class="manual-feature-body">अँधेरी जगह में विषय साफ़ दिखाने के लिए फ़्लैश इस्तेमाल करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>जीपीएस स्थान रिकार्ड</h3><p class="manual-feature-body">“जीपीएस स्थान रिकार्ड” बंद होने पर ऐप फ़ोटो के रिकॉर्ड में निर्देशांक नहीं सहेजता। “पता दिखाएँ” एक अलग सेटिंग है। इसे चालू करने और स्थान की अनुमति देने पर ऐप मौजूदा स्थान का पता खोजकर दिखा सकता है और फ़ोटो लेते समय उसे फ़ोटो के रिकॉर्ड में सहेज सकता है। मूल JPEG में मौजूद EXIF डेटा ज्यों का त्यों रहता है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>स्थान</h3><p class="manual-feature-body">मौजूदा स्थान फिर जाँचकर फ़ोटो की स्थान जानकारी ताज़ा करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ओवरले जानकारी</h3><p class="manual-feature-body">चुनें कि तस्वीर पर कैप्चर जानकारी भी शामिल करनी है या नहीं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़ोटो की जानकारी</h3><p class="manual-feature-body">तस्वीर पर दिखाने के लिए कार्यस्थल, स्थान, नोट और जानकारी की शैली चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>वापस</h3><p class="manual-feature-body">कैमरा बंद करें और पिछली स्क्रीन पर वापस लौटें; सहेजी गई फ़ोटो शेष हैं.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कार्यस्थल</h3><p class="manual-feature-body">कैमरा ओवरले में वर्तमान कार्यस्थल का नाम प्रदर्शित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>जीपीएस</h3><p class="manual-feature-body">शूटिंग के स्थान के सटीक निर्देशांक रखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मेमो</h3><p class="manual-feature-body">कार्यस्थल की स्थिति या ज़रूरी बातें फ़ोटो में दर्ज करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पता</h3><p class="manual-feature-body">कैमरा ओवरले में जीपीएस पता प्रदर्शित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>दिनांक</h3><p class="manual-feature-body">फ़ोटो पर खींचने की तारीख और समय रखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पाठ का रंग</h3><p class="manual-feature-body">फ़ोटो की पृष्ठभूमि पर शूटिंग की जानकारी साफ़ दिखाएँ।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पाठ की अपारदर्शिता · पठनीयता छाया</h3><p class="manual-feature-body">पृष्ठभूमि पर टेक्स्ट पढ़ने योग्य रखने के लिए अपारदर्शिता और छाया की तीव्रता बदलें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>जानकारी कार्ड खिसकाएँ</h3><p class="manual-feature-body">जानकारी वाला कार्ड खींचकर ऐसी जगह रखें जहाँ वह फ़ोटो को न ढके।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>चमक</h3><p class="manual-feature-body">कार्यस्थल के विवरण साफ़ लेने के लिए एक्सपोज़र बदलें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कैमरा ज़ूम</h3><p class="manual-feature-body">कैमरे का ज़ूम ऐसा रखें कि विषय मनचाहे आकार में दिखाई दे।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ग्रिड</h3><p class="manual-feature-body">ग्रिड से तस्वीर लेते समय क्षितिज और रचना को सही रखने में मदद मिलती है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कैमरा बदलें</h3><p class="manual-feature-body">ज़रूरी दिशा में तस्वीर लेने के लिए सामने और पीछे के कैमरे के बीच बदलें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़ोटो लें</h3><p class="manual-feature-body">कार्यस्थल की फ़ोटो लें और गैलरी में परिणाम देखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>हाल की फ़ोटो जाँचें</h3><p class="manual-feature-body">हाल में ली गई तस्वीरें खोलकर नतीजा तुरंत देखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>दोनों दिशाओं में लैंडस्केप फ़ोटो</h3><p class="manual-feature-body">व्यापक दृश्य लेने के लिए डिवाइस को आड़ा करें।</p></div></article></section><section><h2>6. सेटिंग्स</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>भाषा और क्षेत्र</h3><p class="manual-feature-body">डिस्प्ले भाषा और अपना वर्तमान देश/क्षेत्र चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>भाषा</h3><p class="manual-feature-body">ऐप में उपयोग की जाने वाली भाषा चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>वर्तमान देश/क्षेत्र</h3><p class="manual-feature-body">तारीख, संख्या और मुद्रा दिखाने के प्रारूप चुने गए देश/क्षेत्र के आधार पर सेट किए जाते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मुद्रा</h3><p class="manual-feature-body">अपनी मुद्रा के अनुसार राशि का प्रदर्शन बदल सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>समय प्रारूप सेटिंग्स</h3><p class="manual-feature-body">चुनें कि दिनांक और समय कैसे प्रदर्शित किए जाएं.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>थीम सेटिंग्स</h3><p class="manual-feature-body">आसपास की रोशनी के अनुसार हल्का या गहरा रूप चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>मेरी जानकारी</h3><p class="manual-feature-body">दोबारा इस्तेमाल होने वाली कर्मचारी और वेतन डिफ़ॉल्ट जानकारी प्रबंधित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कैमरा सेटिंग्स</h3><p class="manual-feature-body">अपनी ज़रूरत के अनुसार तस्वीर लेना, स्थान दर्ज करना और जानकारी दिखाना सेट करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>चेक-इन फोटो</h3><p class="manual-feature-body">चेक-इन शुरू होने से पहले कैमरा कैप्चर करना आवश्यक है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>चेक-आउट फ़ोटो</h3><p class="manual-feature-body">चेक-आउट सहेजे जाने से पहले कैमरा कैप्चर की आवश्यकता है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>छवि संपादन</h3><p class="manual-feature-body">फोटो विवरण संपादन और संपादित छवि भंडारण की अनुमति दें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फोटो शेयरिंग</h3><p class="manual-feature-body">फोटो विवरण और गैलरी चयन से तस्वीरें साझा करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>रिपोर्ट फोटो अनुलग्नक</h3><p class="manual-feature-body">रिपोर्ट दिनांक पर ली गई गैलरी फ़ोटो संलग्न करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़ोटो लेते समय कंपन</h3><p class="manual-feature-body">फ़ोटो लेने में सफलता या विफलता की सूचना कंपन से मिलती है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>फ़ोटो लेते समय शटर की आवाज़</h3><p class="manual-feature-body">फ़ोटो लेते समय शटर की आवाज़ बजती है। इसे बंद नहीं किया जा सकता, लेकिन आवाज़ का स्तर 1 से 10 तक बदला जा सकता है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>संपीड़ित प्रति सहेजें</h3><p class="manual-feature-body">मूल को रखते हुए एक संपीड़ित संपादित प्रति संग्रहीत करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>गैलरी सेटिंग्स</h3><p class="manual-feature-body">एक साथ अधिक तस्वीरें देखने या उन्हें बड़े रूप में देखने के लिए थंबनेल का आकार चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अनुमतियाँ</h3><p class="manual-feature-body">TAIPOPO सुविधाओं के लिए आवश्यक अनुमति स्थिति की जाँच करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>रिकार्ड सुरक्षा</h3><p class="manual-feature-body">तस्वीरों के स्रोत, कैप्चर जानकारी और संपादन इतिहास दर्ज करने के नियम देखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>बैकअप</h3><p class="manual-feature-body">कार्य रिकॉर्ड, फ़ोटो और सेटिंग की अलग प्रति रखें और पूरा होना जाँचें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>इस डिवाइस पर बैकअप लें</h3><p class="manual-feature-body">बैकअप को इस डिवाइस के आंतरिक स्टोरेज में सहेजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>SD कार्ड या USB पर बैकअप</h3><p class="manual-feature-body">कनेक्ट किए गए SD कार्ड या USB स्टोरेज डिवाइस पर बैकअप सहेजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>बाहरी बैकअप बनाएँ</h3><p class="manual-feature-body">बैकअप की प्रति दूसरे ऐप में भेजें। चुने गए ऐप में जाँचें कि वह सहेजी गई है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive बैकअप</h3><p class="manual-feature-body">बैकअप Google Drive में सहेजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive बैकअप प्रबंधित करें</h3><p class="manual-feature-body">तारीख के अनुसार बैकअप देखें और स्वयं हटाएँ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive से पुनर्स्थापित करें</h3><p class="manual-feature-body">Google Drive में सहेजी गई बैकअप सूची से चुनें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>पुनर्स्थापित करें</h3><p class="manual-feature-body">पुनर्स्थापना मौजूदा डेटा को बैकअप से बदल देती है, इसलिए पहले मौजूदा डेटा का बैकअप लें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>गैलरी संग्रहण जांच एवं पुनर्प्राप्ति</h3><p class="manual-feature-body">किसी रिकॉर्ड से न जुड़ी तस्वीर फ़ाइलों की जाँच करें और पुष्टि के बाद साफ़ करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>डेटा प्रबंधन</h3><p class="manual-feature-body">भंडारण उपयोग और डेटा रीसेट प्रबंधित करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अस्थायी फ़ाइल सफ़ाई</h3><p class="manual-feature-body">अनावश्यक अस्थायी फ़ाइलें हटाकर स्टोरेज में जगह खाली करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कचरा</h3><p class="manual-feature-body">आप उन्हें 30 दिनों के लिए कूड़ेदान से पुनर्स्थापित कर सकते हैं।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सभी डेटा रीसेट करें</h3><p class="manual-feature-body">इस डिवाइस में सहेजे सभी रिकॉर्ड और फ़ोटो हट जाते हैं; पहले बैकअप लें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>अधिसूचना सेटिंग्स</h3><p class="manual-feature-body">महत्वपूर्ण ऐप सूचनाएँ पाने के लिए इसका उपयोग किया जाता है।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>कंपन</h3><p class="manual-feature-body">ऐप इंटरैक्शन के लिए कंपन का उपयोग करें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>डेटा उपयोग</h3><p class="manual-feature-body">चुनें कि बैकअप केवल Wi-Fi से अपलोड हों या मोबाइल डेटा से भी।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>उपयोगकर्ता मार्गदर्शिका</h3><p class="manual-feature-body">फ़ीचर की स्क्रीन और आइकन के विवरण से ऐप का इस्तेमाल सीखें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>सहायता</h3><p class="manual-feature-body">ईमेल से सवाल, त्रुटि रिपोर्ट और फ़ीचर सुझाव भेजें।</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>गोपनीयता नीति</h3><p class="manual-feature-body">डेटा संग्रहण और प्रबंधन विवरण की समीक्षा करें.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>के बारे में</h3><p class="manual-feature-body">ऐप का संस्करण, इस्तेमाल की शर्तें और ओपन-सोर्स लाइसेंस देखें।</p></div></article></section></details><details class="manual-nojs-locale" lang="pt" dir="ltr"><summary>Português</summary><section><h2>1. Início</h2><p><a class="manual-nojs-original" href="images/pt/guide-main.webp?v=b9eb013afdfd" target="_blank" rel="noopener">Ver original (nova aba): Início</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Novo local de trabalho</h3><p class="manual-feature-body">Cadastre um local de trabalho para vincular ponto, acertos e relatórios.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Usar localização GPS atual para o endereço</h3><p class="manual-feature-body">Preencha o endereço do local de trabalho com a localização atual. Confira o endereço real e corrija se necessário.</p><p class="manual-feature-notice">O endereço do GPS pode ser diferente do endereço real do local de trabalho. Confira antes de salvar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mudar local de trabalho</h3><p class="manual-feature-body">Cadastre vários locais de trabalho e selecione o desejado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Local de trabalho · Editar</h3><p class="manual-feature-body">Edite os dados e as configurações padrão de pagamento do local cadastrado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Entrada · Saída</h3><p class="manual-feature-body">Ao registrar entrada e saída, as horas são calculadas automaticamente para acertos e relatórios.</p><p class="manual-feature-notice">Atenção: As horas calculadas não podem ser alteradas nos acertos nem na prévia do PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Intervalo</h3><p class="manual-feature-body">As pausas são consideradas no cálculo das horas efetivas e da remuneração.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cálculo salarial</h3><p class="manual-feature-body">A remuneração é calculada por hora ou por dia; escolha pagamento semanal, mensal ou outro ciclo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Renda · Adicional</h3><p class="manual-feature-body">Confira a tarifa e os adicionais do registro e ajuste os valores necessários.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Memorando de trabalho</h3><p class="manual-feature-body">Registre condições do local e detalhes do trabalho junto aos registros.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tirar foto</h3><p class="manual-feature-body">Registre o local em fotos e veja os resultados na galeria.</p></div></article></section><section><h2>2. Galeria</h2><p><a class="manual-nojs-original" href="images/pt/guide-gallery.webp?v=9034ed387b4a" target="_blank" rel="noopener">Ver original (nova aba): Galeria</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galeria</h3><p class="manual-feature-body">Veja, edite ou compartilhe as fotos capturadas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pesquisar</h3><p class="manual-feature-body">Encontre fotos por local de trabalho, período e categoria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Local de trabalho</h3><p class="manual-feature-body">Veja juntas as fotos vinculadas ao local de trabalho selecionado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Todos</h3><p class="manual-feature-body">Remova os filtros de pesquisa e local de trabalho para ver todas as fotos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente</h3><p class="manual-feature-body">Explore as fotos por data de captura e abra o dia desejado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Selecionar</h3><p class="manual-feature-body">Selecione várias fotos para compartilhar ou excluir de uma vez.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos</h3><p class="manual-feature-body">Abra a foto e amplie com dois dedos para ver os detalhes.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Editor de fotos</h3><p class="manual-feature-body">Adicione marcações e texto às fotos e restaure o original quando precisar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flecha</h3><p class="manual-feature-body">Destaque partes importantes da foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Destaque do círculo</h3><p class="manual-feature-body">Circule a parte da foto que deseja destacar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Caixa Retângulo</h3><p class="manual-feature-body">Marque com um retângulo a área que merece atenção.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaico</h3><p class="manual-feature-body">Aplique mosaico nas áreas que deseja ocultar na foto a compartilhar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adicionar texto</h3><p class="manual-feature-body">Adicione explicações ou anotações úteis à foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alinhamento de texto</h3><p class="manual-feature-body">Alinhe o texto à esquerda, ao centro ou à direita na caixa para facilitar a leitura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tamanho do texto</h3><p class="manual-feature-body">Ajuste o tamanho do texto adicionado para que fique legível na foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Texto em negrito</h3><p class="manual-feature-body">Deixe o texto importante mais grosso para destacá-lo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cor</h3><p class="manual-feature-body">Escolha cores de texto e formas que se destaquem do fundo da foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacidade</h3><p class="manual-feature-body">Ajuste quanto o texto e as formas cobrem a foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Girar</h3><p class="manual-feature-body">Gire a foto em etapas de 90 graus para deixá-la na orientação desejada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Desfazer</h3><p class="manual-feature-body">Desfaz o último texto, forma ou outra marca adicionada à foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Refazer</h3><p class="manual-feature-body">Reaplica o texto, a forma ou outra marca que foi desfeita.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Excluir objeto selecionado</h3><p class="manual-feature-body">Remova apenas o texto ou a forma selecionados na foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salvar</h3><p class="manual-feature-body">A versão editada aparece nos detalhes da foto. A captura original é preservada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar Original</h3><p class="manual-feature-body">Remova as edições e volte à foto original preservada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartilhar</h3><p class="manual-feature-body">Compartilhe em outro aplicativo uma cópia com as edições atuais.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Excluir</h3><p class="manual-feature-body">Ao excluir uma foto, confira o alcance na galeria e nos documentos vinculados.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anexos · Mais recentes primeiro · Mais antigas primeiro</h3><p class="manual-feature-body">Ao anexar fotos, ordene pelas mais recentes ou mais antigas para encontrar as necessárias.</p></div></article></section><section><h2>3. Liquidação</h2><p><a class="manual-nojs-original" href="images/pt/guide-settlement.webp?v=d613774659b7" target="_blank" rel="noopener">Ver original (nova aba): Liquidação</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Liquidação</h3><p class="manual-feature-body">Os valores são calculados automaticamente com base nos registros e nas configurações de pagamento.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente · Semanalmente · Mensalmente</h3><p class="manual-feature-body">Escolha uma data ou período para mostrar os registros correspondentes; filtros de local de trabalho e de pesquisa também se aplicam.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pesquisar</h3><p class="manual-feature-body">Encontre acertos por período, local de trabalho e outros critérios.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Editar</h3><p class="manual-feature-body">Reabra acertos salvos para alterar tarifas, adicionais e cobranças.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cobrança</h3><p class="manual-feature-body">Gerencie cobranças separadas e o status de solicitação e recebimento.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anexos</h3><p class="manual-feature-body">Adicione fotos da galeria ao documento e organize a ordem.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Visualização de PDF · Editar</h3><p class="manual-feature-body">Altere os campos editáveis e as fotos anexadas antes de salvar em PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salvar</h3><p class="manual-feature-body">Salvar na liquidação salva as alterações do documento. Para criar um PDF, toque em Compartilhar e depois salve ou envie separadamente no aplicativo de destino.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartilhar</h3><p class="manual-feature-body">O compartilhamento da liquidação inclui o PDF e as fotos anexadas. Confira a quantidade e o conteúdo dos arquivos antes de escolher o aplicativo de destino.</p></div></article></section><section><h2>4. Relatório</h2><p><a class="manual-nojs-original" href="images/pt/guide-report.webp?v=79d57589ccf1" target="_blank" rel="noopener">Ver original (nova aba): Relatório</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Relatório</h3><p class="manual-feature-body">Organize registros e fotos anexadas em um PDF para compartilhar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente · Semanalmente · Mensalmente · Pesquisar</h3><p class="manual-feature-body">Escolha uma data ou período para mostrar os registros correspondentes; filtros de local de trabalho e de pesquisa também se aplicam.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Visualização de PDF · Editar</h3><p class="manual-feature-body">Altere os campos editáveis e as fotos anexadas antes de salvar em PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anexos</h3><p class="manual-feature-body">Adicione fotos da galeria ao documento e organize a ordem.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Salvar</h3><p class="manual-feature-body">Gere um PDF a partir do documento atual; use Compartilhar para manter uma cópia externa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartilhar</h3><p class="manual-feature-body">Gere o PDF atual e escolha um formato de compartilhamento e um aplicativo de destinatário.</p></div></article></section><section><h2>5. Câmera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Digitalize o código QR</h3><p class="manual-feature-body">Abra páginas web a partir de códigos QR ou copie texto simples.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flash</h3><p class="manual-feature-body">Use o flash para visualizar melhor o objeto em locais escuros.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Registro de localização GPS</h3><p class="manual-feature-body">Com “Registro de localização GPS” desativado, o aplicativo não salva coordenadas no registro da foto. “Mostrar endereço” é uma configuração separada. Se ela estiver ativada e houver permissão de localização, o aplicativo pode consultar e exibir o endereço da localização atual e salvá-lo no registro da foto no momento da captura. Os dados EXIF do JPEG original são preservados sem alterações.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Localização</h3><p class="manual-feature-body">Verifique novamente a localização para atualizar as informações do local da captura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informações de sobreposição</h3><p class="manual-feature-body">Escolha se deseja incluir informações de captura na foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informações da foto</h3><p class="manual-feature-body">Escolha o local de trabalho, a localização, as notas e o estilo das informações na foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Voltar</h3><p class="manual-feature-body">Feche a câmera e volte para a tela anterior; as fotos salvas permanecem.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Local de trabalho</h3><p class="manual-feature-body">Exiba o nome do local de trabalho atual na sobreposição da câmera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Registre as coordenadas exatas do local da captura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Memorando</h3><p class="manual-feature-body">Registre na foto as condições do local ou anotações necessárias.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Endereço</h3><p class="manual-feature-body">Exiba o endereço GPS na sobreposição da câmera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Data</h3><p class="manual-feature-body">Registre na foto a data e a hora da captura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cor do texto</h3><p class="manual-feature-body">Ajuste as informações de captura para facilitar a leitura no fundo da foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacidade do texto · Sombra de legibilidade</h3><p class="manual-feature-body">Ajuste a opacidade e a intensidade da sombra para manter o texto legível sobre a foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mover o cartão de informações</h3><p class="manual-feature-body">Arraste o cartão de informações para não cobrir a foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Brilho</h3><p class="manual-feature-body">Ajuste a exposição para registrar melhor os detalhes do local.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zoom da câmera</h3><p class="manual-feature-body">Ajuste o zoom da captura para que o objeto apareça no tamanho desejado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Grade</h3><p class="manual-feature-body">A grade ajuda a alinhar o horizonte e compor a imagem.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Trocar câmera</h3><p class="manual-feature-body">Alterne entre as câmeras frontal e traseira para fotografar na direção desejada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tirar foto</h3><p class="manual-feature-body">Registre o local em fotos e veja os resultados na galeria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Conferir uma foto recente</h3><p class="manual-feature-body">Abra as fotos recentes para conferir imediatamente o resultado das capturas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos na horizontal nas duas direções</h3><p class="manual-feature-body">Gire o aparelho para capturar uma visão mais ampla do local.</p></div></article></section><section><h2>6. Configurações</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Idioma e região</h3><p class="manual-feature-body">Escolha o idioma de exibição e seu país/região atual.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Idioma</h3><p class="manual-feature-body">Escolha o idioma a usar no app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>País/região atual</h3><p class="manual-feature-body">Os formatos de data, números e moeda são definidos com base no país/região selecionado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Moeda</h3><p class="manual-feature-body">Altere a exibição dos valores para a moeda que utiliza.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configurações de formato de hora</h3><p class="manual-feature-body">Escolha como as datas e horas serão exibidas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configurações de tema</h3><p class="manual-feature-body">Escolha uma aparência clara ou escura conforme a iluminação ao redor.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Minhas informações</h3><p class="manual-feature-body">Gerencie padrões reutilizáveis de trabalhador e pagamento.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configurações da câmera</h3><p class="manual-feature-body">Configure captura, registro de localização e exibição de informações conforme suas necessidades.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto de check-in</h3><p class="manual-feature-body">Exigir captura da câmera antes do início do check-in.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto de check-out</h3><p class="manual-feature-body">Exigir captura da câmera antes que o check-out seja salvo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Edição de imagem</h3><p class="manual-feature-body">Permitir edição de detalhes de fotos e armazenamento de imagens editadas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartilhamento de fotos</h3><p class="manual-feature-body">Compartilhe fotos a partir de detalhes de fotos e seleção de galeria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anexo de foto do relatório</h3><p class="manual-feature-body">Anexe fotos da galeria capturadas na data do relatório.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibração ao fotografar</h3><p class="manual-feature-body">A vibração informa se a captura da foto foi bem-sucedida ou falhou.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Som do obturador</h3><p class="manual-feature-body">Ao tirar uma foto, o som do obturador é reproduzido. Não pode ser desativado, mas o volume pode ser ajustado de 1 a 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salvar cópia compactada</h3><p class="manual-feature-body">Armazene uma cópia editada compactada enquanto mantém o original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configurações da galeria</h3><p class="manual-feature-body">Escolha o tamanho das miniaturas para ver mais fotos de uma vez ou observá-las melhor.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Permissões</h3><p class="manual-feature-body">Verifique o status de permissão necessário para recursos do TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Proteção de Registro</h3><p class="manual-feature-body">Consulte as regras de registro das fontes das fotos, das informações de captura e do histórico de edição.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cópia de segurança</h3><p class="manual-feature-body">Guarde uma cópia separada dos registros, fotos e configurações e confira a conclusão.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fazer backup neste dispositivo</h3><p class="manual-feature-body">Salve o backup no armazenamento interno deste dispositivo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup em cartão SD ou USB</h3><p class="manual-feature-body">Salve o backup em um cartão SD ou dispositivo USB conectado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Criar backup externo</h3><p class="manual-feature-body">Envie uma cópia do backup para outro aplicativo. Confirme no aplicativo escolhido se ela foi salva.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup no Google Drive</h3><p class="manual-feature-body">Salve backups no Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gerenciar backups do Google Drive</h3><p class="manual-feature-body">Confira os backups por data e exclua-os por conta própria</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar do Google Drive</h3><p class="manual-feature-body">Escolha na lista de backups salvos no Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar</h3><p class="manual-feature-body">A restauração substitui os dados atuais pelo backup; faça antes uma cópia dos dados atuais.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Verificação e recuperação de armazenamento da galeria</h3><p class="manual-feature-body">Verifique arquivos de fotos sem vínculo com registros e faça a limpeza após conferir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gerenciamento de dados</h3><p class="manual-feature-body">Gerencie o uso do armazenamento e a redefinição de dados.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Limpeza temporária de arquivos</h3><p class="manual-feature-body">Libere espaço de armazenamento removendo arquivos temporários desnecessários.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lixo</h3><p class="manual-feature-body">Você pode restaurá-los da Lixeira por 30 dias.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Redefinir todos os dados</h3><p class="manual-feature-body">Exclui todos os registros e fotos deste aparelho; faça um backup antes.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configurações de notificação</h3><p class="manual-feature-body">Usada para receber notificações importantes do aplicativo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibração</h3><p class="manual-feature-body">Use vibração para interações de aplicativos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Uso de dados</h3><p class="manual-feature-body">Escolha se os backups serão enviados apenas por Wi-Fi ou também por dados móveis.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guia do usuário</h3><p class="manual-feature-body">Aprenda a usar as funções pelas telas e explicações dos ícones.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Suporte</h3><p class="manual-feature-body">Envie dúvidas, relatos de erros e sugestões de funções por e-mail.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Política de privacidade</h3><p class="manual-feature-body">Revise os detalhes de coleta e manuseio de dados.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sobre</h3><p class="manual-feature-body">Confira a versão do aplicativo, os termos de uso e as licenças de código aberto.</p></div></article></section></details><details class="manual-nojs-locale" lang="es" dir="ltr"><summary>Español</summary><section><h2>1. Inicio</h2><p><a class="manual-nojs-original" href="images/es/guide-main.webp?v=8ed98abd8e32" target="_blank" rel="noopener">Ver original (nueva pestaña): Inicio</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Nuevo lugar de trabajo</h3><p class="manual-feature-body">Registra un lugar de trabajo para vincular asistencia, liquidaciones e informes.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Usar ubicación GPS actual para la dirección</h3><p class="manual-feature-body">Rellena la dirección del lugar de trabajo con la ubicación actual. Compruebe la dirección real y corríjala si es necesario.</p><p class="manual-feature-notice">La dirección del GPS puede diferir de la dirección real del lugar de trabajo. Compruébela antes de guardar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cambiar de lugar de trabajo</h3><p class="manual-feature-body">Registra varios lugares de trabajo y elige el que necesites.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lugar de trabajo · Editar</h3><p class="manual-feature-body">Modifica los datos y valores salariales predeterminados del lugar de trabajo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Entrada · Salida</h3><p class="manual-feature-body">Al registrar la entrada y salida, las horas se calculan automáticamente para liquidaciones e informes.</p><p class="manual-feature-notice">Nota: Las horas calculadas no se pueden modificar en las liquidaciones ni en la vista previa de PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Descanso</h3><p class="manual-feature-body">Los descansos se tienen en cuenta al calcular las horas efectivas y el salario.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cálculo de salario</h3><p class="manual-feature-body">El salario se calcula automáticamente por hora o por día; elige el pago semanal, mensual u otro ciclo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ingresos · Asignación</h3><p class="manual-feature-body">Revisa la tarifa y los complementos de un registro y ajusta los importes necesarios.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nota de trabajo</h3><p class="manual-feature-body">Guarda notas del lugar y detalles del trabajo junto a tus registros.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>tomar foto</h3><p class="manual-feature-body">Documenta el lugar con fotos y revísalas en la galería.</p></div></article></section><section><h2>2. Galería</h2><p><a class="manual-nojs-original" href="images/es/guide-gallery.webp?v=1d855e066796" target="_blank" rel="noopener">Ver original (nueva pestaña): Galería</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galería</h3><p class="manual-feature-body">Consulta, edita y comparte las fotos que has tomado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Buscar</h3><p class="manual-feature-body">Encuentra fotos por lugar de trabajo, período y categoría.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lugar de trabajo</h3><p class="manual-feature-body">Consulta juntas las fotos vinculadas al lugar de trabajo seleccionado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Todos</h3><p class="manual-feature-body">Quita los filtros de búsqueda y lugar de trabajo para ver todas las fotos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente</h3><p class="manual-feature-body">Explora las fotos por fecha de captura y abre el día que necesites.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Seleccionar</h3><p class="manual-feature-body">Selecciona varias fotos para compartirlas o eliminarlas juntas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos</h3><p class="manual-feature-body">Abre una foto y amplía con dos dedos para ver los detalles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>editor de fotos</h3><p class="manual-feature-body">Añade marcas y texto a las fotos y restaura el original cuando lo necesites.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flecha</h3><p class="manual-feature-body">Destaca las partes importantes de una foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Resaltado del círculo</h3><p class="manual-feature-body">Rodea con un círculo la parte de la foto que quieras destacar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Caja rectangular</h3><p class="manual-feature-body">Enmarca con un rectángulo una zona que requiera atención.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>mosaico</h3><p class="manual-feature-body">Aplica mosaico a las zonas que quieras ocultar en la foto que compartes.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Agregar texto</h3><p class="manual-feature-body">Añade explicaciones o notas útiles a la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alineación de texto</h3><p class="manual-feature-body">Alinea el texto a la izquierda, al centro o a la derecha dentro del cuadro para facilitar la lectura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tamaño del texto</h3><p class="manual-feature-body">Ajusta el tamaño del texto añadido para que se lea bien en la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Texto en negrita</h3><p class="manual-feature-body">Resalta el texto importante con un trazo más grueso.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Color</h3><p class="manual-feature-body">Elige colores de texto y formas que destaquen sobre el fondo de la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacidad</h3><p class="manual-feature-body">Ajusta cuánto cubren la foto el texto y las formas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>rotar</h3><p class="manual-feature-body">Gira la foto en pasos de 90 grados para verla en la orientación adecuada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Deshacer</h3><p class="manual-feature-body">Deshace el último texto, forma u otra marca añadida a la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rehacer</h3><p class="manual-feature-body">Vuelve a aplicar el texto, la forma u otra marca que se deshizo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Eliminar objeto seleccionado</h3><p class="manual-feature-body">Quita únicamente el texto o la forma seleccionados en la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guardar</h3><p class="manual-feature-body">La versión editada aparece en los detalles de la foto. La captura original se conserva.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar original</h3><p class="manual-feature-body">Quita las ediciones y vuelve al original conservado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartir</h3><p class="manual-feature-body">Comparte en otra aplicación una copia con las ediciones actuales.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Eliminar</h3><p class="manual-feature-body">Al borrar una foto, comprueba el alcance en la galería y los documentos vinculados.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adjuntos · Más recientes primero · Más antiguas primero</h3><p class="manual-feature-body">Al adjuntar fotos, ordénalas de más recientes a más antiguas o al revés para encontrar las necesarias.</p></div></article></section><section><h2>3. Liquidación</h2><p><a class="manual-nojs-original" href="images/es/guide-settlement.webp?v=03c3115c2f7f" target="_blank" rel="noopener">Ver original (nueva pestaña): Liquidación</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Liquidación</h3><p class="manual-feature-body">Los importes se calculan automáticamente según los registros de trabajo y la configuración salarial.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente · Semanal · Mensual</h3><p class="manual-feature-body">Elija una fecha o período para mostrar registros coincidentes; También se aplican filtros de búsqueda y lugar de trabajo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Buscar</h3><p class="manual-feature-body">Busca liquidaciones por período, lugar de trabajo y otros criterios.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Editar</h3><p class="manual-feature-body">Vuelve a abrir liquidaciones guardadas para modificar tarifas, complementos y cobros.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Solicitud</h3><p class="manual-feature-body">Gestiona los cobros separados y su estado de solicitud y recepción.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adjuntos</h3><p class="manual-feature-body">Añade fotos de la galería al documento y organiza su orden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vista previa de PDF · Editar</h3><p class="manual-feature-body">Modifica los campos editables y las fotos adjuntas antes de guardar como PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guardar</h3><p class="manual-feature-body">Guardar en una liquidación guarda los cambios del documento. Para crear un PDF, toque Compartir y luego guárdelo o envíelo por separado en la aplicación de destino.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartir</h3><p class="manual-feature-body">Al compartir una liquidación se incluyen el PDF y las fotos adjuntas. Revise la cantidad y el contenido de los archivos antes de elegir la aplicación de destino.</p></div></article></section><section><h2>4. Informe</h2><p><a class="manual-nojs-original" href="images/es/guide-report.webp?v=6a8a98f27cba" target="_blank" rel="noopener">Ver original (nueva pestaña): Informe</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Informe</h3><p class="manual-feature-body">Organiza registros y fotos adjuntas para crear y compartir un PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Diariamente · Semanal · Mensual · Buscar</h3><p class="manual-feature-body">Elija una fecha o período para mostrar registros coincidentes; También se aplican filtros de búsqueda y lugar de trabajo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vista previa de PDF · Editar</h3><p class="manual-feature-body">Modifica los campos editables y las fotos adjuntas antes de guardar como PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adjuntos</h3><p class="manual-feature-body">Añade fotos de la galería al documento y organiza su orden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Guardar</h3><p class="manual-feature-body">Genere un PDF a partir del documento actual; utilice Compartir para conservar una copia externa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartir</h3><p class="manual-feature-body">Genere el PDF actual y elija un formato para compartir y una aplicación de destinatario.</p></div></article></section><section><h2>5. cámara</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Escanear código QR</h3><p class="manual-feature-body">Abre páginas web desde códigos QR o copia texto sin formato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flash</h3><p class="manual-feature-body">Usa el flash para ver mejor el sujeto en lugares oscuros.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Registro de ubicación GPS</h3><p class="manual-feature-body">Al desactivar «Registro de ubicación GPS», la aplicación no guarda coordenadas en el registro de la foto. «Mostrar dirección» es un ajuste independiente. Si lo activas y concedes el permiso de ubicación, la aplicación puede consultar y mostrar la dirección de tu ubicación actual y guardarla en el registro de la foto al tomarla. Los datos EXIF del JPEG original se conservan tal como están.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ubicación</h3><p class="manual-feature-body">Comprueba de nuevo tu ubicación para actualizar los datos del lugar de captura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Información superpuesta</h3><p class="manual-feature-body">Elige si incluir la información de captura en la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Información de captura</h3><p class="manual-feature-body">Elige el lugar de trabajo, la ubicación, las notas y el estilo de información que aparecerán en la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Atrás</h3><p class="manual-feature-body">Cierra la cámara y vuelve a la pantalla anterior; las fotos guardadas permanecen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lugar de trabajo</h3><p class="manual-feature-body">Muestra el nombre del lugar de trabajo actual en la superposición de la cámara.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Registra el lugar de captura con coordenadas precisas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nota</h3><p class="manual-feature-body">Registra en la foto las condiciones del lugar o notas necesarias.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dirección</h3><p class="manual-feature-body">Muestra la dirección GPS en la superposición de la cámara.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fecha</h3><p class="manual-feature-body">Conserva la fecha y hora de captura en la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Color del texto</h3><p class="manual-feature-body">Ajusta la información de captura para que se lea bien sobre el fondo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacidad del texto · Sombra de legibilidad</h3><p class="manual-feature-body">Ajusta la opacidad y la intensidad de la sombra para que el texto se lea sobre la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mover la tarjeta de información</h3><p class="manual-feature-body">Arrastra la tarjeta de información para que no tape la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Brillo</h3><p class="manual-feature-body">Ajusta la exposición para captar mejor los detalles del lugar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zoom de cámara</h3><p class="manual-feature-body">Ajusta el zoom de captura para que el sujeto aparezca con el tamaño deseado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cuadrícula</h3><p class="manual-feature-body">La cuadrícula ayuda a nivelar el horizonte y componer la toma.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cambiar cámara</h3><p class="manual-feature-body">Alterna entre la cámara frontal y la trasera para fotografiar en la dirección deseada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>tomar foto</h3><p class="manual-feature-body">Documenta el lugar con fotos y revísalas en la galería.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Comprobar una foto reciente</h3><p class="manual-feature-body">Abre las fotos recientes para comprobar de inmediato el resultado de las tomas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos horizontales en ambas direcciones</h3><p class="manual-feature-body">Gira el dispositivo para capturar una vista más amplia del lugar.</p></div></article></section><section><h2>6. Configuración</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Idioma y región</h3><p class="manual-feature-body">Elige el idioma de visualización y tu país/región actual.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Idioma</h3><p class="manual-feature-body">Elige el idioma que se usará en la app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>País/región actual</h3><p class="manual-feature-body">Los formatos de fecha, número y moneda se configuran según el país/región seleccionado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Moneda</h3><p class="manual-feature-body">Cambia la visualización de los importes a la moneda que utilizas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configuración de formato de hora</h3><p class="manual-feature-body">Elija cómo se muestran las fechas y horas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configuración del tema</h3><p class="manual-feature-body">Elige una apariencia clara u oscura según la luz del entorno.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mi información</h3><p class="manual-feature-body">Gestiona valores reutilizables de trabajador y pago.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configuración de la cámara</h3><p class="manual-feature-body">Configura la captura, el registro de ubicación y la información mostrada según tus necesidades.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto de llegada</h3><p class="manual-feature-body">Requerir captura de cámara antes de que comience el check-in.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto de salida</h3><p class="manual-feature-body">Requerir la captura de la cámara antes de guardar el check-out.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Edición de imágenes</h3><p class="manual-feature-body">Permitir la edición de detalles de fotografías y el almacenamiento de imágenes editadas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Compartir fotos</h3><p class="manual-feature-body">Comparta fotos a partir de detalles de fotos y selección de galería.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adjuntar fotos al informe</h3><p class="manual-feature-body">Adjunte fotografías de la galería capturadas en la fecha del informe.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibración al tomar fotos</h3><p class="manual-feature-body">Una vibración indica si la captura de la foto se ha realizado correctamente o ha fallado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sonido del obturador</h3><p class="manual-feature-body">Al tomar una foto suena el obturador. No se puede desactivar, pero su volumen se puede ajustar de 1 a 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guardar copia comprimida</h3><p class="manual-feature-body">Almacene una copia editada comprimida conservando el original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configuración de la galería</h3><p class="manual-feature-body">Elige el tamaño de las miniaturas para ver más fotos a la vez o apreciarlas mejor.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Permisos</h3><p class="manual-feature-body">Verifique el estado del permiso requerido para las funciones de TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Protección de registros</h3><p class="manual-feature-body">Consulta cómo se registran el origen de las fotos, la información de captura y el historial de edición.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Copia de seguridad</h3><p class="manual-feature-body">Guarda una copia separada de registros, fotos y ajustes y comprueba que se complete.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hacer copia en este dispositivo</h3><p class="manual-feature-body">Guarda la copia de seguridad en el almacenamiento interno de este dispositivo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Copia en tarjeta SD o USB</h3><p class="manual-feature-body">Guarda la copia en una tarjeta SD o dispositivo USB conectado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Crear copia de seguridad externa</h3><p class="manual-feature-body">Envía una copia de seguridad a otra aplicación. Comprueba en la aplicación elegida que se haya guardado.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Copia en Google Drive</h3><p class="manual-feature-body">Guarda copias en Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Administrar copias de Google Drive</h3><p class="manual-feature-body">Revisa copias por fecha y elimínalas tú mismo</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar desde Google Drive</h3><p class="manual-feature-body">Elige de la lista de copias guardadas en Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurar</h3><p class="manual-feature-body">La restauración sustituye los datos actuales por la copia; guarda antes los datos actuales.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Verificación y recuperación de almacenamiento de la galería</h3><p class="manual-feature-body">Revisa los archivos de fotos que no estén vinculados a registros y límpialos después de comprobarlos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gestión de datos</h3><p class="manual-feature-body">Administre el uso de almacenamiento y el restablecimiento de datos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Limpieza de archivos temporales</h3><p class="manual-feature-body">Libera espacio de almacenamiento eliminando archivos temporales innecesarios.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>basura</h3><p class="manual-feature-body">Puedes restaurarlos desde la Papelera durante 30 días.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restablecer todos los datos</h3><p class="manual-feature-body">Elimina todos los registros y fotos del dispositivo; haz antes una copia de seguridad.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Configuración de notificaciones</h3><p class="manual-feature-body">Se usa para recibir notificaciones importantes de la aplicación.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibración</h3><p class="manual-feature-body">Utilice la vibración para las interacciones con aplicaciones.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Uso de datos</h3><p class="manual-feature-body">Elige si las copias de seguridad se suben solo por Wi-Fi o también con datos móviles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guía de usuario</h3><p class="manual-feature-body">Consulta las pantallas y explicaciones de los iconos para aprender a usar las funciones.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Soporte</h3><p class="manual-feature-body">Envía consultas, informes de errores y sugerencias de funciones por correo electrónico.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Política de privacidad</h3><p class="manual-feature-body">Revisar los detalles de recolección y manejo de datos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Acerca de</h3><p class="manual-feature-body">Consulta la versión de la app, las condiciones de uso y las licencias de código abierto.</p></div></article></section></details><details class="manual-nojs-locale" lang="fr" dir="ltr"><summary>Français</summary><section><h2>1. Accueil</h2><p><a class="manual-nojs-original" href="images/fr/guide-main.webp?v=c90623f0db5a" target="_blank" rel="noopener">Voir l’original (nouvel onglet): Accueil</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Nouveau lieu de travail</h3><p class="manual-feature-body">Enregistrez un lieu de travail pour relier les pointages, décomptes et rapports.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Utiliser l’adresse de la position GPS actuelle</h3><p class="manual-feature-body">Renseignez l’adresse du lieu de travail à partir de votre position actuelle. Vérifiez l’adresse réelle et corrigez-la si nécessaire.</p><p class="manual-feature-notice">L’adresse GPS peut différer de l’adresse réelle du lieu de travail. Vérifiez-la avant d’enregistrer.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Changer de lieu de travail</h3><p class="manual-feature-body">Enregistrez plusieurs lieux de travail et sélectionnez celui qui convient.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lieu de travail · Modifier</h3><p class="manual-feature-body">Modifiez les informations et les paramètres de salaire par défaut d’un lieu enregistré.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arrivée · Départ</h3><p class="manual-feature-body">Les pointages calculent automatiquement le temps de travail pour les décomptes et rapports.</p><p class="manual-feature-notice">Remarque : le temps de travail calculé ne peut pas être modifié dans les décomptes ni les aperçus PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pause</h3><p class="manual-feature-body">Les pauses sont prises en compte dans le calcul du temps de travail effectif et du salaire.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Calcul du salaire</h3><p class="manual-feature-body">Le salaire est calculé automatiquement au tarif horaire ou journalier ; choisissez un paiement hebdomadaire, mensuel ou autre.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Revenu · Indemnité</h3><p class="manual-feature-body">Vérifiez le tarif et les indemnités d’un relevé de travail et ajustez les montants nécessaires.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mémo de travail</h3><p class="manual-feature-body">Conservez les notes de terrain et les détails du travail avec vos relevés.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Prendre une photo</h3><p class="manual-feature-body">Photographiez le site et consultez les images dans la galerie.</p></div></article></section><section><h2>2. Galerie</h2><p><a class="manual-nojs-original" href="images/fr/guide-gallery.webp?v=1783a5f8f1ca" targe
