></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Đánh dấu vòng tròn</h3><p class="manual-feature-body">Khoanh tròn phần ảnh cần làm nổi bật.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hộp hình chữ nhật</h3><p class="manual-feature-body">Đóng khung hình chữ nhật quanh khu vực cần chú ý.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Khảm</h3><p class="manual-feature-body">Làm mờ ô phần cần che trong ảnh muốn chia sẻ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thêm văn bản</h3><p class="manual-feature-body">Thêm lời giải thích hoặc ghi chú cần thiết vào ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Căn chỉnh văn bản</h3><p class="manual-feature-body">Căn chữ sang trái, giữa hoặc phải trong khung để dễ đọc.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kích thước văn bản</h3><p class="manual-feature-body">Điều chỉnh cỡ chữ đã thêm để dễ đọc trên ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Văn bản in đậm</h3><p class="manual-feature-body">Tăng độ đậm để làm nổi bật phần chữ quan trọng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Màu sắc</h3><p class="manual-feature-body">Chọn màu chữ và hình dễ phân biệt với nền ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Độ mờ</h3><p class="manual-feature-body">Điều chỉnh mức độ chữ và hình che phủ ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Xoay</h3><p class="manual-feature-body">Xoay ảnh từng 90 độ để có hướng xem phù hợp.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hoàn tác</h3><p class="manual-feature-body">Hoàn tác chữ, hình hoặc dấu đánh dấu khác vừa thêm vào ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Làm lại</h3><p class="manual-feature-body">Áp dụng lại chữ, hình hoặc dấu đánh dấu khác đã hoàn tác.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Xóa đối tượng đã chọn</h3><p class="manual-feature-body">Chỉ xóa chữ hoặc hình đang chọn trong các đối tượng đã thêm vào ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lưu</h3><p class="manual-feature-body">Bản đã chỉnh sửa xuất hiện trong chi tiết ảnh. Ảnh gốc được giữ nguyên.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Khôi phục bản gốc</h3><p class="manual-feature-body">Xóa chỉnh sửa và trở về ảnh chụp gốc được lưu giữ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chia sẻ</h3><p class="manual-feature-body">Chia sẻ bản sao ảnh có chỉnh sửa hiện tại sang ứng dụng khác.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Xóa</h3><p class="manual-feature-body">Khi xóa ảnh, kiểm tra phạm vi áp dụng cho thư viện và tài liệu liên kết.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tệp đính kèm · Mới nhất trước · Cũ nhất trước</h3><p class="manual-feature-body">Khi đính kèm ảnh, sắp xếp từ mới nhất hoặc cũ nhất để tìm ảnh cần dùng.</p></div></article></section><section><h2>3. Quyết toán</h2><p><a class="manual-nojs-original" href="images/vi/guide-settlement.webp?v=8178faea48af" target="_blank" rel="noopener">Xem bản gốc (thẻ mới): Quyết toán</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Quyết toán</h3><p class="manual-feature-body">Số tiền quyết toán được tự động tính theo bản ghi làm việc và thiết lập tiền công.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>hàng ngày · hàng tuần · hàng tháng</h3><p class="manual-feature-body">Chọn ngày hoặc khoảng thời gian để hiển thị các bản ghi trùng khớp; bộ lọc nơi làm việc và tìm kiếm cũng được áp dụng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tìm kiếm</h3><p class="manual-feature-body">Tìm chi tiết quyết toán theo kỳ, nơi làm việc và các điều kiện khác.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chỉnh sửa</h3><p class="manual-feature-body">Mở lại quyết toán đã lưu để sửa đơn giá, phụ cấp và khoản yêu cầu thanh toán.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Yêu cầu</h3><p class="manual-feature-body">Quản lý khoản yêu cầu thanh toán riêng và trạng thái yêu cầu, đã nhận.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tệp đính kèm</h3><p class="manual-feature-body">Chọn ảnh trong thư viện để thêm vào tài liệu và sắp xếp thứ tự.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Xem trước PDF · Chỉnh sửa</h3><p class="manual-feature-body">Sửa nội dung cho phép chỉnh sửa và ảnh đính kèm trước khi lưu PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lưu</h3><p class="manual-feature-body">Nút lưu trong quyết toán lưu các thay đổi của tài liệu. Để tạo PDF, hãy nhấn Chia sẻ, sau đó lưu hoặc gửi riêng trong ứng dụng đích.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chia sẻ</h3><p class="manual-feature-body">Khi chia sẻ quyết toán, PDF và ảnh đính kèm đều được gửi kèm. Hãy kiểm tra số lượng và nội dung tệp trước khi chọn ứng dụng đích.</p></div></article></section><section><h2>4. Báo cáo</h2><p><a class="manual-nojs-original" href="images/vi/guide-report.webp?v=d7324790dbe9" target="_blank" rel="noopener">Xem bản gốc (thẻ mới): Báo cáo</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Báo cáo</h3><p class="manual-feature-body">Sắp xếp bản ghi làm việc và ảnh đính kèm thành PDF để chia sẻ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>hàng ngày · hàng tuần · hàng tháng · Tìm kiếm</h3><p class="manual-feature-body">Chọn ngày hoặc khoảng thời gian để hiển thị các bản ghi trùng khớp; bộ lọc nơi làm việc và tìm kiếm cũng được áp dụng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Xem trước PDF · Chỉnh sửa</h3><p class="manual-feature-body">Sửa nội dung cho phép chỉnh sửa và ảnh đính kèm trước khi lưu PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tệp đính kèm</h3><p class="manual-feature-body">Chọn ảnh trong thư viện để thêm vào tài liệu và sắp xếp thứ tự.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Lưu</h3><p class="manual-feature-body">Tạo tệp PDF từ tài liệu hiện tại; sử dụng Chia sẻ để giữ một bản sao bên ngoài.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chia sẻ</h3><p class="manual-feature-body">Tạo tệp PDF hiện tại và chọn định dạng chia sẻ và ứng dụng người nhận.</p></div></article></section><section><h2>5. Máy ảnh</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Quét mã QR</h3><p class="manual-feature-body">Mở trang web từ mã QR hoặc sao chép văn bản thuần.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Đèn flash</h3><p class="manual-feature-body">Dùng đèn flash để thấy rõ đối tượng ở nơi tối.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bản ghi vị trí GPS</h3><p class="manual-feature-body">Khi tắt “Bản ghi vị trí GPS”, ứng dụng không lưu tọa độ vào bản ghi ảnh. “Hiển thị địa chỉ” là một cài đặt riêng. Khi bật cài đặt này và cấp quyền vị trí, ứng dụng có thể tra và hiển thị địa chỉ theo vị trí hiện tại, rồi lưu địa chỉ vào bản ghi ảnh khi chụp. Dữ liệu EXIF trong JPEG gốc được giữ nguyên.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vị trí</h3><p class="manual-feature-body">Xác định lại vị trí hiện tại để cập nhật thông tin nơi chụp.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thông tin lớp phủ</h3><p class="manual-feature-body">Chọn có ghi thông tin chụp lên ảnh hay không.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thông tin chụp ảnh</h3><p class="manual-feature-body">Chọn nơi làm việc, vị trí, ghi chú và cách hiển thị thông tin trên ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quay lại</h3><p class="manual-feature-body">Đóng camera và quay lại màn hình trước đó; ảnh đã lưu vẫn còn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nơi làm việc</h3><p class="manual-feature-body">Hiển thị tên nơi làm việc hiện tại trong lớp phủ camera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Lưu vị trí chụp bằng tọa độ chính xác.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bản ghi nhớ</h3><p class="manual-feature-body">Ghi tình hình hiện trường hoặc nội dung cần thiết lên ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Địa chỉ</h3><p class="manual-feature-body">Hiển thị địa chỉ GPS trong lớp phủ camera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ngày</h3><p class="manual-feature-body">Lưu ngày giờ chụp trên ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Màu văn bản</h3><p class="manual-feature-body">Điều chỉnh để thông tin chụp dễ đọc trên nền ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Độ mờ văn bản · Bóng dễ đọc</h3><p class="manual-feature-body">Điều chỉnh độ mờ và cường độ bóng để chữ dễ đọc trên nền ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Di chuyển thẻ thông tin</h3><p class="manual-feature-body">Kéo thẻ thông tin chụp đến vị trí không che ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Độ sáng</h3><p class="manual-feature-body">Điều chỉnh độ sáng để ghi rõ chi tiết hiện trường.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thu phóng máy ảnh</h3><p class="manual-feature-body">Điều chỉnh mức thu phóng khi chụp để chủ thể có kích thước mong muốn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lưới</h3><p class="manual-feature-body">Lưới giúp căn đường chân trời và bố cục khi chụp.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Đổi camera</h3><p class="manual-feature-body">Chuyển giữa camera trước và sau để chụp theo hướng mong muốn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chụp ảnh</h3><p class="manual-feature-body">Chụp lại hiện trường và xem kết quả trong thư viện.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kiểm tra ảnh vừa chụp</h3><p class="manual-feature-body">Mở ảnh chụp gần đây để kiểm tra ngay kết quả chụp.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chụp ngang theo cả hai hướng</h3><p class="manual-feature-body">Xoay ngang thiết bị để chụp góc hiện trường rộng hơn.</p></div></article></section><section><h2>6. Cài đặt</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Ngôn ngữ và khu vực</h3><p class="manual-feature-body">Chọn ngôn ngữ hiển thị và quốc gia/khu vực hiện tại của bạn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ngôn ngữ</h3><p class="manual-feature-body">Chọn ngôn ngữ sẽ dùng trong ứng dụng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quốc gia/khu vực hiện tại</h3><p class="manual-feature-body">Định dạng ngày, số và tiền tệ được thiết lập theo quốc gia/khu vực đã chọn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tiền tệ</h3><p class="manual-feature-body">Đổi cách hiển thị số tiền theo loại tiền tệ bạn dùng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cài đặt định dạng thời gian</h3><p class="manual-feature-body">Chọn cách hiển thị ngày và giờ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cài đặt chủ đề</h3><p class="manual-feature-body">Chọn giao diện sáng hoặc tối theo ánh sáng xung quanh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thông tin của tôi</h3><p class="manual-feature-body">Quản lý mặc định người lao động và lương có thể dùng lại.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cài đặt máy ảnh</h3><p class="manual-feature-body">Thiết lập chụp ảnh, ghi vị trí và hiển thị thông tin theo nhu cầu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ảnh vào ca</h3><p class="manual-feature-body">Yêu cầu chụp ảnh trước khi bắt đầu vào ca.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ảnh kết thúc ca</h3><p class="manual-feature-body">Yêu cầu chụp ảnh trước khi kết thúc ca được lưu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chỉnh sửa hình ảnh</h3><p class="manual-feature-body">Cho phép chỉnh sửa chi tiết ảnh và lưu trữ ảnh đã chỉnh sửa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chia sẻ ảnh</h3><p class="manual-feature-body">Chia sẻ ảnh từ chi tiết ảnh và lựa chọn thư viện.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Đính kèm ảnh vào báo cáo</h3><p class="manual-feature-body">Đính kèm ảnh thư viện được chụp vào ngày báo cáo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rung khi chụp ảnh</h3><p class="manual-feature-body">Rung để báo chụp ảnh thành công hoặc thất bại.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Âm thanh màn trập khi chụp</h3><p class="manual-feature-body">Âm thanh màn trập phát khi chụp ảnh. Không thể tắt, nhưng có thể chỉnh âm lượng từ 1 đến 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lưu bản sao nén</h3><p class="manual-feature-body">Lưu trữ một bản sao đã chỉnh sửa nén trong khi vẫn giữ bản gốc.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cài đặt thư viện</h3><p class="manual-feature-body">Chọn cỡ ảnh thu nhỏ để xem nhiều ảnh cùng lúc hoặc nhìn ảnh rõ hơn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quyền</h3><p class="manual-feature-body">Kiểm tra trạng thái quyền cần thiết cho các tính năng TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bảo vệ hồ sơ</h3><p class="manual-feature-body">Xem nguyên tắc ghi nguồn ảnh, thông tin chụp và lịch sử chỉnh sửa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sao lưu</h3><p class="manual-feature-body">Lưu bản sao riêng của bản ghi, ảnh và cài đặt rồi kiểm tra hoàn tất.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sao lưu vào thiết bị này</h3><p class="manual-feature-body">Lưu bản sao lưu vào bộ nhớ trong của thiết bị này.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sao lưu vào thẻ SD hoặc USB</h3><p class="manual-feature-body">Lưu bản sao lưu vào thẻ SD hoặc thiết bị lưu trữ USB đã kết nối.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tạo bản sao lưu bên ngoài</h3><p class="manual-feature-body">Gửi bản sao lưu sang ứng dụng khác. Hãy kiểm tra trong ứng dụng đã chọn xem tệp đã được lưu xong chưa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sao lưu Google Drive</h3><p class="manual-feature-body">Lưu bản sao lưu vào Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quản lý bản sao lưu Google Drive</h3><p class="manual-feature-body">Xem các bản sao lưu theo ngày và tự xóa</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Khôi phục từ Google Drive</h3><p class="manual-feature-body">Chọn từ danh sách sao lưu đã lưu trong Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Khôi phục</h3><p class="manual-feature-body">Khôi phục sẽ thay dữ liệu hiện tại bằng bản sao lưu, vì vậy hãy sao lưu dữ liệu hiện tại trước.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kiểm tra và khôi phục bộ nhớ thư viện</h3><p class="manual-feature-body">Kiểm tra các tệp ảnh không liên kết với bản ghi và dọn dẹp sau khi xác nhận.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quản lý dữ liệu</h3><p class="manual-feature-body">Quản lý việc sử dụng bộ nhớ và thiết lập lại dữ liệu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dọn dẹp tệp tạm thời</h3><p class="manual-feature-body">Xóa các tệp tạm không cần thiết để giải phóng dung lượng lưu trữ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thùng rác</h3><p class="manual-feature-body">Bạn có thể khôi phục chúng từ Thùng rác trong 30 ngày.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Đặt lại tất cả dữ liệu</h3><p class="manual-feature-body">Xóa toàn bộ bản ghi và ảnh trên thiết bị này; hãy sao lưu trước.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cài đặt thông báo</h3><p class="manual-feature-body">Dùng để nhận các thông báo quan trọng từ ứng dụng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rung</h3><p class="manual-feature-body">Sử dụng chế độ rung để tương tác với ứng dụng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sử dụng dữ liệu</h3><p class="manual-feature-body">Chọn chỉ tải bản sao lưu qua Wi-Fi hay cho phép cả dữ liệu di động.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hướng dẫn sử dụng</h3><p class="manual-feature-body">Tìm hiểu cách dùng ứng dụng qua màn hình chức năng và giải thích biểu tượng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hỗ trợ</h3><p class="manual-feature-body">Gửi câu hỏi, báo lỗi và đề xuất tính năng qua email.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chính sách quyền riêng tư</h3><p class="manual-feature-body">Xem lại chi tiết thu thập và xử lý dữ liệu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Giới thiệu</h3><p class="manual-feature-body">Xem phiên bản ứng dụng, điều khoản sử dụng và giấy phép mã nguồn mở.</p></div></article></section></details><details class="manual-nojs-locale" lang="ru" dir="ltr"><summary>Русский</summary><section><h2>1. Главная</h2><p><a class="manual-nojs-original" href="images/ru/guide-main.webp?v=4d5ccbabd05f" target="_blank" rel="noopener">Открыть оригинал (новая вкладка): Главная</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Новое рабочее место</h3><p class="manual-feature-body">Добавьте место работы, чтобы связать с ним рабочее время, расчёты и отчёты.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ввести адрес по текущему местоположению GPS</h3><p class="manual-feature-body">Заполните адрес места работы по текущему местоположению. Проверьте фактический адрес и при необходимости исправьте его.</p><p class="manual-feature-notice">Адрес GPS может отличаться от фактического адреса места работы. Проверьте его перед сохранением.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сменить рабочее место</h3><p class="manual-feature-body">Добавьте несколько мест работы и выбирайте нужное.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Место работы · Редактировать</h3><p class="manual-feature-body">Изменяйте сведения и стандартные настройки оплаты зарегистрированного места работы.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Начать смену · Завершить смену</h3><p class="manual-feature-body">При записи начала и окончания работы часы автоматически рассчитываются для расчётов и отчётов.</p><p class="manual-feature-notice">Примечание: рассчитанное рабочее время нельзя изменить в расчётах или предпросмотре PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Перерыв</h3><p class="manual-feature-body">Перерывы учитываются при расчёте фактического рабочего времени и оплаты.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Расчет заработной платы</h3><p class="manual-feature-body">Оплата автоматически рассчитывается по часовой или дневной ставке; выберите еженедельные, ежемесячные или другие выплаты.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Доход · Надбавка</h3><p class="manual-feature-body">Проверяйте ставку и надбавки в записи о работе и меняйте нужные суммы.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Рабочая памятка</h3><p class="manual-feature-body">Сохраняйте заметки об объекте и работе вместе с рабочими записями.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сделать фото</h3><p class="manual-feature-body">Фотографируйте объект и просматривайте снимки в галерее.</p></div></article></section><section><h2>2. Галерея</h2><p><a class="manual-nojs-original" href="images/ru/guide-gallery.webp?v=123a2da7a34f" target="_blank" rel="noopener">Открыть оригинал (новая вкладка): Галерея</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Галерея</h3><p class="manual-feature-body">Просматривайте, редактируйте и отправляйте сделанные фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поиск</h3><p class="manual-feature-body">Находите фотографии по месту работы, периоду и категории.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Место работы</h3><p class="manual-feature-body">Просматривайте вместе фотографии выбранного места работы.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Все</h3><p class="manual-feature-body">Сбросьте фильтры поиска и места работы, чтобы увидеть все фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ежедневно</h3><p class="manual-feature-body">Просматривайте фотографии по дате съёмки и открывайте нужный день.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Выбрать</h3><p class="manual-feature-body">Выберите несколько фотографий для совместной отправки или удаления.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Фотографии</h3><p class="manual-feature-body">Откройте фотографию и увеличьте её двумя пальцами для просмотра деталей.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Фоторедактор</h3><p class="manual-feature-body">Добавляйте отметки и текст на фотографии и при необходимости восстанавливайте оригинал.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Стрелка</h3><p class="manual-feature-body">Выделяйте важные участки фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Выделение круга</h3><p class="manual-feature-body">Обведите кругом участок фотографии, который нужно выделить.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Прямоугольная коробка</h3><p class="manual-feature-body">Выделите важную область прямоугольной рамкой.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Мозаика</h3><p class="manual-feature-body">Закройте мозаикой участки фотографии перед отправкой.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Добавить текст</h3><p class="manual-feature-body">Добавьте на фотографию пояснения или заметки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Выравнивание текста</h3><p class="manual-feature-body">Выровняйте текст в рамке по левому краю, центру или правому краю для удобного чтения.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Размер текста</h3><p class="manual-feature-body">Настройте размер добавленного текста, чтобы его было удобно читать на фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Жирный текст</h3><p class="manual-feature-body">Сделайте важный текст более жирным, чтобы он выделялся.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Цвет</h3><p class="manual-feature-body">Выберите цвета текста и фигур, хорошо различимые на фоне фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Непрозрачность</h3><p class="manual-feature-body">Настройте, насколько текст и фигуры перекрывают фотографию.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поворот</h3><p class="manual-feature-body">Поворачивайте фотографию на 90 градусов до удобной ориентации.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Отменить</h3><p class="manual-feature-body">Отменяет последний добавленный текст, фигуру или другую пометку на фото.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Повторить</h3><p class="manual-feature-body">Возвращает текст, фигуру или другую пометку, удалённую отменой.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Удалить выбранный объект</h3><p class="manual-feature-body">Удалите только выбранный текст или фигуру, добавленные на фотографию.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сохранить</h3><p class="manual-feature-body">В сведениях о фото отображается отредактированная версия. Исходный снимок сохраняется.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Восстановить оригинал</h3><p class="manual-feature-body">Уберите правки и вернитесь к сохранённому оригиналу.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поделиться</h3><p class="manual-feature-body">Отправьте в другое приложение копию фотографии с текущими правками.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Удалить</h3><p class="manual-feature-body">При удалении фотографии проверьте область действия для галереи и связанных документов.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вложения · Сначала новые · Сначала старые</h3><p class="manual-feature-body">При прикреплении фотографий сортируйте их от новых к старым или наоборот, чтобы найти нужные.</p></div></article></section><section><h2>3. Расчёт оплаты</h2><p><a class="manual-nojs-original" href="images/ru/guide-settlement.webp?v=f8d5f3868e3d" target="_blank" rel="noopener">Открыть оригинал (новая вкладка): Расчёт оплаты</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Расчёт оплаты</h3><p class="manual-feature-body">Суммы рассчитываются автоматически по рабочим записям и настройкам оплаты.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ежедневно · Еженедельно · Ежемесячно</h3><p class="manual-feature-body">Выберите дату или период для отображения соответствующих записей; Также применяются фильтры рабочего места и поиска.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поиск</h3><p class="manual-feature-body">Ищите расчёты по периоду, месту работы и другим условиям.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Редактировать</h3><p class="manual-feature-body">Откройте сохранённый расчёт, чтобы изменить ставки, надбавки и требования оплаты.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Запрос оплаты</h3><p class="manual-feature-body">Управляйте отдельными требованиями оплаты и статусами запроса и получения.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вложения</h3><p class="manual-feature-body">Добавляйте фотографии из галереи в документ и меняйте их порядок.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Предварительный просмотр PDF · Редактировать</h3><p class="manual-feature-body">До сохранения в PDF измените доступные поля документа и прикреплённые фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сохранить</h3><p class="manual-feature-body">Кнопка сохранения в расчёте сохраняет изменения документа. Чтобы создать PDF, нажмите «Поделиться», а затем отдельно сохраните или отправьте файл в выбранном приложении.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поделиться</h3><p class="manual-feature-body">При отправке расчёта передаются PDF и прикреплённые фотографии. Проверьте количество и содержимое файлов перед выбором приложения.</p></div></article></section><section><h2>4. Отчет</h2><p><a class="manual-nojs-original" href="images/ru/guide-report.webp?v=97f189947adc" target="_blank" rel="noopener">Открыть оригинал (новая вкладка): Отчет</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Отчет</h3><p class="manual-feature-body">Соберите рабочие записи и фотографии в PDF и отправьте его.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ежедневно · Еженедельно · Ежемесячно · Поиск</h3><p class="manual-feature-body">Выберите дату или период для отображения соответствующих записей; Также применяются фильтры рабочего места и поиска.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Предварительный просмотр PDF · Редактировать</h3><p class="manual-feature-body">До сохранения в PDF измените доступные поля документа и прикреплённые фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вложения</h3><p class="manual-feature-body">Добавляйте фотографии из галереи в документ и меняйте их порядок.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Сохранить</h3><p class="manual-feature-body">Создать PDF-файл из текущего документа; используйте Поделиться для сохранения внешней копии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поделиться</h3><p class="manual-feature-body">Создайте текущий PDF-файл и выберите формат обмена и приложение-получатель.</p></div></article></section><section><h2>5. Камера</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Сканировать QR-код</h3><p class="manual-feature-body">Открывайте веб-страницы из QR-кодов или копируйте обычный текст.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вспышка</h3><p class="manual-feature-body">Используйте вспышку для съёмки в тёмных местах.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Запись местоположения GPS</h3><p class="manual-feature-body">Если настройка «Запись местоположения GPS» выключена, приложение не сохраняет координаты в записи о снимке. «Показать адрес» — отдельная настройка. Если она включена и доступ к местоположению разрешён, приложение может определить и показать адрес по текущему местоположению и сохранить его в записи о снимке при съёмке. Данные EXIF исходного JPEG сохраняются без изменений.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Расположение</h3><p class="manual-feature-body">Повторно определите текущее местоположение, чтобы обновить сведения о месте съёмки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Информация о наложении</h3><p class="manual-feature-body">Выберите, добавлять ли сведения о съёмке на фотографию.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Информация о съёмке</h3><p class="manual-feature-body">Выберите место работы, местоположение, заметки и способ отображения информации на фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Назад</h3><p class="manual-feature-body">Закройте камеру и вернитесь на предыдущий экран; сохраненные фотографии остаются.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Место работы</h3><p class="manual-feature-body">Отображение текущего названия рабочего места в наложении камеры.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Сохраняйте точные координаты места съёмки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Памятка</h3><p class="manual-feature-body">Добавьте на фотографию сведения об объекте или нужные заметки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Адрес</h3><p class="manual-feature-body">Отобразите адрес GPS в наложении камеры.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Дата</h3><p class="manual-feature-body">Сохраните на фотографии дату и время съёмки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Цвет текста</h3><p class="manual-feature-body">Сделайте сведения о съёмке хорошо читаемыми на фоне фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Непрозрачность текста · Тень для читаемости</h3><p class="manual-feature-body">Настройте прозрачность и силу тени, чтобы текст оставался читаемым на фоне фотографии.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Перемещение информационной карточки</h3><p class="manual-feature-body">Перетащите карточку сведений так, чтобы она не закрывала снимок.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Яркость</h3><p class="manual-feature-body">Настройте экспозицию, чтобы лучше передать детали объекта.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Увеличение камеры</h3><p class="manual-feature-body">Настройте масштаб съёмки, чтобы объект был нужного размера.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сетка</h3><p class="manual-feature-body">Сетка помогает выровнять горизонт и выстроить композицию кадра.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Смена камеры</h3><p class="manual-feature-body">Переключайтесь между передней и задней камерами для съёмки в нужном направлении.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сделать фото</h3><p class="manual-feature-body">Фотографируйте объект и просматривайте снимки в галерее.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Проверка последнего снимка</h3><p class="manual-feature-body">Откройте недавние фотографии, чтобы сразу проверить результат съёмки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Горизонтальная съёмка в обе стороны</h3><p class="manual-feature-body">Поверните устройство горизонтально для более широкого обзора объекта.</p></div></article></section><section><h2>6. Настройки</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Язык и регион</h3><p class="manual-feature-body">Выберите язык интерфейса и текущую страну/регион проживания.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Язык</h3><p class="manual-feature-body">Выберите язык, который будет использоваться в приложении.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Текущая страна/регион</h3><p class="manual-feature-body">Форматы даты, чисел и валюты задаются на основе выбранной страны/региона.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Валюта</h3><p class="manual-feature-body">Настройте отображение сумм в нужной валюте.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Настройки формата времени</h3><p class="manual-feature-body">Выберите способ отображения даты и времени.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Настройки темы</h3><p class="manual-feature-body">Выберите светлое или тёмное оформление с учётом окружающего освещения.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Мои данные</h3><p class="manual-feature-body">Управляйте повторно используемыми данными работника и настройками оплаты по умолчанию.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Настройки камеры</h3><p class="manual-feature-body">Настройте съёмку, запись местоположения и отображение информации под свои задачи.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Фото начала смены</h3><p class="manual-feature-body">Требовать фото перед началом смены.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Фото окончания смены</h3><p class="manual-feature-body">Требовать фотографию перед сохранением окончания работы.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Редактирование изображений</h3><p class="manual-feature-body">Разрешить редактирование деталей фотографий и хранение отредактированных изображений.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Обмен фотографиями</h3><p class="manual-feature-body">Делитесь фотографиями из деталей фотографий и выбора галереи.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Прикрепите фото отчета</h3><p class="manual-feature-body">Прикрепите фотографии галереи, сделанные на дату отчета.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вибрация при съёмке</h3><p class="manual-feature-body">Вибрация сообщает об успешной или неудачной съёмке.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Звук затвора при съёмке</h3><p class="manual-feature-body">При съёмке звучит затвор. Звук нельзя отключить, но его громкость можно настроить от 1 до 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сохранить сжатую копию</h3><p class="manual-feature-body">Сохраните сжатую отредактированную копию, сохранив оригинал.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Настройки галереи</h3><p class="manual-feature-body">Выберите размер миниатюр, чтобы видеть больше фотографий сразу или рассматривать их крупнее.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Разрешения</h3><p class="manual-feature-body">Проверьте статус разрешений, необходимых для функций TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Защита записей</h3><p class="manual-feature-body">Ознакомьтесь с правилами записи источников фотографий, сведений о съёмке и истории редактирования.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Резервное копирование</h3><p class="manual-feature-body">Сохраняйте отдельную копию рабочих записей, фотографий и настроек и проверяйте завершение.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Создать резервную копию на этом устройстве</h3><p class="manual-feature-body">Сохраните резервную копию во внутренней памяти этого устройства.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Резервная копия на SD-карту или USB</h3><p class="manual-feature-body">Сохранить резервную копию на подключенную SD-карту или USB-накопитель.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Создать внешнюю резервную копию</h3><p class="manual-feature-body">Передайте резервную копию в другое приложение. Проверьте в выбранном приложении, что файл сохранён.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Резервная копия Google Drive</h3><p class="manual-feature-body">Сохраняйте резервные копии в Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Управление резервными копиями Google Drive</h3><p class="manual-feature-body">Просматривайте копии по датам и удаляйте их самостоятельно</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Восстановить из Google Drive</h3><p class="manual-feature-body">Выберите из списка резервных копий, сохраненных в Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Восстановить</h3><p class="manual-feature-body">Восстановление заменяет текущие данные приложения резервной копией, поэтому сначала сохраните и текущие данные.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Проверка и восстановление хранилища галереи</h3><p class="manual-feature-body">Проверьте фотофайлы, не связанные с записями, и очистите их после проверки.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Управление данными</h3><p class="manual-feature-body">Управляйте использованием хранилища и сбросом данных.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Очистка временных файлов</h3><p class="manual-feature-body">Удаляйте ненужные временные файлы, чтобы освободить место в хранилище.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>мусор</h3><p class="manual-feature-body">Вы можете восстановить их из корзины в течение 30 дней.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Сбросить все данные</h3><p class="manual-feature-body">Удаляет все записи и фотографии на этом устройстве; сначала создайте резервную копию.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Настройки уведомлений</h3><p class="manual-feature-body">Используется для получения важных уведомлений приложения.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Вибрация</h3><p class="manual-feature-body">Используйте вибрацию для взаимодействия с приложением.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Использование данных</h3><p class="manual-feature-body">Выберите, загружать резервные копии только по Wi-Fi или также через мобильную сеть.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Руководство пользователя</h3><p class="manual-feature-body">Изучите работу приложения по экранам функций и пояснениям значков.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Поддержка</h3><p class="manual-feature-body">Отправляйте вопросы, сообщения об ошибках и предложения функций по электронной почте.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Политика конфиденциальности</h3><p class="manual-feature-body">Просмотрите детали сбора и обработки данных.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>О</h3><p class="manual-feature-body">Проверьте версию приложения, условия использования и лицензии открытого ПО.</p></div></article></section></details><details class="manual-nojs-locale" lang="tr" dir="ltr"><summary>Türkçe</summary><section><h2>1. Ana Sayfa</h2><p><a class="manual-nojs-original" href="images/tr/guide-main.webp?v=e0b1695dbe61" target="_blank" rel="noopener">Orijinali aç (yeni sekme): Ana Sayfa</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Yeni İşyeri</h3><p class="manual-feature-body">İş yeri eklediğinizde giriş-çıkış kayıtları, hesaplamalar ve raporlar bu iş yerine bağlanır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adresi mevcut GPS konumundan doldur</h3><p class="manual-feature-body">Mevcut konumunuzdan işyeri adresini doldurun. Gerçek adresi kontrol edip gerektiğinde düzeltin.</p><p class="manual-feature-notice">GPS adresi gerçek işyeri adresinden farklı olabilir. Kaydetmeden önce gerçek adresi kontrol edin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>İşyerini Değiştir</h3><p class="manual-feature-body">Birden fazla iş yeri ekleyip ihtiyacınıza göre seçebilirsiniz.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>İşyeri · Düzenle</h3><p class="manual-feature-body">Kayıtlı iş yerinin bilgilerini ve varsayılan ücret ayarlarını düzenleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mesaiye başla · Mesaiyi bitir</h3><p class="manual-feature-body">Giriş ve çıkış kaydedildiğinde çalışma süresi otomatik hesaplanıp hesaplamalara ve raporlara yansıtılır.</p><p class="manual-feature-notice">Not: Hesaplanan çalışma süresi, hesaplamalarda ve PDF önizlemesinde değiştirilemez.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mola</h3><p class="manual-feature-body">Molalar, fiilî çalışma süresi ve ücret hesabına yansıtılır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ücret Hesaplama</h3><p class="manual-feature-body">Ücret saatlik veya günlük tarifeden otomatik hesaplanır; haftalık, aylık veya başka bir ödeme dönemi seçebilirsiniz.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gelir · Ödenek</h3><p class="manual-feature-body">Çalışma kaydının ücretini ve ek ödemelerini kontrol edip gerekli tutarları düzenleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Çalışma Notu</h3><p class="manual-feature-body">Saha durumunu ve iş ayrıntılarını çalışma kayıtlarıyla birlikte saklayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoğraf Çek</h3><p class="manual-feature-body">Sahayı fotoğraflarla kaydedip sonuçları galeride inceleyin.</p></div></article></section><section><h2>2. Galeri</h2><p><a class="manual-nojs-original" href="images/tr/guide-gallery.webp?v=034ae344bae1" target="_blank" rel="noopener">Orijinali aç (yeni sekme): Galeri</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galeri</h3><p class="manual-feature-body">Çektiğiniz fotoğrafları görüntüleyin, düzenleyin veya paylaşın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ara</h3><p class="manual-feature-body">İş yeri, dönem ve kategoriye göre gereken fotoğrafları bulun.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>İşyeri</h3><p class="manual-feature-body">Seçilen iş yerine bağlı fotoğrafları bir arada görüntüleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hepsi</h3><p class="manual-feature-body">Tüm fotoğrafları görmek için arama ve iş yeri filtrelerini temizleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Günlük</h3><p class="manual-feature-body">Fotoğrafları çekim tarihine göre inceleyip istediğiniz günü açın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Seç</h3><p class="manual-feature-body">Birden fazla fotoğrafı seçip birlikte paylaşabilir veya silebilirsiniz.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoğraflar</h3><p class="manual-feature-body">Fotoğrafı açıp iki parmakla yakınlaştırarak ayrıntıları inceleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoğraf Düzenleyici</h3><p class="manual-feature-body">Fotoğraflara işaret ve metin ekleyip gerektiğinde aslına dönebilirsiniz.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ok</h3><p class="manual-feature-body">Fotoğraftaki önemli alanları belirginleştirin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Daire Vurgulama</h3><p class="manual-feature-body">Fotoğrafın vurgulamak istediğiniz bölümünü daire içine alın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dikdörtgen Kutu</h3><p class="manual-feature-body">Dikkat çekmek istediğiniz alanı dikdörtgenle çerçeveleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mozaik</h3><p class="manual-feature-body">Paylaşacağınız fotoğrafta gizlemek istediğiniz alanlara mozaik uygulayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Metin Ekle</h3><p class="manual-feature-body">Fotoğrafa gerekli açıklama veya notları ekleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Metin hizalaması</h3><p class="manual-feature-body">Kolay okunması için metni kutusunda sola, ortaya veya sağa hizalayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Metin boyutu</h3><p class="manual-feature-body">Eklenen yazının boyutunu fotoğrafta kolay okunacak şekilde ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kalın metin</h3><p class="manual-feature-body">Önemli yazıları daha kalın göstererek öne çıkarın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Renk</h3><p class="manual-feature-body">Fotoğrafın arka planından ayrılan yazı ve şekil renkleri seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opaklık</h3><p class="manual-feature-body">Yazı ve şekillerin fotoğrafı ne kadar örttüğünü ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Döndür</h3><p class="manual-feature-body">Fotoğrafı rahat görülecek yöne getirmek için 90 derecelik adımlarla döndürün.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Geri al</h3><p class="manual-feature-body">Fotoğrafa en son eklenen metni, şekli veya diğer işareti geri alır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Yinele</h3><p class="manual-feature-body">Geri alınan metni, şekli veya diğer işareti yeniden uygular.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Seçilen nesneyi sil</h3><p class="manual-feature-body">Fotoğrafa eklenen yazı veya şekillerden yalnızca seçileni kaldırın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kaydet</h3><p class="manual-feature-body">Düzenlenmiş sürüm fotoğraf ayrıntılarında görünür. Çekilen orijinal fotoğraf korunur.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Orijinali Geri Yükle</h3><p class="manual-feature-body">Düzenlemeleri kaldırıp korunan çekim aslına dönün.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paylaş</h3><p class="manual-feature-body">Geçerli düzenlemeleri içeren fotoğraf kopyasını başka bir uygulamada paylaşın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sil</h3><p class="manual-feature-body">Fotoğraf silerken işlemin galeri ve bağlı belgelerdeki kapsamını kontrol edin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ekler · Önce en yeni · Önce en eski</h3><p class="manual-feature-body">Fotoğraf eklerken gerekenleri bulmak için en yeniden veya en eskiden başlayarak sıralayın.</p></div></article></section><section><h2>3. Ücret hesabı</h2><p><a class="manual-nojs-original" href="images/tr/guide-settlement.webp?v=5fa79905adb1" target="_blank" rel="noopener">Orijinali aç (yeni sekme): Ücret hesabı</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Ücret hesabı</h3><p class="manual-feature-body">Tutarlar, çalışma kayıtları ve ücret ayarlarına göre otomatik hesaplanır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Günlük · Haftalık · Aylık</h3><p class="manual-feature-body">Eşleşen kayıtları göstermek için bir tarih veya dönem seçin; işyeri ve arama filtreleri de geçerlidir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ara</h3><p class="manual-feature-body">Dönem, iş yeri ve diğer koşullara göre hesap dökümlerini bulun.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Düzenle</h3><p class="manual-feature-body">Kaydedilen hesaplamaları yeniden açıp ücretleri, ek ödemeleri ve talepleri düzenleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ödeme talebi</h3><p class="manual-feature-body">Ayrı talep edilecek tutarları, talep ve tahsil durumlarını yönetin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ekler</h3><p class="manual-feature-body">Galeriden fotoğraf seçip belgeye ekleyin ve sıralarını düzenleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF Önizlemesi · Düzenle</h3><p class="manual-feature-body">PDF olarak kaydetmeden önce düzenlenebilir içeriği ve ekli fotoğrafları değiştirin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kaydet</h3><p class="manual-feature-body">Hesap özetindeki Kaydet düğmesi belge değişikliklerini kaydeder. PDF oluşturmak için Paylaş’a dokunun, ardından hedef uygulamada ayrıca kaydedin veya gönderin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paylaş</h3><p class="manual-feature-body">Hesap özeti paylaşımı PDF dosyasını ve ekli fotoğrafları içerir. Hedef uygulamayı seçmeden önce dosya sayısını ve içeriklerini kontrol edin.</p></div></article></section><section><h2>4. Rapor</h2><p><a class="manual-nojs-original" href="images/tr/guide-report.webp?v=4c93f716117e" target="_blank" rel="noopener">Orijinali aç (yeni sekme): Rapor</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Rapor</h3><p class="manual-feature-body">Çalışma kayıtları ile ekli fotoğrafları düzenleyip PDF olarak oluşturun ve paylaşın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Günlük · Haftalık · Aylık · Ara</h3><p class="manual-feature-body">Eşleşen kayıtları göstermek için bir tarih veya dönem seçin; işyeri ve arama filtreleri de geçerlidir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF Önizlemesi · Düzenle</h3><p class="manual-feature-body">PDF olarak kaydetmeden önce düzenlenebilir içeriği ve ekli fotoğrafları değiştirin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ekler</h3><p class="manual-feature-body">Galeriden fotoğraf seçip belgeye ekleyin ve sıralarını düzenleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Kaydet</h3><p class="manual-feature-body">Geçerli belgeden bir PDF oluşturun; harici bir kopyayı saklamak için Paylaş kullanın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paylaş</h3><p class="manual-feature-body">Geçerli PDF'yi oluşturun ve bir paylaşım biçimi ve alıcı uygulaması seçin.</p></div></article></section><section><h2>5. Kamera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>QR kodunu tarayın</h3><p class="manual-feature-body">QR kodlarından web sayfalarını açın veya düz metni kopyalayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flaş</h3><p class="manual-feature-body">Karanlık alanlarda konunun görünmesi için flaşı kullanın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS Konum Kaydı</h3><p class="manual-feature-body">“GPS Konum Kaydı” kapalıyken uygulama, fotoğraf kaydına koordinat kaydetmez. “Adresi Göster” ayrı bir ayardır. Bu ayar açıksa ve konum izni verilmişse uygulama, mevcut konumdan adresi bulup gösterebilir ve çekim sırasında fotoğraf kaydına kaydedebilir. Orijinal JPEG dosyasındaki EXIF bilgileri olduğu gibi korunur.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Konum</h3><p class="manual-feature-body">Çekim konumunu güncellemek için mevcut konumu yeniden belirleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kaplama Bilgisi</h3><p class="manual-feature-body">Çekim bilgilerinin fotoğrafa eklenip eklenmeyeceğini seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Çekim bilgileri</h3><p class="manual-feature-body">Fotoğrafta gösterilecek iş yerini, konumu, notları ve bilgi görünümünü seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Geri</h3><p class="manual-feature-body">Kamerayı kapatın ve önceki ekrana dönün; kayıtlı fotoğraflar kalır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>İşyeri</h3><p class="manual-feature-body">Geçerli işyeri adını kamera arayüzünde görüntüleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Çekim konumunu kesin koordinatlarla kaydedin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Not</h3><p class="manual-feature-body">Saha durumunu veya gereken notları fotoğrafa kaydedin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adres</h3><p class="manual-feature-body">GPS adresini kamera arayüzünde görüntüleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tarih</h3><p class="manual-feature-body">Çekim tarihini ve saatini fotoğrafta saklayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Metin rengi</h3><p class="manual-feature-body">Çekim bilgisinin fotoğraf arka planında kolay okunmasını sağlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Metin opaklığı · Okunabilirlik gölgesi</h3><p class="manual-feature-body">Yazının fotoğraf üzerinde okunabilmesi için opaklık ve gölge gücünü ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bilgi kartını taşıma</h3><p class="manual-feature-body">Bilgi kartını sürükleyerek fotoğrafı kapatmayacak bir konuma taşıyın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Parlaklık</h3><p class="manual-feature-body">Saha ayrıntılarını daha net yakalamak için pozlamayı ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kamera Yakınlaştırması</h3><p class="manual-feature-body">Konunun istediğiniz boyutta görünmesi için çekim yakınlaştırmasını ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Izgara</h3><p class="manual-feature-body">Izgara, çekim sırasında ufku düz tutmaya ve kompozisyon kurmaya yardımcı olur.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kamera değiştir</h3><p class="manual-feature-body">İstediğiniz yönde çekim yapmak için ön ve arka kamera arasında geçiş yapın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoğraf Çek</h3><p class="manual-feature-body">Sahayı fotoğraflarla kaydedip sonuçları galeride inceleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Son fotoğrafı kontrol etme</h3><p class="manual-feature-body">Çekim sonucunu hemen kontrol etmek için son fotoğrafları açın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Her iki yönde yatay çekim</h3><p class="manual-feature-body">Sahayı daha geniş görüntülemek için cihazı yatay çevirin.</p></div></article></section><section><h2>6. Ayarlar</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Dil ve Bölge</h3><p class="manual-feature-body">Görüntüleme dilini ve mevcut ülke/bölgenizi seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dil</h3><p class="manual-feature-body">Uygulamada kullanılacak dili seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Geçerli ülke/bölge</h3><p class="manual-feature-body">Tarih, sayı ve para birimi görüntüleme biçimleri seçilen ülke/bölgeye göre ayarlanır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Para birimi</h3><p class="manual-feature-body">Tutarların gösterimini kullandığınız para birimine göre değiştirin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Saat Formatı Ayarları</h3><p class="manual-feature-body">Tarihlerin ve saatlerin nasıl görüntüleneceğini seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tema Ayarları</h3><p class="manual-feature-body">Ortamın ışığına göre açık veya koyu görünüm seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bilgilerim</h3><p class="manual-feature-body">Yeniden kullanılabilir çalışan ve ücret varsayılanlarını yönetin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kamera Ayarları</h3><p class="manual-feature-body">Çekim, konum kaydı ve bilgi görünümünü ihtiyaçlarınıza göre ayarlayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Giriş Fotoğrafı</h3><p class="manual-feature-body">Giriş başlamadan önce kamera çekimi yapılmasını zorunlu kılın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Çıkış Fotoğrafı</h3><p class="manual-feature-body">Çıkış kaydedilmeden önce kamera çekimini zorunlu kılın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Görüntü Düzenleme</h3><p class="manual-feature-body">Fotoğraf ayrıntılarının düzenlenmesine ve düzenlenmiş görüntü depolamasına izin verin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoğraf Paylaşımı</h3><p class="manual-feature-body">Fotoğraf ayrıntılarından ve galeri seçiminden fotoğrafları paylaşın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rapora fotoğraf ekleme</h3><p class="manual-feature-body">Rapor tarihinde çekilen galeri fotoğraflarını ekleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Çekim titreşimi</h3><p class="manual-feature-body">Fotoğraf çekiminin başarılı veya başarısız olduğunu titreşimle bildirir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Deklanşör sesi</h3><p class="manual-feature-body">Fotoğraf çekerken deklanşör sesi çalar. Kapatılamaz, ancak ses düzeyi 1 ile 10 arasında ayarlanabilir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sıkıştırılmış Kopyayı Kaydet</h3><p class="manual-feature-body">Orijinali korurken sıkıştırılmış düzenlenmiş bir kopyayı saklayın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Galeri Ayarları</h3><p class="manual-feature-body">Daha fazla fotoğrafı birlikte görmek veya daha büyük incelemek için küçük resim boyutunu seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>İzinler</h3><p class="manual-feature-body">TAIPOPO özellikleri için gereken izin durumunu kontrol edin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kayıt Koruması</h3><p class="manual-feature-body">Fotoğraf kaynakları, çekim bilgileri ve düzenleme geçmişinin nasıl kaydedildiğini inceleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Yedekleme</h3><p class="manual-feature-body">Çalışma kayıtları, fotoğraflar ve ayarların ayrı kopyasını saklayıp tamamlandığını kontrol edin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bu cihaza yedekle</h3><p class="manual-feature-body">Yedeği bu cihazın dahili depolama alanına kaydedin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>SD karta veya USB’ye yedekle</h3><p class="manual-feature-body">Yedeği bağlı bir SD karta veya USB depolama cihazına kaydet.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Harici yedek oluştur</h3><p class="manual-feature-body">Yedeğin bir kopyasını başka bir uygulamaya gönderin. Kaydetme işleminin tamamlandığını seçtiğiniz uygulamada kontrol edin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive yedeği</h3><p class="manual-feature-body">Yedekleri Google Drive’a kaydet.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive yedeklerini yönet</h3><p class="manual-feature-body">Tarihli yedekleri inceleyin ve kendiniz silin</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive’dan geri yükle</h3><p class="manual-feature-body">Google Drive’da kayıtlı yedek listesinden seç.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Geri yükle</h3><p class="manual-feature-body">Geri yükleme mevcut verileri yedekle değiştirir; önce mevcut verilerinizi de yedekleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Galeri Depolama Alanı Kontrolü ve Kurtarma</h3><p class="manual-feature-body">Kayıtlara bağlı olmayan fotoğraf dosyalarını inceleyip kontrol sonrası temizleyin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Veri Yönetimi</h3><p class="manual-feature-body">Depolama kullanımını ve veri sıfırlamayı yönetin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Geçici Dosya Temizleme</h3><p class="manual-feature-body">Gereksiz geçici dosyaları silerek depolama alanı açın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Çöp kutusu</h3><p class="manual-feature-body">Bunları 30 gün boyunca Çöp Kutusu'ndan geri yükleyebilirsiniz.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tüm Verileri Sıfırla</h3><p class="manual-feature-body">Bu cihazdaki tüm kayıtlar ve fotoğraflar silinir; önce yedek alın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bildirim Ayarları</h3><p class="manual-feature-body">Önemli uygulama bildirimlerini almak için kullanılır.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Titreşim</h3><p class="manual-feature-body">Uygulama etkileşimleri için titreşimi kullanın.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Veri Kullanımı</h3><p class="manual-feature-body">Yedeklerin yalnızca Wi-Fi ile mi, mobil veriyle de mi yükleneceğini seçin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kullanıcı Kılavuzu</h3><p class="manual-feature-body">Özellik ekranları ve simge açıklamalarıyla uygulamanın kullanımını öğrenin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Destek</h3><p class="manual-feature-body">Sorularınızı, hata bildirimlerinizi ve özellik önerilerinizi e-postayla gönderin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gizlilik politikası</h3><p class="manual-feature-body">Veri toplama ve işleme ayrıntılarını gözden geçirin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hakkında</h3><p class="manual-feature-body">Uygulama sürümünü, kullanım koşullarını ve açık kaynak lisanslarını inceleyin.</p></div></article></section></details><details class="manual-nojs-locale" lang="ar" dir="rtl"><summary>العربية</summary><section><h2>1. الرئيسية</h2><p><a class="manual-nojs-original" href="images/ar/guide-main.webp?v=9be53c4b9e1b" target="_blank" rel="noopener">عرض الأصل (علامة تبويب جديدة): الرئيسية</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>مكان عمل جديد</h3><p class="manual-feature-body">سجّل موقع عمل لربط سجلات الحضور والتسويات والتقارير به.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إدخال العنوان من موقع GPS الحالي</h3><p class="manual-feature-body">املأ عنوان مكان العمل من موقعك الحالي. تحقق من العنوان الفعلي وعدّله عند الحاجة.</p><p class="manual-feature-notice">قد يختلف عنوان GPS عن عنوان مكان العمل الفعلي. تحقق من العنوان الفعلي قبل الحفظ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تغيير مكان العمل</h3><p class="manual-feature-body">أضف عدة مواقع عمل واختر الموقع الذي تحتاجه.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مكان العمل · تحرير</h3><p class="manual-feature-body">عدّل معلومات موقع العمل المسجّل وإعدادات الأجر الافتراضية.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تسجيل الحضور · تسجيل الانصراف</h3><p class="manual-feature-body">بتسجيل الحضور والانصراف تُحسب ساعات العمل تلقائيًا وتُدرج في التسويات والتقارير.</p><p class="manual-feature-notice">تنبيه: لا يمكن تعديل ساعات العمل المحسوبة في التسويات أو معاينة PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الاستراحة</h3><p class="manual-feature-body">تؤخذ فترات الراحة في الحسبان عند حساب وقت العمل الفعلي والأجر.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حساب الأجر</h3><p class="manual-feature-body">يُحسب الأجر تلقائيًا بالساعة أو باليوم، ويمكن اختيار الدفع أسبوعيًا أو شهريًا أو بدورة أخرى.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الدخل · بدل</h3><p class="manual-feature-body">راجع معدل الأجر والبدلات في سجل العمل وعدّل المبالغ عند الحاجة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مذكرة العمل</h3><p class="manual-feature-body">سجّل حالة الموقع وتفاصيل العمل للاطلاع عليها مع سجلات العمل.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>التقط صورة</h3><p class="manual-feature-body">وثّق الموقع بالصور وراجعها في المعرض.</p></div></article></section><section><h2>2. معرض</h2><p><a class="manual-nojs-original" href="images/ar/guide-gallery.webp?v=2fd8d0f0668e" target="_blank" rel="noopener">عرض الأصل (علامة تبويب جديدة): معرض</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>معرض</h3><p class="manual-feature-body">اعرض الصور الملتقطة وعدّلها أو شاركها.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>بحث</h3><p class="manual-feature-body">اعثر على الصور حسب موقع العمل والفترة والتصنيف.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مكان العمل</h3><p class="manual-feature-body">اعرض الصور المرتبطة بمكان العمل المحدد معًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الكل</h3><p class="manual-feature-body">أزل مرشحات البحث ومكان العمل لعرض جميع الصور.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>يوميا</h3><p class="manual-feature-body">تصفح الصور حسب تاريخ التصوير وافتح اليوم المطلوب.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>اختر</h3><p class="manual-feature-body">حدّد عدة صور لمشاركتها أو حذفها معًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>صور</h3><p class="manual-feature-body">افتح الصورة وكبّرها بإصبعين للاطلاع على التفاصيل.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>محرر الصور</h3><p class="manual-feature-body">أضف علامات ونصوصًا إلى الصور واستعد الأصل عند الحاجة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>السهم</h3><p class="manual-feature-body">أبرِز الأجزاء المهمة في الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تسليط الضوء على الدائرة</h3><p class="manual-feature-body">ضع دائرة حول الجزء الذي تريد إبرازه في الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>صندوق مستطيل</h3><p class="manual-feature-body">حدد المنطقة المهمة بإطار مستطيل.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>فسيفساء</h3><p class="manual-feature-body">طبّق الفسيفساء على الأجزاء التي تريد إخفاءها في الصورة المشتركة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إضافة نص</h3><p class="manual-feature-body">أضف توضيحات أو ملاحظات مفيدة إلى الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>محاذاة النص</h3><p class="manual-feature-body">حاذِ النص إلى اليسار أو الوسط أو اليمين داخل مربعه لتسهيل قراءته.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حجم النص</h3><p class="manual-feature-body">اضبط حجم النص المضاف ليكون سهل القراءة على الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>نص غامق</h3><p class="manual-feature-body">اجعل النص المهم أكثر سماكة ليبرز بوضوح.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>اللون</h3><p class="manual-feature-body">اختر ألوانًا للنص والأشكال تتميز عن خلفية الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>العتامة</h3><p class="manual-feature-body">اضبط مقدار تغطية النص والأشكال للصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تدوير</h3><p class="manual-feature-body">أدر الصورة بزيادات قدرها 90 درجة للوصول إلى الاتجاه المناسب للعرض.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تراجع</h3><p class="manual-feature-body">تراجع عن آخر نص أو شكل أو علامة أخرى أُضيفت إلى الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعادة التنفيذ</h3><p class="manual-feature-body">أعد تطبيق النص أو الشكل أو العلامة الأخرى التي تراجعت عنها.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حذف الكائن المحدد</h3><p class="manual-feature-body">أزل النص أو الشكل المحدد فقط من العناصر المضافة إلى الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حفظ</h3><p class="manual-feature-body">تظهر النسخة المعدلة في تفاصيل الصورة، مع الاحتفاظ بالصورة الأصلية الملتقطة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>استعادة الأصل</h3><p class="manual-feature-body">أزل تعديلات الصورة وارجع إلى الأصل المحفوظ.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>شارك</h3><p class="manual-feature-body">شارك نسخة من الصورة تتضمن التعديلات الحالية مع تطبيق آخر.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حذف</h3><p class="manual-feature-body">عند حذف صورة، تحقّق من نطاق الحذف في المعرض والمستندات المرتبطة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>المرفقات · الأحدث أولاً · الأقدم أولاً</h3><p class="manual-feature-body">عند إرفاق الصور، رتبها من الأحدث أو الأقدم للعثور على الصور المطلوبة.</p></div></article></section><section><h2>3. تسوية</h2><p><a class="manual-nojs-original" href="images/ar/guide-settlement.webp?v=64b7dd7b5a50" target="_blank" rel="noopener">عرض الأصل (علامة تبويب جديدة): تسوية</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>تسوية</h3><p class="manual-feature-body">تُحسب مبالغ التسوية تلقائيًا من سجلات العمل وإعدادات الأجر.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>يوميا · أسبوعيا · شهريا</h3><p class="manual-feature-body">اختر تاريخًا أو فترة لإظهار السجلات المطابقة؛ تنطبق أيضًا مرشحات مكان العمل والبحث.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>بحث</h3><p class="manual-feature-body">ابحث عن تفاصيل التسوية حسب الفترة ومكان العمل وغيرها من الشروط.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تحرير</h3><p class="manual-feature-body">افتح التسويات المحفوظة لتعديل معدلات الأجر والبدلات والمطالبات.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>طلب دفع</h3><p class="manual-feature-body">أدِر المطالبات المنفصلة وحالة طلب المبلغ واستلامه.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>المرفقات</h3><p class="manual-feature-body">أضف صورًا من المعرض إلى المستند ورتّب مرفقاته.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>معاينة PDF · تحرير</h3><p class="manual-feature-body">عدّل الحقول المتاحة والصور المرفقة قبل الحفظ بصيغة PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حفظ</h3><p class="manual-feature-body">يحفظ زر الحفظ في التسوية تغييرات المستند. لإنشاء ملف PDF، اضغط على المشاركة ثم احفظه أو أرسله بشكل منفصل في التطبيق المختار.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>شارك</h3><p class="manual-feature-body">تتضمن مشاركة التسوية ملف PDF والصور المرفقة. تحقّق من عدد الملفات ومحتواها قبل اختيار التطبيق.</p></div></article></section><section><h2>4. تقرير</h2><p><a class="manual-no
