t="_blank" rel="noopener">Voir l’original (nouvel onglet): Galerie</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galerie</h3><p class="manual-feature-body">Consultez, modifiez et partagez vos photos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rechercher</h3><p class="manual-feature-body">Retrouvez vos photos par lieu de travail, période et catégorie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lieu de travail</h3><p class="manual-feature-body">Consultez ensemble les photos liées au lieu de travail sélectionné.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tout</h3><p class="manual-feature-body">Effacez les filtres de recherche et de lieu de travail pour voir toutes les photos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quotidiennement</h3><p class="manual-feature-body">Parcourez les photos par date de prise de vue et ouvrez le jour voulu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sélectionner</h3><p class="manual-feature-body">Sélectionnez plusieurs photos pour les partager ou les supprimer ensemble.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photos</h3><p class="manual-feature-body">Ouvrez une photo et agrandissez-la avec deux doigts pour voir les détails.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Éditeur de photos</h3><p class="manual-feature-body">Ajoutez des repères et du texte aux photos, puis restaurez l’original si besoin.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flèche</h3><p class="manual-feature-body">Mettez en évidence les parties importantes d’une photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mise en évidence circulaire</h3><p class="manual-feature-body">Entourez la partie de la photo que vous souhaitez mettre en évidence.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Boîte rectangulaire</h3><p class="manual-feature-body">Encadrez une zone importante avec un rectangle.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaïque</h3><p class="manual-feature-body">Masquez par mosaïque les zones à cacher sur une photo à partager.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ajouter du texte</h3><p class="manual-feature-body">Ajoutez des explications ou des notes utiles à la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alignement du texte</h3><p class="manual-feature-body">Alignez le texte à gauche, au centre ou à droite dans son cadre pour faciliter la lecture.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Taille du texte</h3><p class="manual-feature-body">Ajustez la taille du texte ajouté pour qu’il soit lisible sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Texte en gras</h3><p class="manual-feature-body">Épaississez les caractères importants pour les faire ressortir.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Couleur</h3><p class="manual-feature-body">Choisissez des couleurs de texte et de formes qui se détachent du fond de la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacité</h3><p class="manual-feature-body">Ajustez à quel point le texte et les formes recouvrent la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rotation</h3><p class="manual-feature-body">Faites pivoter la photo par étapes de 90 degrés pour obtenir une orientation confortable.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Annuler</h3><p class="manual-feature-body">Annule le dernier texte, la dernière forme ou autre annotation ajoutée à la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rétablir</h3><p class="manual-feature-body">Rétablit le texte, la forme ou autre annotation annulée.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Supprimer l'objet sélectionné</h3><p class="manual-feature-body">Retirez uniquement le texte ou la forme sélectionnés sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Enregistrer</h3><p class="manual-feature-body">La version modifiée apparaît dans les détails de la photo. La photo originale est conservée.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurer l'original</h3><p class="manual-feature-body">Supprimez les retouches pour retrouver l’original conservé.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Partager</h3><p class="manual-feature-body">Partagez dans une autre application une copie intégrant les retouches actuelles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Supprimer</h3><p class="manual-feature-body">Avant de supprimer une photo, vérifiez la portée sur la galerie et les documents liés.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pièces jointes · Plus récentes en premier · Plus anciennes en premier</h3><p class="manual-feature-body">Lors de l’ajout de photos, triez-les des plus récentes aux plus anciennes ou inversement pour trouver celles voulues.</p></div></article></section><section><h2>3. Règlement</h2><p><a class="manual-nojs-original" href="images/fr/guide-settlement.webp?v=898cfd864f50" target="_blank" rel="noopener">Voir l’original (nouvel onglet): Règlement</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Règlement</h3><p class="manual-feature-body">Les montants sont calculés automatiquement à partir des relevés et des paramètres de salaire.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quotidiennement · Hebdomadaire · Mensuel</h3><p class="manual-feature-body">Choisissez une date ou une période pour afficher les enregistrements correspondants ; les filtres de lieu de travail et de recherche s’appliquent également.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rechercher</h3><p class="manual-feature-body">Recherchez des décomptes par période, lieu de travail et autres critères.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Modifier</h3><p class="manual-feature-body">Rouvrez les décomptes enregistrés pour modifier les tarifs, indemnités et demandes de paiement.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Demande</h3><p class="manual-feature-body">Gérez les demandes de paiement séparées et leur état de demande et de réception.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pièces jointes</h3><p class="manual-feature-body">Ajoutez des photos de la galerie au document et organisez leur ordre.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aperçu PDF · Modifier</h3><p class="manual-feature-body">Modifiez les champs disponibles et les photos jointes avant l’enregistrement en PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Enregistrer</h3><p class="manual-feature-body">Dans un décompte, Enregistrer sauvegarde les modifications du document. Pour créer un PDF, touchez Partager, puis enregistrez-le ou envoyez-le séparément dans l’application de destination.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Partager</h3><p class="manual-feature-body">Le partage d’un décompte inclut le PDF et les photos jointes. Vérifiez le nombre et le contenu des fichiers avant de choisir l’application de destination.</p></div></article></section><section><h2>4. Rapport</h2><p><a class="manual-nojs-original" href="images/fr/guide-report.webp?v=6e7a09056c09" target="_blank" rel="noopener">Voir l’original (nouvel onglet): Rapport</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Rapport</h3><p class="manual-feature-body">Regroupez les relevés et les photos jointes dans un PDF à partager.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Quotidiennement · Hebdomadaire · Mensuel · Rechercher</h3><p class="manual-feature-body">Choisissez une date ou une période pour afficher les enregistrements correspondants ; les filtres de lieu de travail et de recherche s’appliquent également.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aperçu PDF · Modifier</h3><p class="manual-feature-body">Modifiez les champs disponibles et les photos jointes avant l’enregistrement en PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pièces jointes</h3><p class="manual-feature-body">Ajoutez des photos de la galerie au document et organisez leur ordre.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Enregistrer</h3><p class="manual-feature-body">Générer un PDF à partir du document actuel ; utilisez Partager pour conserver une copie externe.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Partager</h3><p class="manual-feature-body">Générez le PDF actuel et choisissez un format de partage et une application destinataire.</p></div></article></section><section><h2>5. Appareil photo</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Scanner le code QR</h3><p class="manual-feature-body">Ouvrez des pages web à partir de codes QR ou copiez du texte brut.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flash</h3><p class="manual-feature-body">Utilisez le flash pour rendre le sujet visible dans les lieux sombres.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Enregistrement de localisation GPS</h3><p class="manual-feature-body">Lorsque « Enregistrement de localisation GPS » est désactivé, l’application n’enregistre pas de coordonnées dans la fiche de la photo. « Afficher l'adresse » est un réglage distinct. Si ce réglage est activé et que l’accès à la localisation est autorisé, l’application peut rechercher et afficher l’adresse correspondant à la position actuelle et l’enregistrer dans la fiche de la photo lors de la prise de vue. Les données EXIF présentes dans le JPEG d’origine sont conservées telles quelles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Emplacement</h3><p class="manual-feature-body">Actualisez votre position pour mettre à jour le lieu de prise de vue.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informations de superposition</h3><p class="manual-feature-body">Choisissez d’inclure ou non les informations de prise de vue sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informations de prise de vue</h3><p class="manual-feature-body">Choisissez le lieu de travail, la position, les notes et la présentation des informations sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Retour</h3><p class="manual-feature-body">Fermez la caméra et revenez à l'écran précédent ; les photos enregistrées restent.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lieu de travail</h3><p class="manual-feature-body">Affichez le nom actuel du lieu de travail dans la superposition de la caméra.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Conservez les coordonnées précises du lieu de prise de vue.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mémo</h3><p class="manual-feature-body">Inscrivez sur la photo les conditions sur place ou les notes utiles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adresse</h3><p class="manual-feature-body">Affichez l'adresse GPS dans la superposition de la caméra.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Date</h3><p class="manual-feature-body">Conservez la date et l’heure de prise de vue sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Couleur du texte</h3><p class="manual-feature-body">Adaptez les informations de prise de vue pour qu’elles restent lisibles sur le fond.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacité du texte · Ombre de lisibilité</h3><p class="manual-feature-body">Ajustez l’opacité et l’intensité de l’ombre pour garder le texte lisible sur la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Déplacer la fiche d’information</h3><p class="manual-feature-body">Déplacez la carte d’informations pour ne pas masquer la photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Luminosité</h3><p class="manual-feature-body">Réglez la luminosité pour mieux saisir les détails sur place.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zoom de la caméra</h3><p class="manual-feature-body">Ajustez le zoom de prise de vue pour obtenir la taille de sujet souhaitée.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Grille</h3><p class="manual-feature-body">La grille aide à aligner l’horizon et à composer la prise de vue.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Changer de caméra</h3><p class="manual-feature-body">Passez de la caméra avant à la caméra arrière pour photographier dans la direction voulue.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Prendre une photo</h3><p class="manual-feature-body">Photographiez le site et consultez les images dans la galerie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vérifier une photo récente</h3><p class="manual-feature-body">Ouvrez les photos récentes pour vérifier immédiatement le résultat des prises de vue.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photos en paysage dans les deux sens</h3><p class="manual-feature-body">Tournez l’appareil pour photographier une vue plus large du site.</p></div></article></section><section><h2>6. Paramètres</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Langue et région</h3><p class="manual-feature-body">Choisissez la langue d’affichage et votre pays/région actuel.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Langue</h3><p class="manual-feature-body">Choisissez la langue à utiliser dans l’application.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pays/région actuel</h3><p class="manual-feature-body">Les formats de date, de nombre et de devise sont définis selon le pays/la région sélectionné.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Devise</h3><p class="manual-feature-body">Adaptez l’affichage des montants à votre devise.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paramètres de format d'heure</h3><p class="manual-feature-body">Choisissez la façon dont les dates et les heures sont affichées.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paramètres du thème</h3><p class="manual-feature-body">Choisissez un affichage clair ou sombre selon la lumière ambiante.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mes infos</h3><p class="manual-feature-body">Gérez les valeurs par défaut réutilisables du travailleur et de la paie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paramètres de la caméra</h3><p class="manual-feature-body">Réglez la prise de vue, l’enregistrement de la position et l’affichage des informations selon vos besoins.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photo d’arrivée</h3><p class="manual-feature-body">Une photo est requise avant le pointage d’arrivée.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photo de départ</h3><p class="manual-feature-body">Prendre une photo avant d’enregistrer la fin du travail.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Édition d'images</h3><p class="manual-feature-body">Autoriser l'édition des détails des photos et le stockage des images modifiées.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Partage de photos</h3><p class="manual-feature-body">Partagez des photos à partir des détails de la photo et de la sélection de la galerie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Joindre des photos au rapport</h3><p class="manual-feature-body">Joignez les photos de la galerie capturées à la date du rapport.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibration à la prise de vue</h3><p class="manual-feature-body">Une vibration indique si la prise de vue a réussi ou échoué.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Son de l’obturateur</h3><p class="manual-feature-body">Un son est émis lors de la prise de vue. Il ne peut pas être désactivé, mais son volume est réglable de 1 à 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Enregistrer la copie compressée</h3><p class="manual-feature-body">Stockez une copie éditée compressée tout en conservant l’original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paramètres de la galerie</h3><p class="manual-feature-body">Choisissez la taille des vignettes pour voir davantage de photos à la fois ou les examiner plus facilement.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Autorisations</h3><p class="manual-feature-body">Vérifiez l'état d'autorisation requis pour les fonctionnalités TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Protection des enregistrements</h3><p class="manual-feature-body">Consultez les règles d’enregistrement des sources des photos, des informations de prise de vue et de l’historique des modifications.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sauvegarde</h3><p class="manual-feature-body">Conservez une copie des relevés, photos et réglages, puis vérifiez la fin de la sauvegarde.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sauvegarder sur cet appareil</h3><p class="manual-feature-body">Enregistrez la sauvegarde dans le stockage interne de cet appareil.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sauvegarde sur carte SD ou USB</h3><p class="manual-feature-body">Enregistre la sauvegarde sur une carte SD ou un périphérique USB connecté.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Créer une sauvegarde externe</h3><p class="manual-feature-body">Transmettez une copie de la sauvegarde à une autre application. Vérifiez dans l’application choisie que l’enregistrement est terminé.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sauvegarde Google Drive</h3><p class="manual-feature-body">Enregistre les sauvegardes dans Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gérer les sauvegardes Google Drive</h3><p class="manual-feature-body">Consultez les sauvegardes datées et supprimez-les vous-même</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurer depuis Google Drive</h3><p class="manual-feature-body">Choisissez dans la liste des sauvegardes enregistrées dans Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restaurer</h3><p class="manual-feature-body">La restauration remplace les données actuelles par la sauvegarde ; sauvegardez d’abord vos données actuelles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vérification et récupération du stockage de la galerie</h3><p class="manual-feature-body">Inspectez les fichiers photo sans lien avec un enregistrement, puis nettoyez-les après vérification.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gestion des données</h3><p class="manual-feature-body">Gérez l'utilisation du stockage et la réinitialisation des données.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nettoyage de fichiers temporaires</h3><p class="manual-feature-body">Libérez de l’espace de stockage en supprimant les fichiers temporaires inutiles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Corbeille</h3><p class="manual-feature-body">Vous pouvez les restaurer depuis la corbeille pendant 30 jours.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Réinitialiser toutes les données</h3><p class="manual-feature-body">Supprime tous les relevés et photos de cet appareil ; sauvegardez-les d’abord.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paramètres de notification</h3><p class="manual-feature-body">Utilisée pour recevoir les notifications importantes de l’application.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibrations</h3><p class="manual-feature-body">Utilisez les vibrations pour les interactions avec les applications.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Utilisation des données</h3><p class="manual-feature-body">Choisissez si les sauvegardes sont envoyées uniquement en Wi-Fi ou aussi via les données mobiles.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guide utilisateur</h3><p class="manual-feature-body">Découvrez les fonctions grâce aux écrans et aux explications des icônes.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Assistance</h3><p class="manual-feature-body">Envoyez vos questions, signalements de bugs et suggestions de fonctions par e-mail.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Politique de confidentialité</h3><p class="manual-feature-body">Examinez les détails de la collecte et du traitement des données.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>À propos</h3><p class="manual-feature-body">Consultez la version de l’application, les conditions d’utilisation et les licences open source.</p></div></article></section></details><details class="manual-nojs-locale" lang="de" dir="ltr"><summary>Deutsch</summary><section><h2>1. Start</h2><p><a class="manual-nojs-original" href="images/de/guide-main.webp?v=05456adc9881" target="_blank" rel="noopener">Original öffnen (neuer Tab): Start</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Neuer Arbeitsplatz</h3><p class="manual-feature-body">Registrierte Arbeitsorte werden mit Arbeitszeiten, Abrechnungen und Berichten verknüpft.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adresse aus aktuellem GPS-Standort</h3><p class="manual-feature-body">Übernehmen Sie die Adresse Ihres aktuellen Standorts als Arbeitsstättenadresse. Prüfen und korrigieren Sie sie bei Bedarf.</p><p class="manual-feature-notice">Die GPS-Adresse kann von der tatsächlichen Arbeitsstättenadresse abweichen. Prüfen Sie die Adresse vor dem Speichern.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arbeitsplatz wechseln</h3><p class="manual-feature-body">Registrieren Sie mehrere Arbeitsorte und wählen Sie den benötigten aus.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arbeitsplatz · Bearbeiten</h3><p class="manual-feature-body">Bearbeiten Sie Angaben und Lohnvorgaben eines registrierten Arbeitsorts.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Einstempeln · Ausstempeln</h3><p class="manual-feature-body">Beim Ein- und Ausstempeln wird die Arbeitszeit automatisch für Abrechnungen und Berichte berechnet.</p><p class="manual-feature-notice">Hinweis: Die berechnete Arbeitszeit kann in Abrechnungen und PDF-Vorschauen nicht geändert werden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pause</h3><p class="manual-feature-body">Pausen werden bei der Berechnung der tatsächlichen Arbeitszeit und des Lohns berücksichtigt.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lohnberechnung</h3><p class="manual-feature-body">Der Lohn wird aus Stunden- oder Tagessätzen berechnet; wählen Sie etwa wöchentliche oder monatliche Auszahlung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Einkommen · Zulage</h3><p class="manual-feature-body">Prüfen Sie Lohnsatz und Zulagen eines Arbeitseintrags und passen Sie Beträge bei Bedarf an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arbeitsnotiz</h3><p class="manual-feature-body">Halten Sie Baustellennotizen und Arbeitsdetails zusammen mit Ihren Arbeitseinträgen fest.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Machen Sie ein Foto</h3><p class="manual-feature-body">Dokumentieren Sie den Arbeitsort mit Fotos und prüfen Sie sie in der Galerie.</p></div></article></section><section><h2>2. Galerie</h2><p><a class="manual-nojs-original" href="images/de/guide-gallery.webp?v=9d8b58d5206e" target="_blank" rel="noopener">Original öffnen (neuer Tab): Galerie</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galerie</h3><p class="manual-feature-body">Sehen Sie aufgenommene Fotos an, bearbeiten oder teilen Sie sie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Suchen</h3><p class="manual-feature-body">Finden Sie Fotos nach Arbeitsort, Zeitraum und Kategorie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arbeitsplatz</h3><p class="manual-feature-body">Sehen Sie die Fotos des ausgewählten Arbeitsorts zusammen an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alle</h3><p class="manual-feature-body">Setzen Sie Such- und Arbeitsortfilter zurück, um alle Fotos zu sehen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Täglich</h3><p class="manual-feature-body">Durchsuchen Sie Fotos nach Aufnahmedatum und öffnen Sie den gewünschten Tag.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Auswählen</h3><p class="manual-feature-body">Wählen Sie mehrere Fotos aus, um sie gemeinsam zu teilen oder zu löschen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos</h3><p class="manual-feature-body">Öffnen Sie ein Foto und vergrößern Sie Details mit zwei Fingern.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotoeditor</h3><p class="manual-feature-body">Fügen Sie Fotos Markierungen und Text hinzu und stellen Sie bei Bedarf das Original wieder her.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pfeil</h3><p class="manual-feature-body">Heben Sie wichtige Stellen auf einem Foto hervor.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kreishervorhebung</h3><p class="manual-feature-body">Kreisen Sie den Bereich des Fotos ein, den Sie hervorheben möchten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rechteckige Box</h3><p class="manual-feature-body">Markieren Sie einen wichtigen Bereich mit einem Rechteck.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaik</h3><p class="manual-feature-body">Verdecken Sie Bereiche eines zu teilenden Fotos mit einem Mosaik.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Text hinzufügen</h3><p class="manual-feature-body">Ergänzen Sie das Foto um hilfreiche Erklärungen oder Notizen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Textausrichtung</h3><p class="manual-feature-body">Richten Sie Text im Textfeld links, mittig oder rechts aus, damit er gut lesbar ist.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Textgröße</h3><p class="manual-feature-body">Passen Sie die Größe hinzugefügter Schrift an, damit sie auf dem Foto lesbar ist.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fettgedruckter Text</h3><p class="manual-feature-body">Heben Sie wichtigen Text durch eine stärkere Schrift hervor.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Farbe</h3><p class="manual-feature-body">Wählen Sie Schrift- und Formfarben, die sich vom Fotohintergrund abheben.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opazität</h3><p class="manual-feature-body">Passen Sie an, wie stark Schrift und Formen das Foto überdecken.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Drehen</h3><p class="manual-feature-body">Drehen Sie das Foto in 90-Grad-Schritten in eine gut lesbare Ausrichtung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rückgängig</h3><p class="manual-feature-body">Machen Sie den zuletzt hinzugefügten Text, die Form oder eine andere Markierung rückgängig.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Wiederholen</h3><p class="manual-feature-body">Wenden Sie den rückgängig gemachten Text, die Form oder Markierung erneut an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ausgewähltes Objekt löschen</h3><p class="manual-feature-body">Entfernen Sie nur den ausgewählten Text oder die ausgewählte Form auf dem Foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Speichern</h3><p class="manual-feature-body">Die bearbeitete Fassung erscheint in den Fotodetails. Das aufgenommene Original bleibt erhalten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Original wiederherstellen</h3><p class="manual-feature-body">Entfernen Sie Fotobearbeitungen und kehren Sie zum aufbewahrten Original zurück.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Teilen</h3><p class="manual-feature-body">Teilen Sie eine Fotokopie mit den aktuellen Bearbeitungen in einer anderen App.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Löschen</h3><p class="manual-feature-body">Prüfen Sie beim Löschen eines Fotos den Geltungsbereich für Galerie und verknüpfte Dokumente.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anhänge · Neueste zuerst · Älteste zuerst</h3><p class="manual-feature-body">Sortieren Sie beim Anhängen Fotos nach neuestem oder ältestem Datum, um passende Bilder zu finden.</p></div></article></section><section><h2>3. Abrechnung</h2><p><a class="manual-nojs-original" href="images/de/guide-settlement.webp?v=37655d5e8a27" target="_blank" rel="noopener">Original öffnen (neuer Tab): Abrechnung</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Abrechnung</h3><p class="manual-feature-body">Abrechnungsbeträge werden automatisch aus Arbeitseinträgen und Lohneinstellungen berechnet.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Täglich · Wöchentlich · Monatlich</h3><p class="manual-feature-body">Wählen Sie ein Datum oder einen Zeitraum aus, um übereinstimmende Datensätze anzuzeigen. Es gelten auch Arbeitsplatz- und Suchfilter.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Suchen</h3><p class="manual-feature-body">Suchen Sie Abrechnungen nach Zeitraum, Arbeitsort und weiteren Kriterien.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bearbeiten</h3><p class="manual-feature-body">Öffnen Sie gespeicherte Abrechnungen erneut, um Lohnsätze, Zulagen und Forderungen zu ändern.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Forderung</h3><p class="manual-feature-body">Verwalten Sie separate Forderungen und deren Anforderungs- und Empfangsstatus.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anhänge</h3><p class="manual-feature-body">Fügen Sie Galeriefotos zu einem Dokument hinzu und ordnen Sie sie an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF-Vorschau · Bearbeiten</h3><p class="manual-feature-body">Bearbeiten Sie verfügbare Dokumentfelder und angehängte Fotos vor dem Speichern als PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Speichern</h3><p class="manual-feature-body">Speichern in der Abrechnung speichert Dokumentänderungen. Tippen Sie zum Erstellen einer PDF auf Teilen und speichern oder versenden Sie sie separat in der Ziel-App.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Teilen</h3><p class="manual-feature-body">Beim Teilen der Abrechnung werden die PDF und angehängte Fotos geteilt. Prüfen Sie Anzahl und Inhalt der Dateien, bevor Sie die Ziel-App wählen.</p></div></article></section><section><h2>4. Bericht</h2><p><a class="manual-nojs-original" href="images/de/guide-report.webp?v=f4c4c151cba0" target="_blank" rel="noopener">Original öffnen (neuer Tab): Bericht</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Bericht</h3><p class="manual-feature-body">Fassen Sie Arbeitseinträge und Fotos zu einer PDF zusammen und teilen Sie sie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Täglich · Wöchentlich · Monatlich · Suchen</h3><p class="manual-feature-body">Wählen Sie ein Datum oder einen Zeitraum aus, um übereinstimmende Datensätze anzuzeigen. Es gelten auch Arbeitsplatz- und Suchfilter.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF-Vorschau · Bearbeiten</h3><p class="manual-feature-body">Bearbeiten Sie verfügbare Dokumentfelder und angehängte Fotos vor dem Speichern als PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anhänge</h3><p class="manual-feature-body">Fügen Sie Galeriefotos zu einem Dokument hinzu und ordnen Sie sie an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Speichern</h3><p class="manual-feature-body">Generieren Sie ein PDF aus dem aktuellen Dokument. Verwenden Sie Teilen, um eine externe Kopie zu behalten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Teilen</h3><p class="manual-feature-body">Generieren Sie das aktuelle PDF und wählen Sie ein Freigabeformat und eine Empfänger-App.</p></div></article></section><section><h2>5. Kamera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>QR-Code scannen</h3><p class="manual-feature-body">Webseiten aus QR-Codes öffnen oder einfachen Text kopieren.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Blitz</h3><p class="manual-feature-body">Nutzen Sie den Blitz, damit Motive an dunklen Orten erkennbar sind.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS-Standortaufzeichnung</h3><p class="manual-feature-body">Wenn „GPS-Standortaufzeichnung“ deaktiviert ist, speichert die App keine Koordinaten im Fotodatensatz. „Adresse anzeigen“ ist eine separate Einstellung. Wenn sie aktiviert ist und die Standortberechtigung erteilt wurde, kann die App die Adresse anhand des aktuellen Standorts ermitteln, anzeigen und bei der Aufnahme im Fotodatensatz speichern. Die im Original-JPEG enthaltenen EXIF-Daten bleiben unverändert.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Standort</h3><p class="manual-feature-body">Ermitteln Sie Ihren aktuellen Standort erneut, um die Aufnahmeortdaten zu aktualisieren.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Overlay-Info</h3><p class="manual-feature-body">Wählen Sie, ob Aufnahmeinformationen auf dem Foto erscheinen sollen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aufnahmeinformationen</h3><p class="manual-feature-body">Wählen Sie Arbeitsort, Standort, Notizen und Darstellungsweise für die Informationen auf dem Foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zurück</h3><p class="manual-feature-body">Schließen Sie die Kamera und kehren Sie zum vorherigen Bildschirm zurück. Gespeicherte Fotos bleiben erhalten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arbeitsplatz</h3><p class="manual-feature-body">Zeigt den aktuellen Arbeitsplatznamen im Kamera-Overlay an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Halten Sie den Aufnahmeort mit genauen Koordinaten fest.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Notiz</h3><p class="manual-feature-body">Halten Sie den Zustand vor Ort oder wichtige Notizen auf dem Foto fest.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Adresse</h3><p class="manual-feature-body">Zeigen Sie die GPS-Adresse im Kamera-Overlay an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Datum</h3><p class="manual-feature-body">Halten Sie Aufnahmedatum und Uhrzeit auf dem Foto fest.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Textfarbe</h3><p class="manual-feature-body">Passen Sie die Aufnahmeinformationen für gute Lesbarkeit vor dem Fotohintergrund an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Textopazität · Lesbarkeitsschatten</h3><p class="manual-feature-body">Passen Sie Deckkraft und Schattenstärke an, damit der Text vor dem Fotohintergrund lesbar bleibt.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informationskarte verschieben</h3><p class="manual-feature-body">Ziehen Sie die Informationskarte an eine Stelle, an der sie das Motiv nicht verdeckt.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Helligkeit</h3><p class="manual-feature-body">Passen Sie die Belichtung an, um Details vor Ort besser aufzunehmen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kamerazoom</h3><p class="manual-feature-body">Passen Sie den Aufnahmezoom an, damit das Motiv in der gewünschten Größe erscheint.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gitter</h3><p class="manual-feature-body">Das Raster hilft Ihnen, den Horizont auszurichten und den Bildaufbau zu planen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kamera wechseln</h3><p class="manual-feature-body">Wechseln Sie zwischen Front- und Rückkamera, um in die gewünschte Richtung aufzunehmen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Machen Sie ein Foto</h3><p class="manual-feature-body">Dokumentieren Sie den Arbeitsort mit Fotos und prüfen Sie sie in der Galerie.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ein aktuelles Foto prüfen</h3><p class="manual-feature-body">Öffnen Sie die zuletzt aufgenommenen Fotos, um das Ergebnis sofort zu prüfen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Querformat in beide Richtungen</h3><p class="manual-feature-body">Drehen Sie das Gerät quer, um einen breiteren Ausschnitt aufzunehmen.</p></div></article></section><section><h2>6. Einstellungen</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Sprache und Region</h3><p class="manual-feature-body">Wählen Sie die Anzeigesprache und Ihr aktuelles Land/Ihre aktuelle Region.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sprache</h3><p class="manual-feature-body">Wählen Sie die Sprache aus, die in der App verwendet werden soll.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aktuelles Land/Region</h3><p class="manual-feature-body">Datums-, Zahlen- und Währungsanzeige werden anhand des ausgewählten Landes/der ausgewählten Region festgelegt.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Währung</h3><p class="manual-feature-body">Passen Sie die Betragsanzeige an Ihre Währung an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zeitformateinstellungen</h3><p class="manual-feature-body">Wählen Sie aus, wie Datum und Uhrzeit angezeigt werden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Theme-Einstellungen</h3><p class="manual-feature-body">Wählen Sie je nach Umgebungslicht eine helle oder dunkle Darstellung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Meine Infos</h3><p class="manual-feature-body">Verwalte wiederverwendbare Standardwerte für Arbeiter und Lohn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kameraeinstellungen</h3><p class="manual-feature-body">Passen Sie Aufnahme, Standortaufzeichnung und Informationsanzeige an Ihre Bedürfnisse an.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Check-in-Foto</h3><p class="manual-feature-body">Vor Beginn des Check-ins ist eine Kameraaufnahme erforderlich.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Check-out-Foto</h3><p class="manual-feature-body">Erfordern Sie eine Kameraaufnahme, bevor der Check-out gespeichert wird.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bildbearbeitung</h3><p class="manual-feature-body">Ermöglichen Sie die Bearbeitung von Fotodetails und die Speicherung bearbeiteter Bilder.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto-Sharing</h3><p class="manual-feature-body">Teilen Sie Fotos aus Fotodetails und Galerieauswahl.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Fotos zum Bericht hinzufügen</h3><p class="manual-feature-body">Hängen Sie Galeriefotos an, die am Berichtsdatum aufgenommen wurden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibration bei Aufnahmen</h3><p class="manual-feature-body">Nutzen Sie Vibrations-Feedback für Erfolg und Misserfolg der Erfassung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Auslöseton bei Aufnahmen</h3><p class="manual-feature-body">Beim Fotografieren ertönt ein Auslöseton. Er lässt sich nicht ausschalten; die Lautstärke ist von 1 bis 10 einstellbar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Komprimierte Kopie speichern</h3><p class="manual-feature-body">Speichern Sie eine komprimierte bearbeitete Kopie und behalten Sie dabei das Original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Galerieeinstellungen</h3><p class="manual-feature-body">Wählen Sie die Größe der Vorschaubilder, um mehr Fotos gleichzeitig oder einzelne Bilder größer zu sehen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Berechtigungen</h3><p class="manual-feature-body">Überprüfen Sie den für TAIPOPO-Funktionen erforderlichen Berechtigungsstatus.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Datensatzschutz</h3><p class="manual-feature-body">Lesen Sie nach, wie Fotoquellen, Aufnahmeinformationen und Bearbeitungsverläufe erfasst werden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sicherung</h3><p class="manual-feature-body">Sichern Sie Arbeitseinträge, Fotos und Einstellungen separat und prüfen Sie den Abschluss.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Auf diesem Gerät sichern</h3><p class="manual-feature-body">Speichern Sie die Sicherung im internen Speicher dieses Geräts.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Auf SD-Karte oder USB sichern</h3><p class="manual-feature-body">Speichert die Sicherung auf einer verbundenen SD-Karte oder einem USB-Speichergerät.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Externe Sicherung erstellen</h3><p class="manual-feature-body">Übergeben Sie eine Kopie der Sicherung an eine andere App. Prüfen Sie in der ausgewählten App, ob sie gespeichert wurde.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive-Sicherung</h3><p class="manual-feature-body">Speichert Sicherungen in Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive-Sicherungen verwalten</h3><p class="manual-feature-body">Datierte Sicherungen prüfen und selbst löschen</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aus Google Drive wiederherstellen</h3><p class="manual-feature-body">Wähle aus der in Google Drive gespeicherten Sicherungsliste.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Wiederherstellen</h3><p class="manual-feature-body">Die Wiederherstellung ersetzt aktuelle App-Daten durch die Sicherung; sichern Sie deshalb zuerst Ihre aktuellen Daten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Überprüfung und Wiederherstellung des Galeriespeichers</h3><p class="manual-feature-body">Prüfen Sie Fotodateien ohne Verknüpfung zu Aufzeichnungen und bereinigen Sie diese nach Kontrolle.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Datenmanagement</h3><p class="manual-feature-body">Verwalten Sie die Speichernutzung und das Zurücksetzen von Daten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Temporäre Dateibereinigung</h3><p class="manual-feature-body">Entfernen Sie unnötige temporäre Dateien, um Speicherplatz freizugeben.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Müll</h3><p class="manual-feature-body">Sie können sie 30 Tage lang aus dem Papierkorb wiederherstellen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alle Daten zurücksetzen</h3><p class="manual-feature-body">Alle auf diesem Gerät gespeicherten Einträge und Fotos werden gelöscht; sichern Sie zuerst Ihre Daten.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Benachrichtigungseinstellungen</h3><p class="manual-feature-body">Wird verwendet, um wichtige App-Benachrichtigungen zu empfangen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibration</h3><p class="manual-feature-body">Verwenden Sie Vibration für App-Interaktionen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Datennutzung</h3><p class="manual-feature-body">Legen Sie fest, ob Sicherungen nur über WLAN oder auch über mobile Daten hochgeladen werden.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Benutzerhandbuch</h3><p class="manual-feature-body">Lernen Sie die App anhand der Funktionsansichten und Symbolerklärungen kennen.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hilfe</h3><p class="manual-feature-body">Senden Sie Fragen, Fehlermeldungen und Funktionsvorschläge per E-Mail.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Datenschutzerklärung</h3><p class="manual-feature-body">Überprüfen Sie die Details zur Datenerfassung und -verarbeitung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Über</h3><p class="manual-feature-body">Prüfen Sie die App-Version, Nutzungsbedingungen und Open-Source-Lizenzen.</p></div></article></section></details><details class="manual-nojs-locale" lang="id" dir="ltr"><summary>Bahasa Indonesia</summary><section><h2>1. Beranda</h2><p><a class="manual-nojs-original" href="images/id/guide-main.webp?v=334f78d05051" target="_blank" rel="noopener">Lihat asli (tab baru): Beranda</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Tempat Kerja Baru</h3><p class="manual-feature-body">Daftarkan tempat kerja untuk menghubungkan absensi, perhitungan upah, dan laporan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Isi alamat dari lokasi GPS saat ini</h3><p class="manual-feature-body">Isi alamat tempat kerja dari lokasi saat ini. Periksa alamat sebenarnya dan ubah jika perlu.</p><p class="manual-feature-notice">Alamat GPS mungkin berbeda dari alamat tempat kerja yang sebenarnya. Periksa alamat sebelum menyimpan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ubah Tempat Kerja</h3><p class="manual-feature-body">Daftarkan beberapa tempat kerja dan pilih sesuai kebutuhan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tempat kerja · Sunting</h3><p class="manual-feature-body">Ubah informasi dan pengaturan upah bawaan tempat kerja terdaftar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Absen masuk · Absen pulang</h3><p class="manual-feature-body">Catat jam masuk dan pulang agar waktu kerja otomatis dihitung untuk perhitungan upah dan laporan.</p><p class="manual-feature-notice">Catatan: Waktu kerja yang telah dihitung tidak dapat diubah dalam perhitungan upah atau pratinjau PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Istirahat</h3><p class="manual-feature-body">Waktu istirahat diperhitungkan dalam perhitungan waktu kerja aktual dan upah.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Perhitungan Upah</h3><p class="manual-feature-body">Upah dihitung otomatis dari tarif per jam atau harian; pilih pembayaran mingguan, bulanan, atau siklus lain.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pendapatan · Tunjangan</h3><p class="manual-feature-body">Periksa tarif dan tunjangan pada catatan kerja, lalu sesuaikan jumlahnya bila perlu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Memo Kerja</h3><p class="manual-feature-body">Simpan catatan kondisi lokasi dan detail pekerjaan bersama catatan kerja.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ambil Foto</h3><p class="manual-feature-body">Dokumentasikan lokasi dalam foto dan lihat hasilnya di galeri.</p></div></article></section><section><h2>2. Galeri</h2><p><a class="manual-nojs-original" href="images/id/guide-gallery.webp?v=3220945f0f05" target="_blank" rel="noopener">Lihat asli (tab baru): Galeri</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galeri</h3><p class="manual-feature-body">Lihat, edit, atau bagikan foto yang telah diambil.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cari</h3><p class="manual-feature-body">Temukan foto berdasarkan tempat kerja, periode, dan kategori.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tempat kerja</h3><p class="manual-feature-body">Lihat bersama foto yang terhubung ke tempat kerja pilihan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Semua</h3><p class="manual-feature-body">Hapus filter pencarian dan tempat kerja untuk melihat semua foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Setiap hari</h3><p class="manual-feature-body">Telusuri foto menurut tanggal pengambilan dan buka tanggal yang diperlukan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pilih</h3><p class="manual-feature-body">Pilih beberapa foto untuk dibagikan atau dihapus sekaligus.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto</h3><p class="manual-feature-body">Buka foto dan perbesar dengan dua jari untuk melihat detail.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Penyunting Foto</h3><p class="manual-feature-body">Tambahkan penanda dan teks pada foto, lalu pulihkan aslinya bila perlu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Panah</h3><p class="manual-feature-body">Tandai bagian penting pada foto agar mudah terlihat.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sorotan Lingkaran</h3><p class="manual-feature-body">Lingkari bagian foto yang ingin ditonjolkan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kotak Persegi Panjang</h3><p class="manual-feature-body">Bingkai area penting dengan persegi panjang.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaik</h3><p class="manual-feature-body">Terapkan mosaik pada bagian foto yang ingin disembunyikan saat dibagikan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tambahkan Teks</h3><p class="manual-feature-body">Tambahkan penjelasan atau catatan yang diperlukan pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Perataan teks</h3><p class="manual-feature-body">Ratakan teks ke kiri, tengah, atau kanan dalam kotaknya agar mudah dibaca.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ukuran teks</h3><p class="manual-feature-body">Sesuaikan ukuran teks tambahan agar terbaca jelas pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Teks tebal</h3><p class="manual-feature-body">Tebalkan teks penting agar lebih menonjol.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Warna</h3><p class="manual-feature-body">Pilih warna teks dan bentuk yang jelas berbeda dari latar foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opasitas</h3><p class="manual-feature-body">Atur seberapa banyak teks dan bentuk menutupi foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Putar</h3><p class="manual-feature-body">Putar foto dalam langkah 90 derajat agar arahnya nyaman dilihat.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Urungkan</h3><p class="manual-feature-body">Membatalkan teks, bentuk, atau tanda lain yang terakhir ditambahkan ke foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ulangi</h3><p class="manual-feature-body">Menerapkan kembali teks, bentuk, atau tanda lain yang dibatalkan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hapus objek yang dipilih</h3><p class="manual-feature-body">Hapus hanya teks atau bentuk tambahan yang dipilih pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Simpan</h3><p class="manual-feature-body">Versi yang diedit ditampilkan pada detail foto. Foto asli tetap disimpan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kembalikan Aslinya</h3><p class="manual-feature-body">Hapus hasil edit dan kembali ke foto asli yang tersimpan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bagikan</h3><p class="manual-feature-body">Bagikan salinan foto dengan hasil edit saat ini ke aplikasi lain.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Hapus</h3><p class="manual-feature-body">Saat menghapus foto, periksa cakupannya pada galeri dan dokumen tertaut.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lampiran · Terbaru dahulu · Terlama dahulu</h3><p class="manual-feature-body">Saat melampirkan foto, urutkan dari terbaru atau terlama untuk menemukan foto yang diperlukan.</p></div></article></section><section><h2>3. Perhitungan upah</h2><p><a class="manual-nojs-original" href="images/id/guide-settlement.webp?v=d00dd3fba3b1" target="_blank" rel="noopener">Lihat asli (tab baru): Perhitungan upah</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Perhitungan upah</h3><p class="manual-feature-body">Jumlah upah dihitung otomatis berdasarkan catatan kerja dan pengaturan upah.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Setiap hari · Mingguan · Bulanan</h3><p class="manual-feature-body">Pilih tanggal atau periode untuk menampilkan catatan yang cocok; filter tempat kerja dan pencarian juga berlaku.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cari</h3><p class="manual-feature-body">Cari rincian penyelesaian pembayaran berdasarkan periode, tempat kerja, dan kondisi lainnya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sunting</h3><p class="manual-feature-body">Buka kembali perhitungan upah tersimpan untuk mengubah tarif, tunjangan, dan tagihan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tagihan</h3><p class="manual-feature-body">Kelola tagihan terpisah serta status permintaan dan penerimaannya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lampiran</h3><p class="manual-feature-body">Pilih foto galeri untuk ditambahkan ke dokumen dan atur urutannya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pratinjau PDF · Sunting</h3><p class="manual-feature-body">Ubah isi yang dapat diedit dan foto terlampir sebelum menyimpan sebagai PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Simpan</h3><p class="manual-feature-body">Simpan pada penyelesaian menyimpan perubahan dokumen. Untuk membuat PDF, ketuk Bagikan, lalu simpan atau kirim secara terpisah di aplikasi tujuan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bagikan</h3><p class="manual-feature-body">Berbagi penyelesaian menyertakan PDF dan foto terlampir. Periksa jumlah serta isi berkas sebelum memilih aplikasi tujuan.</p></div></article></section><section><h2>4. Laporan</h2><p><a class="manual-nojs-original" href="images/id/guide-report.webp?v=0cb71ee7efb2" target="_blank" rel="noopener">Lihat asli (tab baru): Laporan</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Laporan</h3><p class="manual-feature-body">Susun catatan kerja dan foto terlampir menjadi PDF untuk dibagikan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Setiap hari · Mingguan · Bulanan · Cari</h3><p class="manual-feature-body">Pilih tanggal atau periode untuk menampilkan catatan yang cocok; filter tempat kerja dan pencarian juga berlaku.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pratinjau PDF · Sunting</h3><p class="manual-feature-body">Ubah isi yang dapat diedit dan foto terlampir sebelum menyimpan sebagai PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lampiran</h3><p class="manual-feature-body">Pilih foto galeri untuk ditambahkan ke dokumen dan atur urutannya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Simpan</h3><p class="manual-feature-body">Hasilkan PDF dari dokumen saat ini; gunakan Bagikan untuk menyimpan salinan eksternal.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bagikan</h3><p class="manual-feature-body">Hasilkan PDF saat ini dan pilih format berbagi dan aplikasi penerima.</p></div></article></section><section><h2>5. Kamera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Pindai kode QR</h3><p class="manual-feature-body">Buka halaman web dari kode QR atau salin teks biasa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lampu kilat</h3><p class="manual-feature-body">Gunakan lampu kilat agar objek terlihat di tempat gelap.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Catatan Lokasi GPS</h3><p class="manual-feature-body">Jika “Catatan Lokasi GPS” dimatikan, aplikasi tidak menyimpan koordinat dalam catatan foto. “Tampilkan Alamat” adalah pengaturan terpisah. Jika pengaturan ini diaktifkan dan izin lokasi diberikan, aplikasi dapat mencari dan menampilkan alamat berdasarkan lokasi saat ini, lalu menyimpannya dalam catatan foto saat foto diambil. Data EXIF yang ada pada JPEG asli dipertahankan apa adanya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lokasi</h3><p class="manual-feature-body">Periksa ulang lokasi saat ini untuk memperbarui informasi lokasi pemotretan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Info Hamparan</h3><p class="manual-feature-body">Pilih apakah informasi pemotretan disertakan pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informasi pemotretan</h3><p class="manual-feature-body">Pilih tempat kerja, lokasi, catatan, dan tampilan informasi yang akan ditampilkan pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kembali</h3><p class="manual-feature-body">Tutup kamera dan kembali ke layar sebelumnya; foto yang disimpan tetap ada.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tempat kerja</h3><p class="manual-feature-body">Tampilkan nama tempat kerja saat ini di hamparan kamera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Simpan koordinat lokasi pemotretan yang tepat.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Memo</h3><p class="manual-feature-body">Catat kondisi lokasi atau informasi penting pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Alamat</h3><p class="manual-feature-body">Tampilkan alamat GPS di overlay kamera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tanggal</h3><p class="manual-feature-body">Sertakan tanggal dan waktu pemotretan pada foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Warna teks</h3><p class="manual-feature-body">Sesuaikan agar informasi pemotretan mudah dibaca pada latar foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opasitas teks · Bayangan keterbacaan</h3><p class="manual-feature-body">Atur opasitas dan kekuatan bayangan agar teks tetap terbaca di atas foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pindahkan kartu informasi</h3><p class="manual-feature-body">Geser kartu informasi agar tidak menutupi foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kecerahan</h3><p class="manual-feature-body">Sesuaikan pencahayaan agar detail lokasi terlihat lebih jelas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zoom Kamera</h3><p class="manual-feature-body">Atur zoom pemotretan agar subjek tampak pada ukuran yang diinginkan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Garis kisi</h3><p class="manual-feature-body">Kisi membantu meluruskan cakrawala dan mengatur komposisi saat memotret.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ganti kamera</h3><p class="manual-feature-body">Beralih antara kamera depan dan belakang untuk memotret ke arah yang diperlukan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ambil Foto</h3><p class="manual-feature-body">Dokumentasikan lokasi dalam foto dan lihat hasilnya di galeri.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Periksa foto terbaru</h3><p class="manual-feature-body">Buka foto terbaru untuk segera memeriksa hasil pemotretan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto lanskap ke kedua arah</h3><p class="manual-feature-body">Putar perangkat mendatar untuk memotret area lokasi yang lebih luas.</p></div></article></section><section><h2>6. Pengaturan</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Bahasa dan Wilayah</h3><p class="manual-feature-body">Pilih bahasa tampilan dan negara/wilayah tempat tinggal Anda saat ini.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bahasa</h3><p class="manual-feature-body">Pilih bahasa yang akan digunakan di aplikasi.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Negara/wilayah saat ini</h3><p class="manual-feature-body">Format tanggal, angka, dan mata uang diatur berdasarkan negara/wilayah yang dipilih.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mata uang</h3><p class="manual-feature-body">Ubah tampilan jumlah sesuai mata uang yang digunakan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengaturan Format Waktu</h3><p class="manual-feature-body">Pilih bagaimana tanggal dan waktu ditampilkan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengaturan Tema</h3><p class="manual-feature-body">Pilih tampilan terang atau gelap sesuai cahaya di sekitar.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Info Saya</h3><p class="manual-feature-body">Kelola default pekerja dan gaji yang dapat digunakan kembali.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengaturan Kamera</h3><p class="manual-feature-body">Atur pemotretan, pencatatan lokasi, dan tampilan informasi sesuai kebutuhan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto Check-In</h3><p class="manual-feature-body">Wajibkan pengambilan kamera sebelum check-in dimulai.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto Check-Out</h3><p class="manual-feature-body">Memerlukan pengambilan kamera sebelum absen pulang disimpan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengeditan Gambar</h3><p class="manual-feature-body">Izinkan pengeditan detail foto dan penyimpanan gambar yang diedit.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Berbagi Foto</h3><p class="manual-feature-body">Bagikan foto dari detail foto dan pilihan galeri.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lampirkan foto ke laporan</h3><p class="manual-feature-body">Lampirkan foto galeri yang diambil pada tanggal laporan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Getaran saat memotret</h3><p class="manual-feature-body">Getaran memberi tahu apakah pengambilan foto berhasil atau gagal.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Suara rana saat memotret</h3><p class="manual-feature-body">Suara rana diputar saat mengambil foto. Suara tidak dapat dimatikan, tetapi volumenya dapat diatur dari 1 hingga 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Simpan Salinan Terkompresi</h3><p class="manual-feature-body">Simpan salinan editan terkompresi sambil menyimpan aslinya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengaturan Galeri</h3><p class="manual-feature-body">Pilih ukuran gambar mini untuk melihat lebih banyak foto sekaligus atau melihatnya lebih jelas.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Izin</h3><p class="manual-feature-body">Periksa status izin yang diperlukan untuk fitur TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Perlindungan Rekam</h3><p class="manual-feature-body">Pelajari aturan pencatatan sumber foto, informasi pemotretan, dan riwayat penyuntingan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cadangan</h3><p class="manual-feature-body">Simpan salinan terpisah catatan kerja, foto, dan pengaturan, lalu periksa penyelesaiannya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cadangkan ke perangkat ini</h3><p class="manual-feature-body">Simpan cadangan di penyimpanan internal perangkat ini.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cadangkan ke kartu SD atau USB</h3><p class="manual-feature-body">Simpan cadangan ke kartu SD atau perangkat penyimpanan USB yang terhubung.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Buat cadangan eksternal</h3><p class="manual-feature-body">Kirim salinan cadangan ke aplikasi lain. Periksa di aplikasi yang dipilih apakah penyimpanannya telah selesai.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cadangan Google Drive</h3><p class="manual-feature-body">Simpan cadangan ke Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kelola cadangan Google Drive</h3><p class="manual-feature-body">Tinjau cadangan berdasarkan tanggal dan hapus sendiri</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pulihkan dari Google Drive</h3><p class="manual-feature-body">Pilih dari daftar cadangan yang tersimpan di Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pulihkan</h3><p class="manual-feature-body">Pemulihan mengganti data aplikasi saat ini dengan cadangan, jadi cadangkan data saat ini terlebih dahulu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pemeriksaan &amp; Pemulihan Penyimpanan Galeri</h3><p class="manual-feature-body">Periksa berkas foto yang tidak terhubung ke catatan dan bersihkan setelah diperiksa.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Manajemen Data</h3><p class="manual-feature-body">Kelola penggunaan penyimpanan dan pengaturan ulang data.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pembersihan File Sementara</h3><p class="manual-feature-body">Hapus file sementara yang tidak diperlukan untuk mengosongkan ruang penyimpanan.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Sampah</h3><p class="manual-feature-body">Anda dapat memulihkannya dari Sampah selama 30 hari.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Setel Ulang Semua Data</h3><p class="manual-feature-body">Hapus semua catatan dan foto di perangkat ini; cadangkan data terlebih dahulu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pengaturan Pemberitahuan</h3><p class="manual-feature-body">Digunakan untuk menerima notifikasi penting dari aplikasi.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Getaran</h3><p class="manual-feature-body">Gunakan getaran untuk interaksi aplikasi.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Penggunaan Data</h3><p class="manual-feature-body">Pilih apakah unggahan cadangan hanya menggunakan Wi-Fi atau juga data seluler.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Panduan Pengguna</h3><p class="manual-feature-body">Pelajari penggunaan aplikasi melalui layar fitur dan penjelasan ikon.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dukungan</h3><p class="manual-feature-body">Kirim pertanyaan, laporan masalah, dan saran fitur melalui email.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Kebijakan Privasi</h3><p class="manual-feature-body">Tinjau pengumpulan data dan detail penanganannya.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tentang</h3><p class="manual-feature-body">Lihat versi aplikasi, ketentuan penggunaan, dan lisensi sumber terbuka.</p></div></article></section></details><details class="manual-nojs-locale" lang="vi" dir="ltr"><summary>Tiếng Việt</summary><section><h2>1. Trang chủ</h2><p><a class="manual-nojs-original" href="images/vi/guide-main.webp?v=85fbe237c430" target="_blank" rel="noopener">Xem bản gốc (thẻ mới): Trang chủ</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Nơi làm việc mới</h3><p class="manual-feature-body">Đăng ký nơi làm việc để liên kết chấm công, quyết toán và báo cáo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Điền địa chỉ từ vị trí GPS hiện tại</h3><p class="manual-feature-body">Điền địa chỉ nơi làm việc từ vị trí hiện tại. Kiểm tra địa chỉ thực tế và sửa nếu cần.</p><p class="manual-feature-notice">Địa chỉ GPS có thể khác địa chỉ nơi làm việc thực tế. Hãy kiểm tra địa chỉ trước khi lưu.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thay đổi nơi làm việc</h3><p class="manual-feature-body">Đăng ký nhiều nơi làm việc và chọn nơi cần dùng.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nơi làm việc · Chỉnh sửa</h3><p class="manual-feature-body">Sửa thông tin và mức tiền công mặc định của nơi làm việc đã đăng ký.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vào ca · Kết thúc ca</h3><p class="manual-feature-body">Ghi giờ vào và ra để tự động tính thời gian làm việc cho quyết toán và báo cáo.</p><p class="manual-feature-notice">Lưu ý: Không thể sửa thời gian làm việc đã tính trong quyết toán hoặc bản xem trước PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Giờ nghỉ</h3><p class="manual-feature-body">Thời gian nghỉ được tính vào thời gian làm việc thực tế và tiền công.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tính lương</h3><p class="manual-feature-body">Tiền công tự động tính theo đơn giá giờ hoặc ngày; chọn trả theo tuần, tháng hoặc kỳ khác.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Thu nhập · Phụ cấp</h3><p class="manual-feature-body">Kiểm tra đơn giá và phụ cấp trong bản ghi công việc rồi sửa số tiền cần thiết.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bản ghi nhớ công việc</h3><p class="manual-feature-body">Lưu tình hình hiện trường và nội dung công việc cùng bản ghi làm việc.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chụp ảnh</h3><p class="manual-feature-body">Chụp lại hiện trường và xem kết quả trong thư viện.</p></div></article></section><section><h2>2. Thư viện ảnh</h2><p><a class="manual-nojs-original" href="images/vi/guide-gallery.webp?v=ef7f6afc666b" target="_blank" rel="noopener">Xem bản gốc (thẻ mới): Thư viện ảnh</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Thư viện ảnh</h3><p class="manual-feature-body">Xem, chỉnh sửa hoặc chia sẻ ảnh đã chụp.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tìm kiếm</h3><p class="manual-feature-body">Tìm ảnh theo nơi làm việc, khoảng thời gian và phân loại.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Nơi làm việc</h3><p class="manual-feature-body">Xem cùng nhau các ảnh liên kết với nơi làm việc đã chọn.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tất cả</h3><p class="manual-feature-body">Xóa bộ lọc tìm kiếm và nơi làm việc để xem tất cả ảnh.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>hàng ngày</h3><p class="manual-feature-body">Duyệt ảnh theo ngày chụp và mở ngày cần xem.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Chọn</h3><p class="manual-feature-body">Chọn nhiều ảnh để chia sẻ hoặc xóa cùng lúc.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ảnh</h3><p class="manual-feature-body">Mở ảnh và dùng hai ngón tay phóng to để xem chi tiết.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Trình chỉnh sửa ảnh</h3><p class="manual-feature-body">Thêm dấu và chữ lên ảnh rồi khôi phục ảnh gốc khi cần.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mũi tên</h3><p class="manual-feature-body">Đánh dấu phần quan trọng trong ảnh.</p></div
