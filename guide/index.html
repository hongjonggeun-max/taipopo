js-original" href="images/ar/guide-report.webp?v=3529e609f58d" target="_blank" rel="noopener">عرض الأصل (علامة تبويب جديدة): تقرير</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>تقرير</h3><p class="manual-feature-body">نظّم سجلات العمل والصور المرفقة في ملف PDF وشاركه.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>يوميا · أسبوعيا · شهريا · بحث</h3><p class="manual-feature-body">اختر تاريخًا أو فترة لإظهار السجلات المطابقة؛ تنطبق أيضًا مرشحات مكان العمل والبحث.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>معاينة PDF · تحرير</h3><p class="manual-feature-body">عدّل الحقول المتاحة والصور المرفقة قبل الحفظ بصيغة PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>المرفقات</h3><p class="manual-feature-body">أضف صورًا من المعرض إلى المستند ورتّب مرفقاته.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · حفظ</h3><p class="manual-feature-body">إنشاء ملف PDF من المستند الحالي؛ استخدم شارك للاحتفاظ بنسخة خارجية.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>شارك</h3><p class="manual-feature-body">أنشئ ملف PDF الحالي واختر تنسيق المشاركة وتطبيق المستلم.</p></div></article></section><section><h2>5. الكاميرا</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>مسح رمز الاستجابة السريعة</h3><p class="manual-feature-body">افتح صفحات الويب من رموز QR أو انسخ النص العادي.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الفلاش</h3><p class="manual-feature-body">استخدم الفلاش لإظهار الهدف في الأماكن المظلمة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>سجل موقع GPS</h3><p class="manual-feature-body">عند إيقاف «سجل موقع GPS»، لا تُحفَظ الإحداثيات في سجل الصورة داخل التطبيق. «إظهار العنوان» إعداد مستقل. عند تفعيله والسماح للتطبيق بالوصول إلى الموقع، يمكن تحديد العنوان من موقعك الحالي وعرضه وحفظه في سجل الصورة عند التقاطها. تُحفَظ بيانات EXIF الموجودة في ملف JPEG الأصلي كما هي.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الموقع</h3><p class="manual-feature-body">حدّد موقعك الحالي مجددًا لتحديث معلومات مكان التصوير.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>معلومات التراكب</h3><p class="manual-feature-body">اختر ما إذا كنت تريد تضمين معلومات التصوير على الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>معلومات التصوير</h3><p class="manual-feature-body">اختر مكان العمل والموقع والملاحظات وطريقة عرض المعلومات على الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>العودة</h3><p class="manual-feature-body">أغلق الكاميرا وارجع إلى الشاشة السابقة؛ تبقى الصور المحفوظة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مكان العمل</h3><p class="manual-feature-body">اعرض اسم مكان العمل الحالي في تراكب الكاميرا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>نظام تحديد المواقع</h3><p class="manual-feature-body">احتفظ بإحداثيات دقيقة لمكان التصوير.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مذكرة</h3><p class="manual-feature-body">دوّن حالة الموقع أو الملاحظات اللازمة على الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>العنوان</h3><p class="manual-feature-body">عرض عنوان GPS في تراكب الكاميرا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>التاريخ</h3><p class="manual-feature-body">احتفظ بتاريخ التصوير ووقته على الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>لون النص</h3><p class="manual-feature-body">اضبط معلومات التصوير لتظهر بوضوح على خلفية الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>عتامة النص · ظل سهولة القراءة</h3><p class="manual-feature-body">اضبط العتامة وقوة الظل ليبقى النص مقروءًا فوق خلفية الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تحريك بطاقة المعلومات</h3><p class="manual-feature-body">اسحب بطاقة معلومات التصوير إلى موضع لا يحجب الصورة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>السطوع</h3><p class="manual-feature-body">اضبط التعريض لإظهار تفاصيل الموقع بوضوح أكبر.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تكبير الكاميرا</h3><p class="manual-feature-body">اضبط تكبير التصوير ليظهر الموضوع بالحجم المطلوب.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الشبكة</h3><p class="manual-feature-body">تساعد الشبكة على ضبط الأفق وتكوين اللقطة أثناء التصوير.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تبديل الكاميرا</h3><p class="manual-feature-body">بدّل بين الكاميرا الأمامية والخلفية للتصوير في الاتجاه المطلوب.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>التقط صورة</h3><p class="manual-feature-body">وثّق الموقع بالصور وراجعها في المعرض.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>التحقّق من صورة حديثة</h3><p class="manual-feature-body">افتح الصور الحديثة للتحقق من نتيجة التصوير فورًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>التصوير الأفقي في الاتجاهين</h3><p class="manual-feature-body">أدِر الجهاز أفقيًا لالتقاط منظر أوسع للموقع.</p></div></article></section><section><h2>6. الإعدادات</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>اللغة والمنطقة</h3><p class="manual-feature-body">اختر لغة العرض وبلدك/منطقتك الحالية.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>اللغة</h3><p class="manual-feature-body">اختر اللغة المستخدمة في التطبيق.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>البلد/المنطقة الحالية</h3><p class="manual-feature-body">يتم ضبط تنسيقات التاريخ والأرقام والعملة بناءً على البلد/المنطقة المحددة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>العملة</h3><p class="manual-feature-body">غيّر عرض المبالغ بما يتوافق مع العملة التي تستخدمها.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعدادات تنسيق الوقت</h3><p class="manual-feature-body">اختر كيفية عرض التواريخ والأوقات.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعدادات المظهر</h3><p class="manual-feature-body">اختر مظهرًا فاتحًا أو داكنًا يناسب الإضاءة المحيطة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>معلوماتي</h3><p class="manual-feature-body">إدارة بيانات العامل والأجر الافتراضية القابلة لإعادة الاستخدام.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعدادات الكاميرا</h3><p class="manual-feature-body">اضبط التصوير وتسجيل الموقع وعرض المعلومات بما يناسب احتياجاتك.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>صورة تسجيل الحضور</h3><p class="manual-feature-body">يجب التقاط صورة قبل تسجيل الحضور.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>صورة تسجيل الانصراف</h3><p class="manual-feature-body">يجب التقاط صورة قبل حفظ تسجيل الانصراف.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تحرير الصور</h3><p class="manual-feature-body">السماح بتحرير تفاصيل الصور وتخزين الصور المعدلة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>مشاركة الصور</h3><p class="manual-feature-body">مشاركة الصور من تفاصيل الصورة واختيار المعرض.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إرفاق صور بالتقرير</h3><p class="manual-feature-body">قم بإرفاق صور المعرض التي تم التقاطها في تاريخ التقرير.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الاهتزاز عند التصوير</h3><p class="manual-feature-body">ينبّهك الاهتزاز إلى نجاح التقاط الصورة أو فشله.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>صوت الغالق عند التصوير</h3><p class="manual-feature-body">يصدر صوت الغالق عند التقاط صورة. لا يمكن إيقافه، لكن يمكن ضبط مستواه من 1 إلى 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حفظ نسخة مضغوطة</h3><p class="manual-feature-body">تخزين نسخة مضغوطة معدلة مع الاحتفاظ بالأصل.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعدادات المعرض</h3><p class="manual-feature-body">اختر حجم الصور المصغرة لعرض صور أكثر معًا أو رؤيتها بوضوح أكبر.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الأذونات</h3><p class="manual-feature-body">تحقق من حالة الإذن المطلوبة لميزات TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حماية السجلات</h3><p class="manual-feature-body">اطّلع على قواعد تسجيل مصادر الصور ومعلومات التصوير وسجل التعديلات.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>النسخ الاحتياطي</h3><p class="manual-feature-body">احتفظ بنسخة منفصلة من سجلات العمل والصور والإعدادات وتحقّق من اكتمالها.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>نسخ احتياطي إلى هذا الجهاز</h3><p class="manual-feature-body">احفظ النسخة الاحتياطية في وحدة التخزين الداخلية لهذا الجهاز.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>نسخ احتياطي إلى بطاقة SD أو USB</h3><p class="manual-feature-body">احفظ النسخة الاحتياطية على بطاقة SD أو جهاز تخزين USB متصل.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إنشاء نسخة احتياطية خارجية</h3><p class="manual-feature-body">أرسل نسخة من النسخة الاحتياطية إلى تطبيق آخر. تحقّق من اكتمال الحفظ في التطبيق الذي تختاره.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>نسخ احتياطي إلى Google Drive</h3><p class="manual-feature-body">احفظ النسخ الاحتياطية في Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إدارة نسخ Google Drive الاحتياطية</h3><p class="manual-feature-body">راجع النسخ المؤرخة واحذفها بنفسك</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>استعادة من Google Drive</h3><p class="manual-feature-body">اختر من قائمة النسخ الاحتياطية المحفوظة في Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>استعادة</h3><p class="manual-feature-body">تستبدل الاستعادة بيانات التطبيق الحالية بالنسخة الاحتياطية، لذا انسخ البيانات الحالية أولًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>فحص واسترداد تخزين المعرض</h3><p class="manual-feature-body">افحص ملفات الصور غير المرتبطة بسجلات ونظفها بعد التحقق.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إدارة البيانات</h3><p class="manual-feature-body">إدارة استخدام التخزين وإعادة تعيين البيانات.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>تنظيف الملفات المؤقتة</h3><p class="manual-feature-body">احذف الملفات المؤقتة غير الضرورية لتوفير مساحة تخزين.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>سلة المهملات</h3><p class="manual-feature-body">ويمكنك استعادتها من سلة المهملات لمدة 30 يومًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعادة ضبط جميع البيانات</h3><p class="manual-feature-body">يحذف جميع السجلات والصور المحفوظة على هذا الجهاز؛ انسخ بياناتك احتياطيًا أولًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>إعدادات الإخطار</h3><p class="manual-feature-body">يُستخدم لتلقي إشعارات التطبيق المهمة.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الاهتزاز</h3><p class="manual-feature-body">استخدم الاهتزاز لتفاعلات التطبيق.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>استخدام البيانات</h3><p class="manual-feature-body">اختر رفع النسخ الاحتياطية عبر Wi-Fi فقط أو عبر بيانات الهاتف أيضًا.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>دليل المستخدم</h3><p class="manual-feature-body">تعرّف على استخدام التطبيق من خلال شاشات الوظائف وشروح الأيقونات.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>الدعم</h3><p class="manual-feature-body">أرسل الأسئلة وتقارير الأخطاء واقتراحات الوظائف عبر البريد الإلكتروني.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>سياسة الخصوصية</h3><p class="manual-feature-body">مراجعة تفاصيل جمع البيانات والتعامل معها.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>حول</h3><p class="manual-feature-body">اطّلع على إصدار التطبيق وشروط الاستخدام وتراخيص المصادر المفتوحة.</p></div></article></section></details><details class="manual-nojs-locale" lang="it" dir="ltr"><summary>Italiano</summary><section><h2>1. Inizio</h2><p><a class="manual-nojs-original" href="images/it/guide-main.webp?v=cf9cc78c02e5" target="_blank" rel="noopener">Apri originale (nuova scheda): Inizio</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Nuovo posto di lavoro</h3><p class="manual-feature-body">Registra un luogo di lavoro per collegare presenze, conteggi e report.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Usa la posizione GPS attuale per l’indirizzo</h3><p class="manual-feature-body">Compila l’indirizzo del luogo di lavoro dalla posizione attuale. Verifica quello effettivo e correggilo se necessario.</p><p class="manual-feature-notice">L’indirizzo GPS può essere diverso da quello effettivo del luogo di lavoro. Verificalo prima di salvare.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cambia posto di lavoro</h3><p class="manual-feature-body">Registra più luoghi di lavoro e scegli quello che ti serve.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Luogo di lavoro · Modifica</h3><p class="manual-feature-body">Modifica i dettagli e le impostazioni retributive predefinite del luogo di lavoro.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Entrata · Uscita</h3><p class="manual-feature-body">Registrando entrata e uscita, le ore vengono calcolate automaticamente per conteggi e report.</p><p class="manual-feature-notice">Nota: Le ore calcolate non sono modificabili nei conteggi o nell’anteprima PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pausa</h3><p class="manual-feature-body">Le pause vengono considerate nel calcolo delle ore effettive e della retribuzione.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Calcolo salariale</h3><p class="manual-feature-body">La paga si calcola automaticamente dalla tariffa oraria o giornaliera; scegli un pagamento settimanale, mensile o altro.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Reddito · Indennità</h3><p class="manual-feature-body">Controlla tariffa e indennità di un registro e modifica gli importi necessari.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Promemoria di lavoro</h3><p class="manual-feature-body">Conserva note sul luogo e dettagli dell’attività insieme ai registri di lavoro.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Scatta foto</h3><p class="manual-feature-body">Documenta il luogo con foto e controllale nella galleria.</p></div></article></section><section><h2>2. Galleria</h2><p><a class="manual-nojs-original" href="images/it/guide-gallery.webp?v=8413f1ad68cf" target="_blank" rel="noopener">Apri originale (nuova scheda): Galleria</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Galleria</h3><p class="manual-feature-body">Visualizza, modifica e condividi le foto scattate.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cerca</h3><p class="manual-feature-body">Trova le foto per luogo di lavoro, periodo e categoria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Luogo di lavoro</h3><p class="manual-feature-body">Visualizza insieme le foto collegate al luogo di lavoro selezionato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Tutto</h3><p class="manual-feature-body">Rimuovi i filtri di ricerca e luogo di lavoro per vedere tutte le foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ogni giorno</h3><p class="manual-feature-body">Sfoglia le foto per data di scatto e apri il giorno desiderato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Seleziona</h3><p class="manual-feature-body">Seleziona più foto per condividerle o eliminarle insieme.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto</h3><p class="manual-feature-body">Apri una foto e ingrandiscila con due dita per vedere i dettagli.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Editor di foto</h3><p class="manual-feature-body">Aggiungi segni e testo alle foto e ripristina l’originale quando serve.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Freccia</h3><p class="manual-feature-body">Evidenzia le parti importanti di una foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Evidenziazione del cerchio</h3><p class="manual-feature-body">Cerchia la parte della foto che vuoi evidenziare.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Scatola rettangolare</h3><p class="manual-feature-body">Racchiudi in un rettangolo l’area su cui richiamare l’attenzione.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaico</h3><p class="manual-feature-body">Applica il mosaico alle zone da nascondere nella foto da condividere.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Aggiungi testo</h3><p class="manual-feature-body">Aggiungi spiegazioni o note utili alla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Allineamento del testo</h3><p class="manual-feature-body">Allinea il testo a sinistra, al centro o a destra nel riquadro per facilitarne la lettura.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Dimensione del testo</h3><p class="manual-feature-body">Regola la dimensione del testo aggiunto per renderlo leggibile sulla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Testo in grassetto</h3><p class="manual-feature-body">Rendi più marcato il testo importante per farlo risaltare.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Colore</h3><p class="manual-feature-body">Scegli colori di testo e forme che si distinguano dallo sfondo della foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacità</h3><p class="manual-feature-body">Regola quanto testo e forme coprono la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ruota</h3><p class="manual-feature-body">Ruota la foto di 90 gradi alla volta per visualizzarla nell’orientamento desiderato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Annulla</h3><p class="manual-feature-body">Annulla l’ultimo testo, forma o altro segno aggiunto alla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ripristina</h3><p class="manual-feature-body">Ripristina il testo, la forma o altro segno annullato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Elimina l'oggetto selezionato</h3><p class="manual-feature-body">Rimuovi soltanto il testo o la forma selezionati sulla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salva</h3><p class="manual-feature-body">La versione modificata appare nei dettagli della foto. Lo scatto originale viene conservato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ripristina originale</h3><p class="manual-feature-body">Rimuovi le modifiche e torna alla foto originale conservata.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Condividi</h3><p class="manual-feature-body">Condividi in un’altra app una copia con le modifiche attuali.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Elimina</h3><p class="manual-feature-body">Quando elimini una foto, verifica l’ambito per galleria e documenti collegati.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Allegati · Più recenti prima · Più vecchie prima</h3><p class="manual-feature-body">Quando alleghi foto, ordinale dalle più recenti o dalle più vecchie per trovare quelle necessarie.</p></div></article></section><section><h2>3. Conteggio retributivo</h2><p><a class="manual-nojs-original" href="images/it/guide-settlement.webp?v=a7c51f6d508b" target="_blank" rel="noopener">Apri originale (nuova scheda): Conteggio retributivo</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Conteggio retributivo</h3><p class="manual-feature-body">Gli importi vengono calcolati automaticamente dai registri di lavoro e dalle impostazioni retributive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ogni giorno · Settimanale · Mensile</h3><p class="manual-feature-body">Scegli una data o un periodo per mostrare i record corrispondenti; si applicano anche i filtri sul posto di lavoro e di ricerca.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cerca</h3><p class="manual-feature-body">Cerca i conteggi per periodo, luogo di lavoro e altri criteri.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Modifica</h3><p class="manual-feature-body">Riapri i conteggi salvati per modificare tariffe, indennità e richieste.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Richiesta</h3><p class="manual-feature-body">Gestisci gli importi da richiedere separatamente e lo stato di richiesta e ricezione.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Allegati</h3><p class="manual-feature-body">Aggiungi foto dalla galleria al documento e organizzane l’ordine.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anteprima PDF · Modifica</h3><p class="manual-feature-body">Modifica i campi disponibili e le foto allegate prima di salvare in PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salva</h3><p class="manual-feature-body">Salva nel rendiconto salva le modifiche al documento. Per creare un PDF, tocca Condividi, quindi salvalo o invialo separatamente nell’app di destinazione.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Condividi</h3><p class="manual-feature-body">La condivisione del rendiconto include il PDF e le foto allegate. Controlla il numero e il contenuto dei file prima di scegliere l’app di destinazione.</p></div></article></section><section><h2>4. Rapporto</h2><p><a class="manual-nojs-original" href="images/it/guide-report.webp?v=c4416606986f" target="_blank" rel="noopener">Apri originale (nuova scheda): Rapporto</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Rapporto</h3><p class="manual-feature-body">Raccogli registri di lavoro e foto allegate in un PDF da condividere.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ogni giorno · Settimanale · Mensile · Cerca</h3><p class="manual-feature-body">Scegli una data o un periodo per mostrare i record corrispondenti; si applicano anche i filtri sul posto di lavoro e di ricerca.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Anteprima PDF · Modifica</h3><p class="manual-feature-body">Modifica i campi disponibili e le foto allegate prima di salvare in PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Allegati</h3><p class="manual-feature-body">Aggiungi foto dalla galleria al documento e organizzane l’ordine.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Salva</h3><p class="manual-feature-body">Genera un PDF dal documento corrente; utilizzare Condividi per conservare una copia esterna.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Condividi</h3><p class="manual-feature-body">Genera il PDF corrente e scegli un formato di condivisione e un'app di destinazione.</p></div></article></section><section><h2>5. Fotocamera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Scansiona il codice QR</h3><p class="manual-feature-body">Apri pagine web dai codici QR o copia testo semplice.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flash</h3><p class="manual-feature-body">Usa il flash per rendere visibili i soggetti in luoghi bui.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Registrazione della posizione GPS</h3><p class="manual-feature-body">Con «Registrazione della posizione GPS» disattivata, l’app non salva le coordinate nella scheda della foto. «Mostra indirizzo» è un’impostazione separata. Se l’impostazione è attiva e l’accesso alla posizione è autorizzato, l’app può trovare e mostrare l’indirizzo della posizione attuale e salvarlo nella scheda della foto al momento dello scatto. I dati EXIF del JPEG originale vengono conservati senza modifiche.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Posizione</h3><p class="manual-feature-body">Rileva di nuovo la posizione attuale per aggiornare le informazioni di scatto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informazioni sovrapposte</h3><p class="manual-feature-body">Scegli se includere le informazioni di scatto nella foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informazioni di scatto</h3><p class="manual-feature-body">Scegli luogo di lavoro, posizione, note e stile delle informazioni da mostrare sulla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Indietro</h3><p class="manual-feature-body">Chiudi la fotocamera e torna alla schermata precedente; le foto salvate rimangono.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Luogo di lavoro</h3><p class="manual-feature-body">Visualizza il nome del posto di lavoro corrente nella sovrapposizione della fotocamera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Conserva le coordinate precise del luogo di scatto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Promemoria</h3><p class="manual-feature-body">Registra sulla foto le condizioni del luogo o le note utili.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Indirizzo</h3><p class="manual-feature-body">Visualizza l'indirizzo GPS nella sovrapposizione della fotocamera.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Data</h3><p class="manual-feature-body">Conserva data e ora di scatto sulla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Colore del testo</h3><p class="manual-feature-body">Rendi leggibili le informazioni di scatto sullo sfondo della foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacità del testo · Ombra di leggibilità</h3><p class="manual-feature-body">Regola opacità e intensità dell’ombra per mantenere leggibile il testo sulla foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Spostare la scheda informativa</h3><p class="manual-feature-body">Trascina la scheda delle informazioni per non coprire la foto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Luminosità</h3><p class="manual-feature-body">Regola l’esposizione per riprendere meglio i dettagli del luogo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Zoom della fotocamera</h3><p class="manual-feature-body">Regola lo zoom di scatto affinché il soggetto appaia della dimensione desiderata.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Griglia</h3><p class="manual-feature-body">La griglia aiuta ad allineare l’orizzonte e a comporre lo scatto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cambia fotocamera</h3><p class="manual-feature-body">Passa dalla fotocamera anteriore a quella posteriore per scattare nella direzione desiderata.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Scatta foto</h3><p class="manual-feature-body">Documenta il luogo con foto e controllale nella galleria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Controllare una foto recente</h3><p class="manual-feature-body">Apri le foto recenti per controllare subito il risultato degli scatti.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto orizzontali in entrambe le direzioni</h3><p class="manual-feature-body">Ruota il dispositivo per riprendere una vista più ampia del luogo.</p></div></article></section><section><h2>6. Impostazioni</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Lingua e regione</h3><p class="manual-feature-body">Scegli la lingua di visualizzazione e il tuo paese/la tua regione attuale.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Lingua</h3><p class="manual-feature-body">Scegli la lingua da usare nell’app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Paese/regione attuale</h3><p class="manual-feature-body">I formati di data, numeri e valuta vengono impostati in base al paese/alla regione selezionati.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Valuta</h3><p class="manual-feature-body">Adatta la visualizzazione degli importi alla tua valuta.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Impostazioni del formato dell'ora</h3><p class="manual-feature-body">Scegli come vengono visualizzate le date e gli orari.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Impostazioni del tema</h3><p class="manual-feature-body">Scegli un aspetto chiaro o scuro in base alla luce circostante.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Le mie info</h3><p class="manual-feature-body">Gestisci valori predefiniti riutilizzabili per lavoratore e paga.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Impostazioni della fotocamera</h3><p class="manual-feature-body">Imposta scatto, registrazione della posizione e visualizzazione delle informazioni secondo le tue esigenze.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto del check-in</h3><p class="manual-feature-body">Richiedi l'acquisizione della fotocamera prima dell'inizio del check-in.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Foto del check-out</h3><p class="manual-feature-body">Richiedi l'acquisizione della fotocamera prima che il check-out venga salvato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Modifica delle immagini</h3><p class="manual-feature-body">Consenti la modifica dei dettagli delle foto e l'archiviazione delle immagini modificate.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Condivisione di foto</h3><p class="manual-feature-body">Condividi le foto dai dettagli delle foto e dalla selezione della galleria.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Allega foto al rapporto</h3><p class="manual-feature-body">Allega le foto della galleria scattate alla data del rapporto.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibrazione allo scatto</h3><p class="manual-feature-body">Utilizza il feedback tramite vibrazione per il successo e il fallimento dell'acquisizione.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Suono dell’otturatore</h3><p class="manual-feature-body">Quando scatti una foto viene riprodotto il suono dell’otturatore. Non si può disattivare, ma il volume è regolabile da 1 a 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Salva copia compressa</h3><p class="manual-feature-body">Archivia una copia modificata compressa mantenendo l'originale.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Impostazioni della Galleria</h3><p class="manual-feature-body">Scegli la dimensione delle miniature per vedere più foto insieme o osservarle meglio.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Autorizzazioni</h3><p class="manual-feature-body">Controlla lo stato delle autorizzazioni richieste per le funzionalità TAIPOPO.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Protezione della registrazione</h3><p class="manual-feature-body">Consulta le regole di registrazione delle fonti delle foto, delle informazioni di scatto e della cronologia delle modifiche.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup</h3><p class="manual-feature-body">Conserva una copia separata di registri, foto e impostazioni e verifica il completamento.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Esegui backup su questo dispositivo</h3><p class="manual-feature-body">Salva il backup nella memoria interna di questo dispositivo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup su scheda SD o USB</h3><p class="manual-feature-body">Salva il backup su una scheda SD o dispositivo USB collegato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Crea backup esterno</h3><p class="manual-feature-body">Invia una copia del backup a un’altra app. Verifica nell’app scelta che il salvataggio sia completato.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup Google Drive</h3><p class="manual-feature-body">Salva i backup su Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gestisci i backup di Google Drive</h3><p class="manual-feature-body">Esamina i backup per data ed eliminali direttamente</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ripristina da Google Drive</h3><p class="manual-feature-body">Scegli dall’elenco dei backup salvati in Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Ripristina</h3><p class="manual-feature-body">Il ripristino sostituisce i dati attuali con il backup, quindi salva prima anche i dati attuali.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Controllo e ripristino dell'archiviazione della galleria</h3><p class="manual-feature-body">Controlla i file fotografici non collegati ad alcun record e puliscili dopo la verifica.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gestione dei dati</h3><p class="manual-feature-body">Controlla lo spazio di archiviazione e gestisci l’azzeramento dei dati.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Pulizia dei file temporanei</h3><p class="manual-feature-body">Libera spazio di archiviazione eliminando i file temporanei non necessari.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Cestino</h3><p class="manual-feature-body">Puoi ripristinarli dal Cestino per 30 giorni.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Reimposta tutti i dati</h3><p class="manual-feature-body">Elimina tutti i registri e le foto sul dispositivo; esegui prima un backup.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Impostazioni di notifica</h3><p class="manual-feature-body">Utilizzata per ricevere notifiche importanti dall’app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibrazione</h3><p class="manual-feature-body">Utilizza la vibrazione per le interazioni con le app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Utilizzo dei dati</h3><p class="manual-feature-body">Scegli se caricare i backup solo tramite Wi-Fi o anche con i dati mobili.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Guida utente</h3><p class="manual-feature-body">Scopri come usare le funzioni tramite schermate e spiegazioni delle icone.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Supporto</h3><p class="manual-feature-body">Invia domande, segnalazioni di errori e suggerimenti di funzioni via email.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informativa sulla privacy</h3><p class="manual-feature-body">Esaminare i dettagli sulla raccolta e sulla gestione dei dati.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Informazioni sull’app</h3><p class="manual-feature-body">Controlla la versione dell’app, le condizioni d’uso e le licenze open source.</p></div></article></section></details><details class="manual-nojs-locale" lang="th" dir="ltr"><summary>ไทย</summary><section><h2>1. หน้าหลัก</h2><p><a class="manual-nojs-original" href="images/th/guide-main.webp?v=c6361228c8f3" target="_blank" rel="noopener">ดูต้นฉบับ (แท็บใหม่): หน้าหลัก</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>สถานที่ทำงานใหม่</h3><p class="manual-feature-body">ลงทะเบียนสถานที่ทำงานเพื่อเชื่อมโยงบันทึกเข้าออกงาน สรุปค่าจ้าง และรายงาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>กรอกที่อยู่จากตำแหน่ง GPS ปัจจุบัน</h3><p class="manual-feature-body">กรอกที่อยู่สถานที่ทำงานจากตำแหน่งปัจจุบัน ตรวจสอบที่อยู่จริงและแก้ไขตามต้องการ</p><p class="manual-feature-notice">ที่อยู่จาก GPS อาจต่างจากที่อยู่สถานที่ทำงานจริง โปรดตรวจสอบที่อยู่จริงก่อนบันทึก</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เปลี่ยนสถานที่ทำงาน</h3><p class="manual-feature-body">ลงทะเบียนหลายสถานที่ทำงานและเลือกใช้ได้ตามต้องการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สถานที่ทำงาน · แก้ไข</h3><p class="manual-feature-body">แก้ไขข้อมูลสถานที่ทำงานและค่าเริ่มต้นของค่าจ้าง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เข้างาน · ออกงาน</h3><p class="manual-feature-body">บันทึกเข้าออกงานเพื่อคำนวณเวลาทำงานและนำไปใช้ในสรุปค่าจ้างและรายงานโดยอัตโนมัติ</p><p class="manual-feature-notice">หมายเหตุ: ไม่สามารถแก้ไขเวลาทำงานที่คำนวณแล้วในหน้าสรุปค่าจ้างหรือหน้าตัวอย่าง PDF</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เวลาพัก</h3><p class="manual-feature-body">ตั้งเวลาพักเพื่อนำไปคำนวณเวลาทำงานจริงและค่าจ้าง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การคำนวณค่าจ้าง</h3><p class="manual-feature-body">คำนวณค่าจ้างอัตโนมัติจากอัตรารายชั่วโมงหรือรายวัน และเลือกรอบจ่ายรายสัปดาห์ รายเดือน หรือรอบอื่นได้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>รายได้ · เบี้ยเลี้ยง</h3><p class="manual-feature-body">ตรวจสอบอัตราค่าจ้างและเบี้ยเลี้ยงในบันทึกงาน และแก้ไขจำนวนเงินได้ตามต้องการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึกการทำงาน</h3><p class="manual-feature-body">จดสถานการณ์หน้างานและรายละเอียดงานไว้ดูร่วมกับบันทึกงาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ถ่ายภาพ</h3><p class="manual-feature-body">บันทึกหน้างานเป็นภาพและดูผลการถ่ายในแกลเลอรี</p></div></article></section><section><h2>2. แกลเลอรี่</h2><p><a class="manual-nojs-original" href="images/th/guide-gallery.webp?v=28df68ef7dd5" target="_blank" rel="noopener">ดูต้นฉบับ (แท็บใหม่): แกลเลอรี่</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>แกลเลอรี่</h3><p class="manual-feature-body">ดู แก้ไข หรือแชร์ภาพที่ถ่ายไว้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ค้นหา</h3><p class="manual-feature-body">ค้นหารูปที่ต้องการตามสถานที่ทำงาน ช่วงเวลา และหมวดหมู่</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สถานที่ทำงาน</h3><p class="manual-feature-body">ดูรูปภาพที่เชื่อมโยงกับสถานที่ทำงานที่เลือกไว้ด้วยกัน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ทั้งหมด</h3><p class="manual-feature-body">ล้างตัวกรองการค้นหาและสถานที่ทำงานเพื่อดูรูปภาพทั้งหมด</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>รายวัน</h3><p class="manual-feature-body">เรียกดูรูปภาพตามวันที่ถ่ายและเปิดวันที่ต้องการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เลือก</h3><p class="manual-feature-body">เลือกรูปหลายรูปเพื่อแชร์หรือลบพร้อมกัน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ภาพถ่าย</h3><p class="manual-feature-body">เปิดรูปและใช้สองนิ้วขยายเพื่อดูรายละเอียด</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>โปรแกรมแก้ไขรูปถ่าย</h3><p class="manual-feature-body">เพิ่มเครื่องหมายและข้อความในภาพที่ถ่าย และคืนค่าเป็นต้นฉบับได้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ลูกศร</h3><p class="manual-feature-body">เน้นส่วนสำคัญของภาพให้เห็นชัด</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ไฮไลท์วงกลม</h3><p class="manual-feature-body">วงกลมส่วนของรูปภาพที่ต้องการเน้น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>กล่องสี่เหลี่ยม</h3><p class="manual-feature-body">ใช้กรอบสี่เหลี่ยมล้อมบริเวณที่ต้องการให้สังเกต</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>โมเสก</h3><p class="manual-feature-body">ใส่โมเสกในส่วนที่ต้องการปิดบังของภาพที่จะแชร์</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เพิ่มข้อความ</h3><p class="manual-feature-body">เพิ่มคำอธิบายหรือบันทึกที่จำเป็นลงในรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การจัดตำแหน่งข้อความ</h3><p class="manual-feature-body">จัดข้อความชิดซ้าย กึ่งกลาง หรือชิดขวาภายในกล่องเพื่อให้อ่านง่าย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ขนาดข้อความ</h3><p class="manual-feature-body">ปรับขนาดข้อความที่เพิ่มให้เห็นชัดบนรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ข้อความตัวหนา</h3><p class="manual-feature-body">เพิ่มความหนาของข้อความสำคัญให้เด่นขึ้น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สี</h3><p class="manual-feature-body">เลือกสีข้อความและรูปร่างที่แยกจากพื้นหลังของรูปภาพได้ชัดเจน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ความทึบ</h3><p class="manual-feature-body">ปรับระดับที่ข้อความและรูปร่างบดบังรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>หมุน</h3><p class="manual-feature-body">หมุนรูปภาพครั้งละ 90 องศาเพื่อให้ดูในทิศทางที่เหมาะสม</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เลิกทำ</h3><p class="manual-feature-body">เลิกทำข้อความ รูปทรง หรือเครื่องหมายอื่นที่เพิ่มลงในรูปภาพล่าสุด</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ทำซ้ำ</h3><p class="manual-feature-body">ทำข้อความ รูปทรง หรือเครื่องหมายอื่นที่เลิกทำไปแล้วซ้ำอีกครั้ง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ลบวัตถุที่เลือก</h3><p class="manual-feature-body">ลบเฉพาะข้อความหรือรูปร่างที่เลือกจากสิ่งที่เพิ่มลงในรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึก</h3><p class="manual-feature-body">ภาพที่แก้ไขจะแสดงในหน้ารายละเอียดรูป โดยยังเก็บภาพต้นฉบับที่ถ่ายไว้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>คืนค่าต้นฉบับ</h3><p class="manual-feature-body">ลบการแก้ไขภาพและคืนค่าเป็นภาพต้นฉบับที่เก็บไว้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แบ่งปัน</h3><p class="manual-feature-body">แชร์สำเนาภาพที่รวมการแก้ไขล่าสุดไปยังแอปอื่น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ลบ</h3><p class="manual-feature-body">เมื่อลบภาพที่ไม่ต้องการ ให้ตรวจสอบขอบเขตที่ใช้กับแกลเลอรีและเอกสารที่เชื่อมโยง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ไฟล์แนบ · ใหม่ที่สุดก่อน · เก่าที่สุดก่อน</h3><p class="manual-feature-body">ขณะแนบรูปภาพ เรียงจากใหม่สุดหรือเก่าสุดเพื่อค้นหารูปที่ต้องการ</p></div></article></section><section><h2>3. สรุปค่าจ้าง</h2><p><a class="manual-nojs-original" href="images/th/guide-settlement.webp?v=f5592618f561" target="_blank" rel="noopener">ดูต้นฉบับ (แท็บใหม่): สรุปค่าจ้าง</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>สรุปค่าจ้าง</h3><p class="manual-feature-body">คำนวณยอดสรุปค่าจ้างอัตโนมัติตามบันทึกงานและการตั้งค่าจ้าง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>รายวัน · รายสัปดาห์ · รายเดือน</h3><p class="manual-feature-body">เลือกวันที่หรือช่วงเวลาที่จะแสดงบันทึกที่ตรงกัน ใช้ตัวกรองที่ทำงานและการค้นหาด้วย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ค้นหา</h3><p class="manual-feature-body">ค้นหารายการสรุปยอดตามช่วงเวลา สถานที่ทำงาน และเงื่อนไขอื่น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แก้ไข</h3><p class="manual-feature-body">เปิดรายการสรุปค่าจ้างที่บันทึกแล้วเพื่อแก้ไขอัตราค่าจ้าง เบี้ยเลี้ยง และยอดเรียกเก็บ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ขอเบิก</h3><p class="manual-feature-body">จัดการยอดเรียกเก็บแยกต่างหากและติดตามสถานะการเรียกเก็บและรับเงิน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ไฟล์แนบ</h3><p class="manual-feature-body">เลือกรูปจากแกลเลอรีเพื่อเพิ่มในเอกสารและจัดลำดับ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ดูตัวอย่าง PDF · แก้ไข</h3><p class="manual-feature-body">แก้ไขเนื้อหาที่อนุญาตและรูปที่แนบก่อนบันทึกเป็น PDF ได้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึก</h3><p class="manual-feature-body">ปุ่มบันทึกในหน้าสรุปยอดใช้บันทึกการเปลี่ยนแปลงเอกสาร หากต้องการสร้าง PDF ให้แตะแชร์ แล้วบันทึกหรือส่งแยกในแอปปลายทาง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แบ่งปัน</h3><p class="manual-feature-body">การแชร์สรุปยอดจะรวม PDF และรูปภาพที่แนบไว้ ตรวจสอบจำนวนไฟล์และเนื้อหาก่อนเลือกแอปปลายทาง</p></div></article></section><section><h2>4. รายงาน</h2><p><a class="manual-nojs-original" href="images/th/guide-report.webp?v=4b92a5ad2b31" target="_blank" rel="noopener">ดูต้นฉบับ (แท็บใหม่): รายงาน</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>รายงาน</h3><p class="manual-feature-body">จัดระเบียบบันทึกงานและรูปที่แนบเพื่อสร้างและแชร์ PDF</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>รายวัน · รายสัปดาห์ · รายเดือน · ค้นหา</h3><p class="manual-feature-body">เลือกวันที่หรือช่วงเวลาที่จะแสดงบันทึกที่ตรงกัน ใช้ตัวกรองที่ทำงานและการค้นหาด้วย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ดูตัวอย่าง PDF · แก้ไข</h3><p class="manual-feature-body">แก้ไขเนื้อหาที่อนุญาตและรูปที่แนบก่อนบันทึกเป็น PDF ได้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ไฟล์แนบ</h3><p class="manual-feature-body">เลือกรูปจากแกลเลอรีเพื่อเพิ่มในเอกสารและจัดลำดับ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · บันทึก</h3><p class="manual-feature-body">สร้าง PDF จากเอกสารปัจจุบัน ใช้ แบ่งปัน เพื่อเก็บสำเนาภายนอก</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แบ่งปัน</h3><p class="manual-feature-body">สร้าง PDF ปัจจุบันและเลือกรูปแบบการแชร์และแอปผู้รับ</p></div></article></section><section><h2>5. กล้อง</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>สแกนรหัส QR</h3><p class="manual-feature-body">เปิดหน้าเว็บจากรหัส QR หรือคัดลอกข้อความทั่วไป</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แฟลช</h3><p class="manual-feature-body">ใช้แฟลชเพื่อให้เห็นวัตถุชัดเจนในที่มืด</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึกตำแหน่ง GPS</h3><p class="manual-feature-body">เมื่อปิด “บันทึกตำแหน่ง GPS” แอปจะไม่บันทึกพิกัดลงในบันทึกข้อมูลรูปภาพของแอป “แสดงที่อยู่” เป็นการตั้งค่าแยกต่างหาก เมื่อเปิดการตั้งค่านี้และอนุญาตให้เข้าถึงตำแหน่ง แอปสามารถค้นหาและแสดงที่อยู่จากตำแหน่งปัจจุบัน และบันทึกที่อยู่ลงในบันทึกข้อมูลรูปภาพเมื่อถ่ายภาพได้ ข้อมูล EXIF ในไฟล์ JPEG ต้นฉบับจะคงเดิม</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ที่ตั้ง</h3><p class="manual-feature-body">ตรวจสอบตำแหน่งปัจจุบันอีกครั้งเพื่ออัปเดตข้อมูลสถานที่ถ่าย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ข้อมูลซ้อนทับ</h3><p class="manual-feature-body">เลือกว่าจะใส่ข้อมูลการถ่ายลงในรูปภาพหรือไม่</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ข้อมูลการถ่ายภาพ</h3><p class="manual-feature-body">เลือกสถานที่ทำงาน ตำแหน่ง บันทึก และรูปแบบข้อมูลที่จะแสดงบนรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>กลับ</h3><p class="manual-feature-body">ปิดกล้องและกลับสู่หน้าจอก่อนหน้า ภาพที่บันทึกไว้ยังคงอยู่</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สถานที่ทำงาน</h3><p class="manual-feature-body">แสดงชื่อสถานที่ทำงานปัจจุบันในการซ้อนทับของกล้อง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>จีพีเอส</h3><p class="manual-feature-body">บันทึกสถานที่ถ่ายเป็นพิกัดที่แม่นยำ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึก</h3><p class="manual-feature-body">บันทึกสภาพหน้างานหรือข้อมูลที่จำเป็นไว้บนภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ที่อยู่</h3><p class="manual-feature-body">แสดงที่อยู่ GPS ในการซ้อนทับของกล้อง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>วันที่</h3><p class="manual-feature-body">แสดงวันที่และเวลาที่ถ่ายไว้บนภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สีข้อความ</h3><p class="manual-feature-body">ปรับให้ข้อมูลการถ่ายอ่านง่ายบนพื้นหลังภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ความทึบของข้อความ · เงาช่วยให้อ่านง่าย</h3><p class="manual-feature-body">ปรับความทึบและความเข้มของเงาให้ข้อความอ่านได้บนพื้นหลังของรูปภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ย้ายการ์ดข้อมูล</h3><p class="manual-feature-body">ลากการ์ดข้อมูลการถ่ายไปยังตำแหน่งที่ไม่บังภาพ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ความสว่าง</h3><p class="manual-feature-body">ปรับความสว่างเพื่อเก็บรายละเอียดหน้างานให้ชัดขึ้น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ซูมกล้อง</h3><p class="manual-feature-body">ปรับระดับซูมขณะถ่ายให้วัตถุมีขนาดตามต้องการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>กริด</h3><p class="manual-feature-body">เส้นตารางช่วยจัดแนวระดับและองค์ประกอบภาพขณะถ่าย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สลับกล้อง</h3><p class="manual-feature-body">สลับกล้องหน้าและกล้องหลังเพื่อถ่ายในทิศทางที่ต้องการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ถ่ายภาพ</h3><p class="manual-feature-body">บันทึกหน้างานเป็นภาพและดูผลการถ่ายในแกลเลอรี</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ตรวจสอบรูปที่เพิ่งถ่าย</h3><p class="manual-feature-body">เปิดรูปภาพที่เพิ่งถ่ายเพื่อตรวจดูผลได้ทันที</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ถ่ายแนวนอนทั้งสองทิศทาง</h3><p class="manual-feature-body">หมุนอุปกรณ์เป็นแนวนอนเพื่อถ่ายพื้นที่หน้างานได้กว้างขึ้น</p></div></article></section><section><h2>6. การตั้งค่า</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>ภาษาและภูมิภาค</h3><p class="manual-feature-body">เลือกภาษาที่แสดงและประเทศ/ภูมิภาคที่คุณอาศัยอยู่ในปัจจุบัน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ภาษา</h3><p class="manual-feature-body">เลือกภาษาที่จะใช้ในแอป</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ประเทศ/ภูมิภาคปัจจุบัน</h3><p class="manual-feature-body">รูปแบบวันที่ ตัวเลข และสกุลเงินจะตั้งค่าตามประเทศ/ภูมิภาคที่เลือก</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สกุลเงิน</h3><p class="manual-feature-body">เปลี่ยนการแสดงจำนวนเงินให้ตรงกับสกุลเงินที่ใช้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตั้งค่ารูปแบบเวลา</h3><p class="manual-feature-body">เลือกวิธีแสดงวันที่และเวลา</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตั้งค่าธีม</h3><p class="manual-feature-body">เลือกหน้าจอสว่างหรือมืดให้เหมาะกับแสงรอบตัว</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ข้อมูลของฉัน</h3><p class="manual-feature-body">จัดการค่าเริ่มต้นของคนทำงานและค่าจ้างที่ใช้ซ้ำได้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตั้งค่ากล้อง</h3><p class="manual-feature-body">ตั้งค่าการถ่าย การบันทึกตำแหน่ง และการแสดงข้อมูลให้เหมาะกับการใช้งาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ภาพถ่ายเข้างาน</h3><p class="manual-feature-body">กำหนดให้ถ่ายภาพก่อนเข้างาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ภาพถ่ายการออกงาน</h3><p class="manual-feature-body">กำหนดให้ถ่ายภาพก่อนบันทึกการออกงาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การแก้ไขภาพ</h3><p class="manual-feature-body">อนุญาตให้แก้ไขรายละเอียดรูปภาพและจัดเก็บรูปภาพที่แก้ไข</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การแชร์รูปภาพ</h3><p class="manual-feature-body">แบ่งปันรูปภาพจากรายละเอียดรูปภาพและการเลือกแกลเลอรี่</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>แนบรูปภาพในรายงาน</h3><p class="manual-feature-body">แนบรูปถ่ายแกลเลอรี่ที่ถ่าย ณ วันที่รายงาน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การสั่นขณะถ่ายภาพ</h3><p class="manual-feature-body">แจ้งผลการถ่ายภาพสำเร็จหรือไม่สำเร็จด้วยการสั่น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เสียงชัตเตอร์ขณะถ่ายภาพ</h3><p class="manual-feature-body">มีเสียงชัตเตอร์เมื่อถ่ายภาพ ไม่สามารถปิดเสียงได้ แต่ปรับระดับเสียงได้ตั้งแต่ 1 ถึง 10</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>บันทึกสำเนาที่บีบอัด</h3><p class="manual-feature-body">จัดเก็บสำเนาที่แก้ไขแล้วที่บีบอัดพร้อมกับเก็บต้นฉบับไว้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตั้งค่าแกลเลอรี</h3><p class="manual-feature-body">เลือกขนาดภาพย่อเพื่อดูรูปภาพจำนวนมากพร้อมกันหรือดูภาพให้ชัดขึ้น</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สิทธิ์</h3><p class="manual-feature-body">ตรวจสอบสถานะการอนุญาตที่จำเป็นสำหรับคุณสมบัติ TAIPOPO</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การคุ้มครองบันทึก</h3><p class="manual-feature-body">ดูหลักการบันทึกแหล่งที่มาของรูปภาพ ข้อมูลการถ่าย และประวัติการแก้ไข</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สำรองข้อมูล</h3><p class="manual-feature-body">เก็บสำเนาบันทึกงาน รูป และการตั้งค่าแยกไว้ แล้วตรวจสอบว่าสำเร็จ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สำรองข้อมูลไปยังอุปกรณ์นี้</h3><p class="manual-feature-body">บันทึกข้อมูลสำรองลงในพื้นที่จัดเก็บข้อมูลภายในอุปกรณ์นี้</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สำรองข้อมูลไปยังการ์ด SD หรือ USB</h3><p class="manual-feature-body">บันทึกข้อมูลสำรองไปยังการ์ด SD หรืออุปกรณ์เก็บข้อมูล USB ที่เชื่อมต่ออยู่</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สร้างข้อมูลสำรองภายนอก</h3><p class="manual-feature-body">ส่งสำเนาข้อมูลสำรองไปยังแอปอื่น และตรวจสอบในแอปที่เลือกว่าบันทึกเสร็จแล้ว</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>สำรองข้อมูลไปยัง Google Drive</h3><p class="manual-feature-body">บันทึกข้อมูลสำรองไว้ใน Google Drive</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>จัดการข้อมูลสำรอง Google Drive</h3><p class="manual-feature-body">ตรวจสอบข้อมูลสำรองตามวันที่และลบด้วยตนเอง</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>กู้คืนจาก Google Drive</h3><p class="manual-feature-body">เลือกจากรายการข้อมูลสำรองที่บันทึกไว้ใน Google Drive</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>คืนค่า</h3><p class="manual-feature-body">การกู้คืนจะแทนที่ข้อมูลปัจจุบันด้วยข้อมูลสำรอง จึงควรสำรองข้อมูลปัจจุบันก่อน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตรวจสอบการจัดเก็บและการกู้คืนคลังภาพ</h3><p class="manual-feature-body">ตรวจสอบไฟล์รูปภาพที่ไม่เชื่อมโยงกับบันทึกและล้างหลังจากตรวจยืนยัน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การจัดการข้อมูล</h3><p class="manual-feature-body">จัดการการใช้พื้นที่เก็บข้อมูลและการรีเซ็ตข้อมูล</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การล้างไฟล์ชั่วคราว</h3><p class="manual-feature-body">ลบไฟล์ชั่วคราวที่ไม่จำเป็นเพื่อเพิ่มพื้นที่จัดเก็บ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ถังขยะ</h3><p class="manual-feature-body">คุณสามารถกู้คืนได้จากถังขยะเป็นเวลา 30 วัน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>รีเซ็ตข้อมูลทั้งหมด</h3><p class="manual-feature-body">ลบบันทึกและรูปทั้งหมดที่เก็บในอุปกรณ์นี้ โปรดสำรองข้อมูลก่อน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การตั้งค่าการแจ้งเตือน</h3><p class="manual-feature-body">ใช้เพื่อรับการแจ้งเตือนสำคัญจากแอป</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การสั่นสะเทือน</h3><p class="manual-feature-body">ใช้การสั่นสะเทือนสำหรับการโต้ตอบกับแอป</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>การใช้ข้อมูล</h3><p class="manual-feature-body">เลือกให้อัปโหลดข้อมูลสำรองผ่าน Wi-Fi เท่านั้นหรือใช้ข้อมูลมือถือได้ด้วย</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>คู่มือผู้ใช้</h3><p class="manual-feature-body">เรียนรู้การใช้งานแอปจากหน้าจอแต่ละฟังก์ชันและคำอธิบายไอคอน</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ความช่วยเหลือ</h3><p class="manual-feature-body">ส่งคำถาม รายงานข้อผิดพลาด และข้อเสนอแนะฟังก์ชันทางอีเมล</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>นโยบายความเป็นส่วนตัว</h3><p class="manual-feature-body">ตรวจสอบการรวบรวมข้อมูลและรายละเอียดการจัดการ</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>เกี่ยวกับ</h3><p class="manual-feature-body">ตรวจสอบเวอร์ชันแอป ข้อกำหนดการใช้งาน และใบอนุญาตโอเพนซอร์ส</p></div></article></section></details></section></noscript>
