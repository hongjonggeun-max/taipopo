<noscript><section class="manual-nojs"><p>아래에서 언어를 선택해 전체 사용 안내와 원본 이미지를 확인하세요. 이미지형 보기를 이용하려면 JavaScript를 켜 주세요.</p><p>Choose your language below for the complete guide and original images. Enable JavaScript for the image viewer.</p><details class="manual-nojs-locale" lang="ko" dir="ltr"><summary>한국어</summary><section><h2>1. 메인</h2><p><a class="manual-nojs-original" href="images/ko/guide-main.webp?v=812265c72339" target="_blank" rel="noopener">원본 보기 (새 창): 메인</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>신규 근무지 등록</h3><p class="manual-feature-body">근무지를 등록하면 출퇴근 기록, 정산, 리포트 등에 자동으로 연동됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS 현재 위치로 주소 입력</h3><p class="manual-feature-body">현재 위치의 주소를 가져와 근무지 주소에 입력합니다. 실제 주소를 확인하고 필요한 부분을 수정하세요.</p><p class="manual-feature-notice">GPS로 가져온 주소는 실제 근무지 주소와 다를 수 있습니다. 저장 전에 실제 주소를 다시 확인해 주세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>근무지 변경</h3><p class="manual-feature-body">여러 근무지를 등록하고 필요에 따라 선택하여 사용할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>근무지 · 편집</h3><p class="manual-feature-body">등록한 근무지의 정보와 급여 기본값을 수정합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>출근 · 퇴근</h3><p class="manual-feature-body">출퇴근을 기록하면 근무 시간이 자동 계산되어 정산과 리포트에 반영됩니다.</p><p class="manual-feature-notice">주의: 계산된 근무시간은 정산 및 PDF 미리보기에서 수정할 수 없습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>휴게시간</h3><p class="manual-feature-body">휴게시간을 설정하면 실제 근무시간과 급여 계산에 반영됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>급여 계산 기준</h3><p class="manual-feature-body">시급·일급으로 급여를 자동 계산하고, 주급·월급 등 지급 주기를 정할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>수입 · 수당</h3><p class="manual-feature-body">근무 기록의 단가와 수당을 확인하고 필요한 금액을 수정할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>업무 메모</h3><p class="manual-feature-body">현장 상황과 업무 내용을 기록해 근무 기록과 함께 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영하기</h3><p class="manual-feature-body">현장을 사진으로 기록하고 촬영 결과를 갤러리에서 확인합니다.</p></div></article></section><section><h2>2. 갤러리</h2><p><a class="manual-nojs-original" href="images/ko/guide-gallery.webp?v=7b6208bf0e8e" target="_blank" rel="noopener">원본 보기 (새 창): 갤러리</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>갤러리</h3><p class="manual-feature-body">촬영한 사진을 확인하고 편집하거나 공유합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>검색</h3><p class="manual-feature-body">근무지·기간·분류로 필요한 사진을 찾습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>근무지</h3><p class="manual-feature-body">선택한 근무지에 연결된 사진을 모아 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>전체</h3><p class="manual-feature-body">검색·근무지 조건을 해제하고 전체 사진을 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>일간</h3><p class="manual-feature-body">촬영 날짜별로 사진을 모아 보고 원하는 날짜의 사진을 엽니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>선택</h3><p class="manual-feature-body">여러 사진을 선택해 한 번에 공유하거나 삭제할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>사진</h3><p class="manual-feature-body">사진을 열고 두 손가락으로 확대해 세부 내용을 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>사진 편집</h3><p class="manual-feature-body">촬영한 사진에 표시와 글자를 추가하고 원본으로 복구할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>화살표</h3><p class="manual-feature-body">사진에서 중요한 부분을 눈에 띄게 표시합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>원형 강조</h3><p class="manual-feature-body">사진에서 강조할 부분을 원으로 표시합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>사각 박스</h3><p class="manual-feature-body">확인할 영역을 사각형으로 둘러 표시합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>모자이크</h3><p class="manual-feature-body">공유할 사진에서 가릴 부분에 모자이크를 적용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>텍스트 추가</h3><p class="manual-feature-body">사진에 필요한 설명이나 메모를 남깁니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>텍스트 정렬</h3><p class="manual-feature-body">글상자 안의 글을 왼쪽·가운데·오른쪽으로 맞춰 읽기 좋게 배치합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>텍스트 크기</h3><p class="manual-feature-body">사진에서 읽기 편하도록 추가한 글자의 크기를 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>텍스트 굵기</h3><p class="manual-feature-body">중요한 글자를 더 굵게 표시해 눈에 잘 띄게 합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>색상</h3><p class="manual-feature-body">사진 배경과 구분되도록 추가한 글자와 도형의 색을 정합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>투명도</h3><p class="manual-feature-body">글자와 도형이 사진을 가리는 정도를 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>회전</h3><p class="manual-feature-body">사진을 90도씩 돌려 보기 편한 방향으로 맞춥니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>되돌리기</h3><p class="manual-feature-body">마지막으로 추가한 글자·도형 등의 편집을 취소합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>다시 실행</h3><p class="manual-feature-body">되돌린 글자·도형 등의 편집을 다시 적용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>선택 객체 삭제</h3><p class="manual-feature-body">사진에 추가한 글자나 도형 중 선택한 개체만 제거합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>저장</h3><p class="manual-feature-body">편집본이 사진 상세에 표시됩니다. 촬영 원본은 그대로 보존됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>원본 복구</h3><p class="manual-feature-body">추가한 사진 편집을 제거하고 보존된 촬영 원본으로 되돌립니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>공유</h3><p class="manual-feature-body">현재 편집 결과가 반영된 사진 사본을 다른 앱으로 공유합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>삭제</h3><p class="manual-feature-body">필요 없는 사진을 지울 때 갤러리와 연결 문서 중 적용할 범위를 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>첨부 파일 · 최신순 · 오래된순</h3><p class="manual-feature-body">사진을 첨부할 때 최신순·오래된순으로 정렬해 필요한 사진을 찾습니다.</p></div></article></section><section><h2>3. 정산</h2><p><a class="manual-nojs-original" href="images/ko/guide-settlement.webp?v=de52d4afa858" target="_blank" rel="noopener">원본 보기 (새 창): 정산</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>정산</h3><p class="manual-feature-body">근무 기록과 급여 설정에 따라 정산 금액이 자동 계산됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>일간 · 주간 · 월간</h3><p class="manual-feature-body">날짜·기간을 선택해 일치하는 기록을 표시합니다. 근무지와 검색 조건도 함께 적용됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>검색</h3><p class="manual-feature-body">기간·근무지 등 조건에 맞는 정산 내역을 찾습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>편집</h3><p class="manual-feature-body">저장한 정산 내역도 다시 열어 단가·수당·청구 내용을 수정할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>청구</h3><p class="manual-feature-body">별도로 청구할 금액과 요청·수령 상태를 관리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>첨부 파일</h3><p class="manual-feature-body">갤러리 사진을 선택해 문서에 추가하고 첨부 순서를 정리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF 미리보기 · 편집</h3><p class="manual-feature-body">PDF로 저장하기 전에 편집 가능한 내용과 첨부 사진을 수정할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>저장</h3><p class="manual-feature-body">정산의 저장 버튼은 문서 변경 내용을 저장합니다. PDF는 공유를 눌러 생성한 뒤 대상 앱에서 별도로 저장하거나 전송하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>공유</h3><p class="manual-feature-body">정산 공유에는 PDF와 첨부 사진이 함께 포함됩니다. 공유할 파일 수와 내용을 확인한 뒤 대상 앱을 선택하세요.</p></div></article></section><section><h2>4. 리포트</h2><p><a class="manual-nojs-original" href="images/ko/guide-report.webp?v=1a746c1b64b8" target="_blank" rel="noopener">원본 보기 (새 창): 리포트</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>리포트</h3><p class="manual-feature-body">근무 기록과 첨부 사진을 정리하여 PDF로 만들고 공유할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>일간 · 주간 · 월간 · 검색</h3><p class="manual-feature-body">날짜·기간을 선택해 일치하는 기록을 표시합니다. 근무지와 검색 조건도 함께 적용됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF 미리보기 · 편집</h3><p class="manual-feature-body">PDF로 저장하기 전에 편집 가능한 내용과 첨부 사진을 수정할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>첨부 파일</h3><p class="manual-feature-body">갤러리 사진을 선택해 문서에 추가하고 첨부 순서를 정리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · 저장</h3><p class="manual-feature-body">현재 문서로 PDF를 생성합니다. 외부에 계속 보관하려면 공유를 이용하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>공유</h3><p class="manual-feature-body">현재 PDF를 생성하고 공유 형식과 받을 앱을 선택합니다.</p></div></article></section><section><h2>5. 카메라</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>QR 스캔</h3><p class="manual-feature-body">QR 코드의 웹페이지를 열거나 일반 텍스트를 복사할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>플래시</h3><p class="manual-feature-body">어두운 현장에서 피사체가 잘 보이도록 플래시를 사용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS 위치 기록</h3><p class="manual-feature-body">GPS 기록을 끄면 앱의 사진 기록에 좌표를 저장하지 않습니다. 주소 표시는 별도 설정입니다. 주소 표시를 켜고 위치 권한을 허용하면 현재 위치로 주소를 확인해 표시하고, 촬영 시 사진 기록에 저장할 수 있습니다. 원본 JPEG에 포함된 EXIF는 그대로 보존합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>위치</h3><p class="manual-feature-body">현재 위치를 다시 확인해 촬영 위치 정보를 갱신합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영 정보 표시</h3><p class="manual-feature-body">촬영 정보를 사진에 함께 남길지 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영 정보</h3><p class="manual-feature-body">사진에 남길 근무지·위치·메모와 정보 표시 방식을 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>뒤로가기</h3><p class="manual-feature-body">촬영 화면을 닫고 이전 화면으로 돌아갑니다. 저장한 사진은 유지됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>근무지</h3><p class="manual-feature-body">카메라 촬영 정보에 현재 근무지 이름을 표시합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">촬영 위치를 정확한 좌표로 남깁니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>메모</h3><p class="manual-feature-body">현장 상황이나 필요한 내용을 사진에 함께 기록합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>주소</h3><p class="manual-feature-body">카메라 촬영 정보에 GPS 주소를 표시합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>날짜</h3><p class="manual-feature-body">사진을 언제 촬영했는지 날짜와 시간을 함께 남깁니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>글자 색상</h3><p class="manual-feature-body">사진 배경에 맞춰 촬영 정보가 잘 보이도록 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>글자 투명도 · 가독성 그림자</h3><p class="manual-feature-body">사진 배경에서도 글자가 읽히도록 투명도와 그림자 강도를 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>정보카드 이동</h3><p class="manual-feature-body">사진을 가리지 않도록 촬영 정보카드를 끌어 표시 위치를 조정합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>밝기</h3><p class="manual-feature-body">촬영 밝기를 조절해 현장 내용을 더 잘 담습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>카메라 줌</h3><p class="manual-feature-body">피사체가 원하는 크기로 보이도록 촬영 배율을 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>격자</h3><p class="manual-feature-body">촬영할 때 수평과 구도를 맞추는 데 도움이 됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>카메라 전환</h3><p class="manual-feature-body">전면·후면 카메라를 전환해 원하는 방향으로 촬영합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영하기</h3><p class="manual-feature-body">현장을 사진으로 기록하고 촬영 결과를 갤러리에서 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>최근 촬영 사진 확인</h3><p class="manual-feature-body">최근 촬영한 사진을 열어 촬영 결과를 바로 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>양쪽 가로 촬영</h3><p class="manual-feature-body">기기를 가로로 돌려 넓은 현장도 사진에 담을 수 있습니다.</p></div></article></section><section><h2>6. 설정</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>언어 및 지역 설정</h3><p class="manual-feature-body">처음 사용할 표시 언어와 현재 거주 국가/지역을 선택하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>언어</h3><p class="manual-feature-body">앱에서 사용할 언어를 선택하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>현재 거주 국가/지역</h3><p class="manual-feature-body">선택한 국가/지역을 기준으로 날짜, 숫자 및 통화 표시 형식이 설정됩니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>통화 단위 설정</h3><p class="manual-feature-body">사용하는 통화에 맞게 금액 표시를 변경할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>시간 표시 설정</h3><p class="manual-feature-body">날짜와 시간 표시 방식을 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>테마 설정</h3><p class="manual-feature-body">주변 밝기에 맞춰 밝은 화면이나 어두운 화면을 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>내 정보(관리)</h3><p class="manual-feature-body">불러올 내 정보와 급여 기본값을 관리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>카메라 설정</h3><p class="manual-feature-body">촬영·위치 기록·정보 표시 방식을 사용 환경에 맞게 설정합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>출근 사진</h3><p class="manual-feature-body">출근 시작 전에 사진 촬영을 요구합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>퇴근 사진</h3><p class="manual-feature-body">퇴근 저장 전에 사진 촬영을 요구합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>이미지 편집</h3><p class="manual-feature-body">사진 상세 편집과 편집본 저장을 허용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>사진 공유</h3><p class="manual-feature-body">사진 상세 및 갤러리 선택 화면에서 공유 기능을 사용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>리포트 사진 첨부</h3><p class="manual-feature-body">리포트 날짜에 해당하는 갤러리 사진을 선택해 첨부합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영 햅틱</h3><p class="manual-feature-body">촬영 성공 및 실패를 진동으로 알려줍니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>촬영 셔터음</h3><p class="manual-feature-body">촬영 시 셔터음이 재생됩니다. 소리는 끌 수 없으며 크기는 1~10으로 조절합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>압축 사본 저장</h3><p class="manual-feature-body">원본을 유지하면서 압축 편집본을 저장합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>갤러리 설정</h3><p class="manual-feature-body">사진을 작게 모아 보거나 크게 확인할 수 있도록 썸네일 크기를 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>권한</h3><p class="manual-feature-body">타이포포 기능에 필요한 권한 상태를 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>기록 보호</h3><p class="manual-feature-body">사진 출처와 촬영 정보·편집 이력의 기록 원칙을 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>백업</h3><p class="manual-feature-body">근무 기록과 사진, 설정을 별도 사본으로 보관하고 완료 결과를 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>기기에 백업</h3><p class="manual-feature-body">이 기기의 내부 저장공간에 백업을 저장합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>SD 카드·USB에 백업</h3><p class="manual-feature-body">연결된 SD 카드나 USB 저장장치에 백업을 저장합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>외부 백업 만들기</h3><p class="manual-feature-body">백업 사본을 다른 앱으로 전달합니다. 저장 완료는 선택한 앱에서 확인하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive 백업</h3><p class="manual-feature-body">Google Drive에 백업을 저장합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive 백업 관리</h3><p class="manual-feature-body">날짜별 백업을 확인하고 직접 삭제합니다</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive에서 복구</h3><p class="manual-feature-body">Google Drive에 저장된 백업 목록에서 선택합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>복원</h3><p class="manual-feature-body">저장한 백업으로 현재 앱 데이터를 교체하므로 먼저 현재 데이터도 백업하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>갤러리 저장소 검사·복구</h3><p class="manual-feature-body">기록에 연결되지 않은 사진 파일을 검사하고 확인 후 정리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>데이터 관리</h3><p class="manual-feature-body">저장공간 확인과 데이터 초기화를 관리합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>임시파일 정리</h3><p class="manual-feature-body">불필요한 임시파일을 지워 저장공간을 확보합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>휴지통</h3><p class="manual-feature-body">휴지통에서 30일 동안 복원할 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>전체 데이터 초기화</h3><p class="manual-feature-body">기기에 저장된 기록과 사진을 모두 삭제합니다. 초기화 전에 백업하세요.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>알림 설정</h3><p class="manual-feature-body">중요한 앱 알림을 받을 때 사용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>진동</h3><p class="manual-feature-body">앱 동작에 진동을 사용합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>데이터 사용</h3><p class="manual-feature-body">백업 업로드를 Wi-Fi로만 할지 모바일 데이터도 사용할지 정합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>사용 안내</h3><p class="manual-feature-body">기능별 화면과 아이콘 설명을 보고 앱 사용 방법을 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>고객 지원</h3><p class="manual-feature-body">이메일로 사용 문의·오류 신고·기능 제안을 보낼 수 있습니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>개인정보처리방침</h3><p class="manual-feature-body">데이터 수집 및 처리 내용을 확인합니다.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>앱 정보</h3><p class="manual-feature-body">앱 버전과 이용약관·오픈소스 라이선스를 확인합니다.</p></div></article></section></details><details class="manual-nojs-locale" lang="en" dir="ltr"><summary>English</summary><section><h2>1. Home</h2><p><a class="manual-nojs-original" href="images/en/guide-main.webp?v=8a3287da1738" target="_blank" rel="noopener">View original (new tab): Home</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>New Workplace</h3><p class="manual-feature-body">Register a workplace to link attendance, settlements and reports.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Use current GPS location for address</h3><p class="manual-feature-body">Fill the workplace address from your current location. Check the actual address and edit it as needed.</p><p class="manual-feature-notice">The GPS address may differ from the actual workplace address. Check the actual address before saving.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Change Workplace</h3><p class="manual-feature-body">Register several workplaces and choose the one you need.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Workplace · Edit</h3><p class="manual-feature-body">Edit a registered workplace’s details and default pay settings.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Clock in · Clock out</h3><p class="manual-feature-body">Clocking in and out automatically calculates working time for settlements and reports.</p><p class="manual-feature-notice">Note: Calculated working time cannot be edited in settlements or PDF previews.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Break</h3><p class="manual-feature-body">Set breaks to account for them in actual working time and pay calculations.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Wage Calculation</h3><p class="manual-feature-body">Pay is calculated automatically from hourly or daily rates; choose a weekly, monthly or other payment cycle.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Income · Allowance</h3><p class="manual-feature-body">Check the pay rate and allowances for a work record and adjust amounts as needed.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Work Memo</h3><p class="manual-feature-body">Keep site notes and work details alongside your work records.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Take Photo</h3><p class="manual-feature-body">Record the site in photos and review them in the gallery.</p></div></article></section><section><h2>2. Gallery</h2><p><a class="manual-nojs-original" href="images/en/guide-gallery.webp?v=b0efefa3ef92" target="_blank" rel="noopener">View original (new tab): Gallery</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Gallery</h3><p class="manual-feature-body">View, edit and share your captured photos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Search</h3><p class="manual-feature-body">Find the photos you need by workplace, period and category.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Workplace</h3><p class="manual-feature-body">View photos linked to the selected workplace together.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>All</h3><p class="manual-feature-body">Clear search and workplace filters to view all photos.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Daily</h3><p class="manual-feature-body">Browse photos by capture date and open the date you need.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Select</h3><p class="manual-feature-body">Select several photos to share or delete them together.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photos</h3><p class="manual-feature-body">Open a photo and pinch to zoom in on details.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photo Editor</h3><p class="manual-feature-body">Add marks and text to captured photos and restore the original when needed.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Arrow</h3><p class="manual-feature-body">Highlight important parts of a photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Circle Highlight</h3><p class="manual-feature-body">Circle the part of a photo you want to highlight.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rectangle Box</h3><p class="manual-feature-body">Frame an area with a rectangle to draw attention to it.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Mosaic</h3><p class="manual-feature-body">Apply mosaic to areas you want to conceal in a shared photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Add Text</h3><p class="manual-feature-body">Add useful explanations or notes to a photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Text alignment</h3><p class="manual-feature-body">Align text left, center or right within its box for easier reading.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Text size</h3><p class="manual-feature-body">Adjust added text to a size that is easy to read on the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Bold text</h3><p class="manual-feature-body">Make important text bolder so it stands out.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Color</h3><p class="manual-feature-body">Choose text and shape colors that stand out from the photo background.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Opacity</h3><p class="manual-feature-body">Adjust how much added text and shapes cover the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Rotate</h3><p class="manual-feature-body">Rotate the photo in 90-degree steps for a comfortable viewing direction.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Undo</h3><p class="manual-feature-body">Undo the last text, shape or other mark added to the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Redo</h3><p class="manual-feature-body">Reapply the text, shape or other mark removed with Undo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Delete selected object</h3><p class="manual-feature-body">Remove only the selected text or shape added to the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Save</h3><p class="manual-feature-body">The edited version appears in photo details. The original captured photo is preserved.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restore Original</h3><p class="manual-feature-body">Remove photo edits and return to the preserved captured original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Share</h3><p class="manual-feature-body">Share a photo copy with your current edits to another app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Delete</h3><p class="manual-feature-body">When removing a photo, check whether deletion applies to the gallery or linked documents.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Attachments · Newest first · Oldest first</h3><p class="manual-feature-body">When attaching photos, sort newest or oldest first to find the ones you need.</p></div></article></section><section><h2>3. Settlement</h2><p><a class="manual-nojs-original" href="images/en/guide-settlement.webp?v=1a7c280ec1e4" target="_blank" rel="noopener">View original (new tab): Settlement</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Settlement</h3><p class="manual-feature-body">Settlement amounts are calculated automatically from work records and pay settings.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Daily · Weekly · Monthly</h3><p class="manual-feature-body">Choose a date or period to show matching records; workplace and search filters also apply.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Search</h3><p class="manual-feature-body">Find settlement entries by period, workplace and other conditions.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Edit</h3><p class="manual-feature-body">Reopen saved settlements to edit pay rates, allowances and claims.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Claim</h3><p class="manual-feature-body">Manage separate claims and track their request and receipt status.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Attachments</h3><p class="manual-feature-body">Choose gallery photos to add to a document and arrange their order.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF Preview · Edit</h3><p class="manual-feature-body">Edit available document fields and attached photos before saving as PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Save</h3><p class="manual-feature-body">Save in a settlement saves document changes. To create a PDF, tap Share, then save or send it separately in the destination app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Share</h3><p class="manual-feature-body">Settlement sharing includes the PDF and attached photos. Check the file count and contents before choosing the destination app.</p></div></article></section><section><h2>4. Report</h2><p><a class="manual-nojs-original" href="images/en/guide-report.webp?v=593cd0b921ff" target="_blank" rel="noopener">View original (new tab): Report</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>Report</h3><p class="manual-feature-body">Organize work records and attached photos into a PDF to share.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Daily · Weekly · Monthly · Search</h3><p class="manual-feature-body">Choose a date or period to show matching records; workplace and search filters also apply.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF Preview · Edit</h3><p class="manual-feature-body">Edit available document fields and attached photos before saving as PDF.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Attachments</h3><p class="manual-feature-body">Choose gallery photos to add to a document and arrange their order.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · Save</h3><p class="manual-feature-body">Generate a PDF from the current document; use Share to keep an external copy.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Share</h3><p class="manual-feature-body">Generate the current PDF and choose a sharing format and recipient app.</p></div></article></section><section><h2>5. Camera</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Scan QR code</h3><p class="manual-feature-body">Open web pages from QR codes or copy plain text.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Flash</h3><p class="manual-feature-body">Use flash to make subjects visible in dark locations.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS Location Record</h3><p class="manual-feature-body">When GPS Location Record is off, the app does not save coordinates in the photo record. Show Address is a separate setting. With Show Address on and location permission granted, the app can look up and display the address for your current location and save it to the photo record when you take a photo. EXIF metadata in the original JPEG is preserved as is.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Location</h3><p class="manual-feature-body">Check your current location again to refresh capture location information.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Overlay Info</h3><p class="manual-feature-body">Choose whether to include capture information on the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Capture Info</h3><p class="manual-feature-body">Choose the workplace, location, notes and information style to show on the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Back</h3><p class="manual-feature-body">Close the camera and return to the previous screen; saved photos remain.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Workplace</h3><p class="manual-feature-body">Display the current workplace name in the camera overlay.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">Keep precise coordinates of the capture location.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Memo</h3><p class="manual-feature-body">Record site conditions or useful notes on the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Address</h3><p class="manual-feature-body">Display the GPS address in the camera overlay.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Date</h3><p class="manual-feature-body">Keep the date and time of capture on the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Text color</h3><p class="manual-feature-body">Make capture information easy to read against the photo background.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Text opacity · Readability shadow</h3><p class="manual-feature-body">Adjust opacity and shadow strength so text remains readable against the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Move the information card</h3><p class="manual-feature-body">Drag the capture information card so it does not obscure the photo.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Brightness</h3><p class="manual-feature-body">Adjust exposure to show site details more clearly.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Camera Zoom</h3><p class="manual-feature-body">Adjust the shooting zoom so the subject appears at the size you want.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Grid</h3><p class="manual-feature-body">Use the grid to align the horizon and compose your shot.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Switch camera</h3><p class="manual-feature-body">Switch between front and rear cameras to shoot in the direction you need.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Take Photo</h3><p class="manual-feature-body">Record the site in photos and review them in the gallery.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Check a recent photo</h3><p class="manual-feature-body">Open recent photos to check the results of your shots immediately.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Landscape capture in both directions</h3><p class="manual-feature-body">Turn the device sideways to capture a wider view of the site.</p></div></article></section><section><h2>6. Settings</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>Language and Region</h3><p class="manual-feature-body">Choose the display language and your current country/region.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Language</h3><p class="manual-feature-body">Choose the language to use in the app.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Current country/region</h3><p class="manual-feature-body">Date, number, and currency display formats are set from the selected country/region.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Currency</h3><p class="manual-feature-body">Change how amounts are displayed to match your currency.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Time Format Settings</h3><p class="manual-feature-body">Choose how dates and times are displayed.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Theme Settings</h3><p class="manual-feature-body">Choose a light or dark appearance to suit the surrounding light.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>My Info</h3><p class="manual-feature-body">Manage reusable worker and pay defaults.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Camera Settings</h3><p class="manual-feature-body">Set capture, location recording and information display options for your needs.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Clock-in Photo</h3><p class="manual-feature-body">Require camera capture before clock-in starts.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Clock-out Photo</h3><p class="manual-feature-body">Require camera capture before clock-out is saved.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Image Editing</h3><p class="manual-feature-body">Allow photo detail editing and edited image storage.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Photo Sharing</h3><p class="manual-feature-body">Share photos from photo details and gallery selection.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Report Photo Attachment</h3><p class="manual-feature-body">Attach gallery photos captured on the report date.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Capture Haptic</h3><p class="manual-feature-body">Use vibration feedback for capture success and failure.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Capture Shutter Sound</h3><p class="manual-feature-body">A shutter sound plays when you take a photo. It cannot be turned off; its volume can be adjusted from 1 to 10.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Save Compressed Copy</h3><p class="manual-feature-body">Store a compressed edited copy while keeping the original.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gallery Settings</h3><p class="manual-feature-body">Choose thumbnail sizes to browse more photos at once or see them more clearly.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Permissions</h3><p class="manual-feature-body">Check permission status required for TAIPOPO features.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Record Protection</h3><p class="manual-feature-body">Review how photo sources, capture information and edit history are recorded.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Backup</h3><p class="manual-feature-body">Keep a separate copy of work records, photos and settings, and check completion.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Back up to this device</h3><p class="manual-feature-body">Save the backup to this device’s internal storage.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Back up to SD card or USB</h3><p class="manual-feature-body">Save the backup to a connected SD card or USB storage device.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Create external backup</h3><p class="manual-feature-body">Send a backup copy to another app. Check in the app you choose that it has been saved.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive backup</h3><p class="manual-feature-body">Save backups to Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Manage Google Drive backups</h3><p class="manual-feature-body">Review dated backups and delete them yourself</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restore from Google Drive</h3><p class="manual-feature-body">Choose from the backup list stored in Google Drive.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Restore</h3><p class="manual-feature-body">Restoring replaces current app data with the backup, so back up your current data first.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Gallery Storage Check &amp; Recovery</h3><p class="manual-feature-body">Inspect photo files that are not linked to records and clean them up after checking.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Data Management</h3><p class="manual-feature-body">Manage storage usage and data reset.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Temporary File Cleanup</h3><p class="manual-feature-body">Free up storage space by removing unnecessary temporary files.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Trash</h3><p class="manual-feature-body">You can restore them from Trash for 30 days.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Reset All Data</h3><p class="manual-feature-body">Delete all records and photos stored on this device; back up your data first.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Notification Settings</h3><p class="manual-feature-body">Used to receive important app notifications.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Vibration</h3><p class="manual-feature-body">Use vibration for app interactions.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Data Usage</h3><p class="manual-feature-body">Choose whether backup uploads use Wi-Fi only or also mobile data.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>User Guide</h3><p class="manual-feature-body">Learn how to use the app through feature screenshots and icon explanations.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Support</h3><p class="manual-feature-body">Send questions, bug reports and feature suggestions by email.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Privacy policy</h3><p class="manual-feature-body">Review data collection and handling details.</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>About</h3><p class="manual-feature-body">Check the app version, terms of use and open-source licenses.</p></div></article></section></details><details class="manual-nojs-locale" lang="zh" dir="ltr"><summary>中文</summary><section><h2>1. 首页</h2><p><a class="manual-nojs-original" href="images/zh/guide-main.webp?v=d8d7b43c797f" target="_blank" rel="noopener">查看原图（新标签页）: 首页</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>新工作场所</h3><p class="manual-feature-body">注册工作地点后，考勤记录、结算和报告会自动关联。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>用 GPS 当前位置填写地址</h3><p class="manual-feature-body">将当前位置的地址填入工作地点地址。请核对实际地址并按需修改。</p><p class="manual-feature-notice">GPS获取的地址可能与实际工作地点地址不同。保存前请再次核对实际地址。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>切换工作地点</h3><p class="manual-feature-body">可注册多个工作地点，并按需切换。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>工作地点 · 编辑</h3><p class="manual-feature-body">修改已注册工作地点的信息和默认工资设置。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>上班打卡 · 下班打卡</h3><p class="manual-feature-body">记录上下班后，会自动计算工时并反映在结算和报告中。</p><p class="manual-feature-notice">注意：已计算的工时无法在结算或 PDF 预览中修改。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>休息时间</h3><p class="manual-feature-body">设置休息时间后，会反映在实际工时和工资计算中。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>工资计算</h3><p class="manual-feature-body">按时薪或日薪自动计算工资，并可选择按周、按月等支付周期。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>收入 · 津贴</h3><p class="manual-feature-body">可查看工作记录中的单价和津贴，并按需修改金额。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>工作备忘录</h3><p class="manual-feature-body">记录现场情况和工作内容，并与工作记录一同查看。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>拍照</h3><p class="manual-feature-body">拍摄现场照片，并在图库中查看拍摄结果。</p></div></article></section><section><h2>2. 图库</h2><p><a class="manual-nojs-original" href="images/zh/guide-gallery.webp?v=c2cea7fe7794" target="_blank" rel="noopener">查看原图（新标签页）: 图库</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>图库</h3><p class="manual-feature-body">查看、编辑或分享拍摄的照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>搜索</h3><p class="manual-feature-body">按工作地点、时间段和分类查找所需照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>工作地点</h3><p class="manual-feature-body">集中查看与所选工作地点关联的照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>全部</h3><p class="manual-feature-body">清除搜索和工作地点筛选条件，查看全部照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>每日</h3><p class="manual-feature-body">按拍摄日期浏览照片，并打开所需日期的照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>选择</h3><p class="manual-feature-body">可选择多张照片，一次分享或删除。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>照片</h3><p class="manual-feature-body">打开照片后，可用双指缩放查看细节。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>照片编辑器</h3><p class="manual-feature-body">可在照片中添加标记和文字，并恢复原图。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>箭头</h3><p class="manual-feature-body">突出标记照片中的重要部分。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>圆圈突出显示</h3><p class="manual-feature-body">用圆圈标出照片中需要强调的部分。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>长方形盒子</h3><p class="manual-feature-body">用矩形框标出需要关注的区域。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>马赛克</h3><p class="manual-feature-body">为分享照片中需要遮挡的部分添加马赛克。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>添加文本</h3><p class="manual-feature-body">在照片上添加必要的说明或备注。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文本对齐</h3><p class="manual-feature-body">将文本框内的文字左对齐、居中或右对齐，使其更易阅读。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文字大小</h3><p class="manual-feature-body">调整添加文字的大小，使其在照片中清晰易读。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>粗体文字</h3><p class="manual-feature-body">加粗重要文字，使其更加醒目。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>颜色</h3><p class="manual-feature-body">选择与照片背景容易区分的文字和图形颜色。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>不透明度</h3><p class="manual-feature-body">调整文字和图形遮挡照片的程度。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>旋转</h3><p class="manual-feature-body">将照片以90度为单位旋转至便于查看的方向。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>撤销</h3><p class="manual-feature-body">撤销最后添加的文字、形状等标注。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>重做</h3><p class="manual-feature-body">重新应用已撤销的文字、形状等标注。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>删除选定的对象</h3><p class="manual-feature-body">仅移除照片中选中的文字或图形。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>保存</h3><p class="manual-feature-body">照片详情中会显示编辑版本，拍摄原图保持不变。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>恢复原样</h3><p class="manual-feature-body">移除照片编辑，恢复为保留的拍摄原图。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>分享</h3><p class="manual-feature-body">将包含当前编辑效果的照片副本分享到其他应用。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>删除</h3><p class="manual-feature-body">删除不需要的照片时，请确认应用于图库或关联文档的范围。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>附件 · 最新优先 · 最早优先</h3><p class="manual-feature-body">添加附件时按从新到旧或从旧到新排序，查找所需照片。</p></div></article></section><section><h2>3. 结算</h2><p><a class="manual-nojs-original" href="images/zh/guide-settlement.webp?v=1574e6a99959" target="_blank" rel="noopener">查看原图（新标签页）: 结算</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>结算</h3><p class="manual-feature-body">根据工作记录和工资设置自动计算结算金额。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>每日 · 每周 · 每月</h3><p class="manual-feature-body">选择日期或期间显示匹配记录，地点和搜索筛选也会同时生效。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>搜索</h3><p class="manual-feature-body">按期间、工作地点等条件查找结算记录。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>编辑</h3><p class="manual-feature-body">可重新打开已保存的结算，修改单价、津贴和请款内容。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>请款</h3><p class="manual-feature-body">管理单独请款的金额及申请、收款状态。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>附件</h3><p class="manual-feature-body">从图库选择照片添加到文档，并整理附件顺序。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF预览 · 编辑</h3><p class="manual-feature-body">保存为 PDF 前，可修改允许编辑的内容和附件照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>保存</h3><p class="manual-feature-body">结算中的保存按钮用于保存文档更改。要生成 PDF，请点按分享，然后在目标应用中另行保存或发送。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>分享</h3><p class="manual-feature-body">分享结算时会同时包含 PDF 和附加照片。请先核对文件数量及内容，再选择目标应用。</p></div></article></section><section><h2>4. 报告</h2><p><a class="manual-nojs-original" href="images/zh/guide-report.webp?v=b31853334906" target="_blank" rel="noopener">查看原图（新标签页）: 报告</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>报告</h3><p class="manual-feature-body">可将工作记录和附件照片整理成 PDF 并分享。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>每日 · 每周 · 每月 · 搜索</h3><p class="manual-feature-body">选择日期或期间显示匹配记录，地点和搜索筛选也会同时生效。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF预览 · 编辑</h3><p class="manual-feature-body">保存为 PDF 前，可修改允许编辑的内容和附件照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>附件</h3><p class="manual-feature-body">从图库选择照片添加到文档，并整理附件顺序。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · 保存</h3><p class="manual-feature-body">用当前文档生成PDF；长期存于外部请用分享。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>分享</h3><p class="manual-feature-body">生成当前PDF，并选择分享格式和接收应用。</p></div></article></section><section><h2>5. 相机</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>扫描二维码</h3><p class="manual-feature-body">打开二维码中的网页或复制普通文本。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>闪光灯</h3><p class="manual-feature-body">在较暗现场使用闪光灯，使拍摄对象清晰可见。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS定位记录</h3><p class="manual-feature-body">关闭“GPS定位记录”后，应用不会在照片记录中保存坐标。“显示地址”是独立设置。开启此设置并授予定位权限后，应用可以根据当前位置查询并显示地址，并在拍摄时将地址保存到照片记录中。原始 JPEG 中已有的 EXIF 数据会原样保留。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>地点</h3><p class="manual-feature-body">重新获取当前位置，以更新拍摄位置信息。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>叠加信息</h3><p class="manual-feature-body">选择是否在照片上保留拍摄信息。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>拍摄信息</h3><p class="manual-feature-body">选择要显示在照片上的工作地点、位置、备注及信息样式。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>返回</h3><p class="manual-feature-body">关闭相机返回上一屏，已保存照片保留。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>工作地点</h3><p class="manual-feature-body">在相机叠加层中显示当前工作场所名称。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>全球定位系统</h3><p class="manual-feature-body">用精确坐标记录拍摄位置。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>备忘录</h3><p class="manual-feature-body">将现场情况或所需内容记录在照片上。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>地址</h3><p class="manual-feature-body">在相机叠加层中显示 GPS 地址。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>日期</h3><p class="manual-feature-body">在照片上保留拍摄日期和时间。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文字颜色</h3><p class="manual-feature-body">根据照片背景调整，使拍摄信息清晰可见。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文字不透明度 · 可读性阴影</h3><p class="manual-feature-body">调整透明度和阴影强度，使文字在照片背景上清晰可读。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>移动信息卡</h3><p class="manual-feature-body">拖动拍摄信息卡，避免遮挡照片内容。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>亮度</h3><p class="manual-feature-body">调整拍摄亮度，更清楚地记录现场。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>相机变焦</h3><p class="manual-feature-body">调整拍摄倍率，使主体呈现所需大小。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>网格</h3><p class="manual-feature-body">帮助拍摄时保持水平并安排构图。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>切换相机</h3><p class="manual-feature-body">切换前后摄像头，拍摄所需方向。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>拍照</h3><p class="manual-feature-body">拍摄现场照片，并在图库中查看拍摄结果。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>查看最近拍摄的照片</h3><p class="manual-feature-body">打开最近拍摄的照片，立即查看拍摄结果。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>向左右两个方向横屏拍摄</h3><p class="manual-feature-body">将设备横置，可拍摄更宽的现场画面。</p></div></article></section><section><h2>6. 设置</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>语言和地区</h3><p class="manual-feature-body">选择显示语言和当前居住国家/地区。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>语言</h3><p class="manual-feature-body">选择应用中使用的语言。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>当前国家/地区</h3><p class="manual-feature-body">日期、数字和货币显示格式将根据所选国家/地区设置。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>货币</h3><p class="manual-feature-body">可按所用货币更改金额显示。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>时间格式设置</h3><p class="manual-feature-body">选择日期和时间的显示方式。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>主题设置</h3><p class="manual-feature-body">根据周围光线选择浅色或深色外观。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>我的信息</h3><p class="manual-feature-body">管理可重复使用的员工和工资默认值。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>相机设置</h3><p class="manual-feature-body">根据使用需要设置拍摄、位置记录和信息显示方式。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>上班打卡照片</h3><p class="manual-feature-body">上班打卡前需要用相机拍摄。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>下班打卡照片</h3><p class="manual-feature-body">保存下班记录前需要拍照。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>图像编辑</h3><p class="manual-feature-body">允许照片细节编辑和编辑后的图像存储。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>照片分享</h3><p class="manual-feature-body">可在照片详情或图库选择界面分享照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>报告照片附件</h3><p class="manual-feature-body">附上报告日期拍摄的图库照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>拍摄振动反馈</h3><p class="manual-feature-body">拍摄成功或失败时，通过振动提示结果。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>拍摄快门声</h3><p class="manual-feature-body">拍照时会播放快门声。无法关闭，但可将音量调为1至10。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>保存压缩副本</h3><p class="manual-feature-body">存储压缩的编辑副本，同时保留原始版本。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>图库设置</h3><p class="manual-feature-body">选择缩略图大小，以便同时浏览更多照片或更清楚地查看照片。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>权限</h3><p class="manual-feature-body">检查 TAIPOPO 功能所需的权限状态。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>记录保护</h3><p class="manual-feature-body">了解照片来源、拍摄信息及编辑历史的记录规则。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>备份</h3><p class="manual-feature-body">将工作记录、照片和设置另存为备份副本，并确认完成结果。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>备份到此设备</h3><p class="manual-feature-body">将备份保存到此设备的内部存储空间。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>备份到 SD 卡或 USB</h3><p class="manual-feature-body">将备份保存到已连接的 SD 卡或 USB 存储设备。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>创建外部备份</h3><p class="manual-feature-body">将备份副本发送到其他应用。请在所选应用中确认是否保存完成。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Drive 备份</h3><p class="manual-feature-body">将备份保存到 Google Drive。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>管理 Google Drive 备份</h3><p class="manual-feature-body">按日期查看备份并自行删除</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>从 Google Drive 恢复</h3><p class="manual-feature-body">从 Google Drive 中保存的备份列表中选择。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>恢复</h3><p class="manual-feature-body">恢复会用备份替换当前应用数据，请先备份现有数据。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>图库存储检查和恢复</h3><p class="manual-feature-body">检查未关联任何记录的照片文件，确认后进行清理。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>数据管理</h3><p class="manual-feature-body">管理存储使用和数据重置。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>临时文件清理</h3><p class="manual-feature-body">删除不需要的临时文件，释放存储空间。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>垃圾</h3><p class="manual-feature-body">您可以在 30 天内从“垃圾箱”中恢复它们。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>重置所有数据</h3><p class="manual-feature-body">删除此设备上保存的全部记录和照片，请先备份。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>通知设置</h3><p class="manual-feature-body">用于接收重要的应用通知。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>振动</h3><p class="manual-feature-body">使用振动进行应用交互。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>数据使用情况</h3><p class="manual-feature-body">选择仅通过Wi-Fi上传备份，或同时允许移动数据。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>用户指南</h3><p class="manual-feature-body">通过各功能的画面和图标说明了解应用用法。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>帮助与支持</h3><p class="manual-feature-body">通过电子邮件发送使用咨询、错误报告或功能建议。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>隐私政策</h3><p class="manual-feature-body">检查数据收集和处理细节。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>关于</h3><p class="manual-feature-body">查看应用版本、使用条款和开源许可证。</p></div></article></section></details><details class="manual-nojs-locale" lang="ja" dir="ltr"><summary>日本語</summary><section><h2>1. ホーム</h2><p><a class="manual-nojs-original" href="images/ja/guide-main.webp?v=b11f301998b8" target="_blank" rel="noopener">原本を開く（新しいタブ）: ホーム</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>新しい職場</h3><p class="manual-feature-body">勤務先を登録すると、出退勤記録、精算、レポートに連携されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPSの現在地から住所を入力</h3><p class="manual-feature-body">現在地の住所を勤務先住所に入力します。実際の住所を確認し、必要に応じて修正してください。</p><p class="manual-feature-notice">GPSで取得した住所は実際の勤務先住所と異なる場合があります。保存前に実際の住所を確認してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>職場を変える</h3><p class="manual-feature-body">複数の勤務先を登録し、必要に応じて切り替えられます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>職場 · 編集</h3><p class="manual-feature-body">登録済み勤務先の情報と給与の初期設定を修正します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>出勤 · 退勤</h3><p class="manual-feature-body">出退勤を記録すると勤務時間が自動計算され、精算とレポートに反映されます。</p><p class="manual-feature-notice">注意：計算された勤務時間は、精算およびPDFプレビューでは変更できません。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>休憩時間</h3><p class="manual-feature-body">休憩時間の設定は、実労働時間と給与の計算に反映されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>賃金計算</h3><p class="manual-feature-body">時給・日給から給与を自動計算し、週払い・月払いなどの支払周期を選べます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>収入 · 手当</h3><p class="manual-feature-body">勤務記録の単価と手当を確認し、必要な金額を修正できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>作業メモ</h3><p class="manual-feature-body">現場の状況や作業内容を、勤務記録と一緒に残せます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>写真を撮る</h3><p class="manual-feature-body">現場を写真に記録し、ギャラリーで確認できます。</p></div></article></section><section><h2>2. ギャラリー</h2><p><a class="manual-nojs-original" href="images/ja/guide-gallery.webp?v=08bf3afbf8d3" target="_blank" rel="noopener">原本を開く（新しいタブ）: ギャラリー</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>ギャラリー</h3><p class="manual-feature-body">撮影した写真を確認し、編集や共有ができます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>検索</h3><p class="manual-feature-body">勤務先・期間・分類で、必要な写真を探せます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>職場</h3><p class="manual-feature-body">選択した勤務先に関連する写真をまとめて確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>すべて</h3><p class="manual-feature-body">検索・勤務先の条件を解除して、すべての写真を表示します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>毎日</h3><p class="manual-feature-body">撮影日ごとに写真を確認し、必要な日の写真を開きます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>選択</h3><p class="manual-feature-body">複数の写真を選んで、まとめて共有や削除ができます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>写真</h3><p class="manual-feature-body">写真を開き、2本指で拡大して細部を確認できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>写真編集</h3><p class="manual-feature-body">撮影写真に印や文字を追加し、必要に応じて元の写真に戻せます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>矢印</h3><p class="manual-feature-body">写真の重要な箇所を目立つように示します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>サークルハイライト</h3><p class="manual-feature-body">写真の強調したい部分を円で囲みます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>長方形ボックス</h3><p class="manual-feature-body">注目してほしい範囲を四角で囲みます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>モザイク</h3><p class="manual-feature-body">共有する写真で隠したい箇所にモザイクをかけます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>テキストの追加</h3><p class="manual-feature-body">写真に必要な説明やメモを加えます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>テキストの配置</h3><p class="manual-feature-body">テキスト枠内の文字を左・中央・右に揃えて読みやすく配置します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文字サイズ</h3><p class="manual-feature-body">写真上で読みやすいように、追加した文字の大きさを調整します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>太字のテキスト</h3><p class="manual-feature-body">重要な文字を太くして目立たせます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>色</h3><p class="manual-feature-body">写真の背景と区別しやすい文字や図形の色を選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>不透明度</h3><p class="manual-feature-body">文字や図形が写真を覆う度合いを調整します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>回転</h3><p class="manual-feature-body">写真を90度ずつ回転して見やすい向きにします。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>元に戻す</h3><p class="manual-feature-body">最後に追加した文字や図形などの編集を取り消します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>やり直し</h3><p class="manual-feature-body">取り消した文字や図形などの編集をもう一度適用します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>選択したオブジェクトを削除します</h3><p class="manual-feature-body">写真に追加した文字や図形のうち、選択したものだけを削除します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>保存</h3><p class="manual-feature-body">写真の詳細に編集版が表示されます。撮影した原本はそのまま保持されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>オリジナルの復元</h3><p class="manual-feature-body">追加した編集を取り除き、保存されている撮影原本に戻します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>シェアする</h3><p class="manual-feature-body">現在の編集を反映した写真のコピーを、他のアプリに共有します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>削除</h3><p class="manual-feature-body">不要な写真を削除する際は、ギャラリーや関連文書への適用範囲を確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>添付ファイル · 新しい順 · 古い順</h3><p class="manual-feature-body">写真を添付するときに新しい順・古い順に並べて、必要な写真を探します。</p></div></article></section><section><h2>3. 精算</h2><p><a class="manual-nojs-original" href="images/ja/guide-settlement.webp?v=e6d7f7b07b21" target="_blank" rel="noopener">原本を開く（新しいタブ）: 精算</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>精算</h3><p class="manual-feature-body">勤務記録と給与設定に基づいて、精算額が自動計算されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>毎日 · 毎週 · 毎月</h3><p class="manual-feature-body">日付・期間を選ぶと該当記録を表示します。勤務先・検索条件も適用されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>検索</h3><p class="manual-feature-body">期間や勤務先などの条件で精算内容を探します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>編集</h3><p class="manual-feature-body">保存した精算を開き直し、単価・手当・請求内容を修正できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>請求</h3><p class="manual-feature-body">別途請求する金額と、請求・受領の状態を管理します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>添付ファイル</h3><p class="manual-feature-body">ギャラリーの写真を文書に追加し、添付の順序を整えます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF プレビュー · 編集</h3><p class="manual-feature-body">PDFに保存する前に、編集可能な内容と添付写真を修正できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>保存</h3><p class="manual-feature-body">精算の保存ボタンは文書の変更内容を保存します。PDFは共有をタップして作成し、共有先のアプリで別途保存または送信してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>シェアする</h3><p class="manual-feature-body">精算の共有にはPDFと添付写真が含まれます。ファイル数と内容を確認してから共有先のアプリを選んでください。</p></div></article></section><section><h2>4. レポート</h2><p><a class="manual-nojs-original" href="images/ja/guide-report.webp?v=2033c4a6712f" target="_blank" rel="noopener">原本を開く（新しいタブ）: レポート</a></p><article class="manual-feature"><div class="manual-feature-copy"><h3>レポート</h3><p class="manual-feature-body">勤務記録と添付写真をまとめてPDFにし、共有できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>毎日 · 毎週 · 毎月 · 検索</h3><p class="manual-feature-body">日付・期間を選ぶと該当記録を表示します。勤務先・検索条件も適用されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF プレビュー · 編集</h3><p class="manual-feature-body">PDFに保存する前に、編集可能な内容と添付写真を修正できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>添付ファイル</h3><p class="manual-feature-body">ギャラリーの写真を文書に追加し、添付の順序を整えます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>PDF · 保存</h3><p class="manual-feature-body">現在の文書からPDFを生成します。外部に保管するには共有を使います。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>シェアする</h3><p class="manual-feature-body">現在のPDFを生成し、共有形式と受け取るアプリを選びます。</p></div></article></section><section><h2>5. カメラ</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>QRコードをスキャンします</h3><p class="manual-feature-body">QRコードのウェブページを開いたり、通常のテキストをコピーしたりできます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>フラッシュ</h3><p class="manual-feature-body">暗い場所で被写体が見えるようにフラッシュを使います。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS位置記録</h3><p class="manual-feature-body">「GPS位置記録」をオフにすると、アプリ内の写真記録に座標は保存されません。「住所を表示」は別の設定です。この設定をオンにして位置情報の使用を許可すると、現在地から住所を取得して表示し、撮影時に写真記録へ保存できます。元のJPEGに含まれるEXIFはそのまま保持されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>場所</h3><p class="manual-feature-body">現在地を再確認して、撮影位置の情報を更新します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>オーバーレイ情報</h3><p class="manual-feature-body">写真に撮影情報を一緒に残すかを選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>キャプチャ情報</h3><p class="manual-feature-body">写真に残す勤務先・位置・メモと情報の表示方法を選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>戻る</h3><p class="manual-feature-body">カメラを閉じて前の画面へ戻ります。保存済み写真は残ります。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>職場</h3><p class="manual-feature-body">現在の職場名をカメラオーバーレイに表示します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>GPS</h3><p class="manual-feature-body">撮影位置を正確な座標で残します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>メモ</h3><p class="manual-feature-body">現場の状況や必要なメモを写真に残します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>住所</h3><p class="manual-feature-body">カメラオーバーレイに GPS アドレスを表示します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>日付</h3><p class="manual-feature-body">撮影した日時を写真に残します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>文字の色</h3><p class="manual-feature-body">写真の背景に合わせて、撮影情報を読みやすくします。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>テキストの不透明度 · 可読性の影</h3><p class="manual-feature-body">写真の背景でも文字が読めるように、透明度と影の強さを調整します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>情報カードの移動</h3><p class="manual-feature-body">撮影情報カードをドラッグし、写真を隠さない位置に調整します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>明るさ</h3><p class="manual-feature-body">明るさを調整して現場の様子を写しやすくします。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>カメラズーム</h3><p class="manual-feature-body">被写体を希望の大きさで写せるようにズーム倍率を調整します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>グリッド</h3><p class="manual-feature-body">撮影時に水平や構図を合わせるのに役立ちます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>カメラ切替</h3><p class="manual-feature-body">前面・背面カメラを切り替えて、必要な方向を撮影します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>写真を撮る</h3><p class="manual-feature-body">現場を写真に記録し、ギャラリーで確認できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>最近撮影した写真を確認</h3><p class="manual-feature-body">最近撮影した写真を開き、撮影結果をすぐに確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>左右両方向の横向き撮影</h3><p class="manual-feature-body">端末を横にして、広い現場も撮影できます。</p></div></article></section><section><h2>6. 設定</h2><article class="manual-feature"><div class="manual-feature-copy"><h3>言語と地域</h3><p class="manual-feature-body">表示言語と現在の居住国/地域を選択してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>言語</h3><p class="manual-feature-body">アプリで使用する言語を選択してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>現在の国/地域</h3><p class="manual-feature-body">選択した国/地域に基づいて、日付、数字、通貨の表示形式が設定されます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>通貨</h3><p class="manual-feature-body">使用する通貨に合わせて金額表示を変更できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>時刻形式の設定</h3><p class="manual-feature-body">日付と時刻の表示方法を選択します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>テーマの設定</h3><p class="manual-feature-body">周囲の明るさに合わせてライト表示・ダーク表示を選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>マイ情報</h3><p class="manual-feature-body">再利用する作業者情報と給与の既定値を管理します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>カメラの設定</h3><p class="manual-feature-body">撮影・位置の記録・情報表示を利用環境に合わせて設定します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>出勤の写真</h3><p class="manual-feature-body">出勤を開始する前にカメラのキャプチャを要求します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>退勤写真</h3><p class="manual-feature-body">退勤を保存する前にカメラのキャプチャを要求します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>画像編集</h3><p class="manual-feature-body">写真の詳細編集と編集した画像の保存を許可します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>写真の共有</h3><p class="manual-feature-body">写真の詳細とギャラリーの選択から写真を共有します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>レポート写真添付</h3><p class="manual-feature-body">レポートの日付に撮影したギャラリーの写真を選んで添付します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>キャプチャハプティック</h3><p class="manual-feature-body">キャプチャの成功と失敗には振動フィードバックを使用します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>撮影時のシャッター音</h3><p class="manual-feature-body">撮影時にシャッター音が鳴ります。オフにはできませんが、音量は1〜10で調整できます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>圧縮コピーを保存</h3><p class="manual-feature-body">オリジナルを保持したまま、圧縮して編集したコピーを保存します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ギャラリー設定</h3><p class="manual-feature-body">写真をまとめて見るか大きく確認するかに合わせてサムネイルの大きさを選びます。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>権限</h3><p class="manual-feature-body">TAIPOPO 機能に必要な権限ステータスを確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>記録の保護</h3><p class="manual-feature-body">写真の出所、撮影情報、編集履歴の記録ルールを確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>バックアップ</h3><p class="manual-feature-body">勤務記録・写真・設定のコピーを別に保管し、完了を確認します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>この端末にバックアップ</h3><p class="manual-feature-body">この端末の内部ストレージにバックアップを保存します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>SDカード・USBにバックアップ</h3><p class="manual-feature-body">接続されたSDカードまたはUSBストレージにバックアップを保存します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>外部バックアップを作成</h3><p class="manual-feature-body">バックアップのコピーを他のアプリに渡します。保存が完了したかは、選択したアプリで確認してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Driveバックアップ</h3><p class="manual-feature-body">Google Driveにバックアップを保存します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Driveのバックアップを管理</h3><p class="manual-feature-body">日付ごとのバックアップを確認し、必要に応じて削除できます</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>Google Driveから復元</h3><p class="manual-feature-body">Google Driveに保存されたバックアップ一覧から選択します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>復元</h3><p class="manual-feature-body">復元すると現在のアプリデータがバックアップ内容に置き換わるため、先に現在のデータも保存してください。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ギャラリーストレージのチェックとリカバリ</h3><p class="manual-feature-body">記録に関連付けられていない写真ファイルを調べ、確認後に整理します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>データ管理</h3><p class="manual-feature-body">ストレージの使用状況とデータのリセットを管理します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>一時ファイルのクリーンアップ</h3><p class="manual-feature-body">不要な一時ファイルを削除して、保存容量を確保します。</p></div></article><article class="manual-feature"><div class="manual-feature-copy"><h3>ゴミ箱</h3><p class="manual-feature-body">30 日間はゴミ箱から復元できます。</p></div><
